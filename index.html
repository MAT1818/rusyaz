тых, пять шестых (a partir de 2, o denominador fica no Genitivo plural). Palavras especiais: половина, треть, четверть. Os decimais usam vírgula: 3,5 = три целых пять десятых.","squared":"ao quadrado","a squared.":"a ao quadrado.","cubed":"ao cubo","a cubed.":"a ao cubo.","to the power of n":"elevado a n","a to the power of n.":"a elevado a n.","square root":"raiz quadrada","The square root of nine equals three.":"A raiz quadrada de nove é igual a três.","cube root":"raiz cúbica","The cube root of eight equals two.":"A raiz cúbica de oito é igual a dois.","nth root":"raiz de índice n","The nth root of a.":"A raiz n-ésima de a.","one half":"um meio","One half.":"Um meio.","three quarters":"três quartos","Three quarters.":"Três quartos.","two fifths":"dois quintos","Two fifths.":"Dois quintos.","decimal fraction (comma)":"fração decimal (vírgula)","Three point five.":"Três vírgula cinco.","factorial":"fatorial","Five factorial equals one hundred twenty.":"Cinco fatorial é igual a cento e vinte.","Sets & logic":"Conjuntos e lógica","Set notation, number sets, quantifiers and logical connectives.":"Notação de conjuntos, conjuntos numéricos, quantificadores e conectivos lógicos.","принадлежит + Dative: принадлежит множеству А. является + Instrumental: является подмножеством. After объединение / пересечение the sets are in the Genitive plural: объединение множеств.":"принадлежит + Dativo: принадлежит множеству А. является + Instrumental: является подмножеством. Depois de объединение / пересечение os conjuntos ficam no Genitivo plural: объединение множеств.","belongs to (element of)":"pertence a (elemento de)","x belongs to the set A.":"x pertence ao conjunto A.","does not belong to":"não pertence a","x does not belong to the set A.":"x não pertence ao conjunto A.","empty set":"conjunto vazio","A equals the empty set.":"A é igual ao conjunto vazio.","subset":"subconjunto","A is a subset of B.":"A é um subconjunto de B.","subset or equal":"subconjunto ou igual","A is a subset of B or equal to B.":"A é um subconjunto de B ou igual a B.","union":"união","The union of the sets A and B.":"A união dos conjuntos A e B.","intersection":"interseção","The intersection of the sets A and B.":"A interseção dos conjuntos A e B.","set difference":"diferença de conjuntos","The difference of the sets A and B.":"A diferença dos conjuntos A e B.","natural numbers":"números naturais","n belongs to the set of natural numbers.":"n pertence ao conjunto dos números naturais.","integers":"números inteiros","k belongs to the set of integers.":"k pertence ao conjunto dos números inteiros.","rational numbers":"números racionais","q belongs to the set of rational numbers.":"q pertence ao conjunto dos números racionais.","real numbers":"números reais","x belongs to the set of real numbers.":"x pertence ao conjunto dos números reais.","for all":"para todo","For every x in the set of real numbers.":"Para todo x no conjunto dos números reais.","there exists":"existe","There exists x such that x squared equals four.":"Existe x tal que x ao quadrado é igual a quatro.","implies":"implica","A implies B.":"A implica B.","if and only if":"se e somente se","A if and only if B.":"A se e somente se B.","not (negation)":"não (negação)","Not A.":"Não A.","and (conjunction)":"e (conjunção)","A and B.":"A e B.","or (disjunction)":"ou (disjunção)","A or B.":"A ou B.","Geometry":"Geometria","Signs used for angles, lines, triangles and measurements.":"Sinais usados para ângulos, retas, triângulos e medidas.","Points are read by letter names: ABC → «А-бэ-цэ». перпендикулярна / параллельна + Dative: перпендикулярна прямой бэ. Degrees agree with the number: один градус, два градуса, пять градусов.":"Os pontos são lidos pelos nomes das letras: ABC → «А-бэ-цэ». перпендикулярна / параллельна + Dativo: перпендикулярна прямой бэ. Os graus concordam com o número: один градус, два градуса, пять градусов.","angle":"ângulo","Angle ABC equals ninety degrees.":"O ângulo ABC é igual a noventa graus.","perpendicular to":"perpendicular a","Line a is perpendicular to line b.":"A reta a é perpendicular à reta b.","parallel to":"paralelo a","Line a is parallel to line b.":"A reta a é paralela à reta b.","triangle":"triângulo","Triangle ABC.":"Triângulo ABC.","degree":"grau","Forty-five degrees.":"Quarenta e cinco graus.","arcminute (prime)":"minuto de arco (linha simples)","Thirty arcminutes.":"Trinta minutos de arco.","arcsecond (double prime)":"segundo de arco (linha dupla)","Fifteen arcseconds.":"Quinze segundos de arco.","S equals pi r squared.":"S é igual a pi r ao quadrado.","congruent to":"congruente a","Triangle ABC is congruent to triangle DEF.":"O triângulo ABC é congruente ao triângulo DEF.","similar to":"semelhante a","Triangle ABC is similar to triangle DEF.":"O triângulo ABC é semelhante ao triângulo DEF.","line segment":"segmento de reta","Segment AB equals five centimeters.":"O segmento AB é igual a cinco centímetros.","diameter":"diâmetro","Diameter ten millimeters.":"Diâmetro de dez milímetros.","Functions & calculus":"Funções e cálculo","Function notation, limits, derivatives, integrals, sums and trigonometric functions.":"Notação de funções, limites, derivadas, integrais, somatórios e funções trigonométricas.","стремится к + Dative (к нулю); от … до + Genitive (от нуля до единицы); по + Dative (по икс). f(x) is read «эф от икс» (от + Genitive). Russian writes tg and ctg for tan and cot.":"стремится к + Dativo (к нулю); от … до + Genitivo (от нуля до единицы); по + Dativo (по икс). f(x) lê-se «эф от икс» (от + Genitivo). O russo escreve tg e ctg para tan e cot.","function":"função","f of x equals two x.":"f de x é igual a dois x.","infinity":"infinito","x tends to infinity.":"x tende ao infinito.","tends to":"tende a","x tends to zero.":"x tende a zero.","limit":"limite","The limit of x plus one as x tends to zero equals one.":"O limite de x mais um quando x tende a zero é igual a um.","delta (increment)":"delta (incremento)","Delta x.":"Delta x.","prime (derivative)":"linha (derivada)","f prime of x.":"f linha de x.","derivative":"derivada","d y by d x.":"d y por d x.","partial derivative":"derivada parcial","The partial derivative of f with respect to x.":"A derivada parcial de f em relação a x.","integral":"integral","The integral from zero to one of x dx.":"A integral de zero a um de x dx.","sum":"somatório","The sum of a-i for i from one to n.":"O somatório de a-i para i de um a n.","product":"produtório","The product of a-i for i from one to n.":"O produtório de a-i para i de um a n.","logarithm":"logaritmo","The base-two logarithm of eight equals three.":"O logaritmo de oito na base dois é igual a três.","natural logarithm":"logaritmo natural","The natural logarithm of e equals one.":"O logaritmo natural de e é igual a um.","sine":"seno","The sine of thirty degrees equals zero point five.":"O seno de trinta graus é igual a zero vírgula cinco.","cosine":"cosseno","The cosine of zero degrees equals one.":"O cosseno de zero grau é igual a um.","tangent":"tangente","The tangent of forty-five degrees equals one.":"A tangente de quarenta e cinco graus é igual a um.","cotangent":"cotangente","The cotangent of forty-five degrees equals one.":"A cotangente de quarenta e cinco graus é igual a um.","Greek letters":"Letras gregas","Greek letters are everywhere in formulas. Learn their Russian names, then the Latin letter names used for variables.":"As letras gregas aparecem em todas as fórmulas. Aprenda seus nomes em russo e depois os nomes das letras latinas usadas como variáveis.","Greek letters do not change their form in formulas: «синус альфа», «угол бета», «два пи». The capital Ω also stands for the unit Ом (ohm).":"As letras gregas não mudam de forma nas fórmulas: «синус альфа», «угол бета», «два пи». O Ω maiúsculo também representa a unidade Ом (ohm).","alpha":"alfa","Sine of alpha.":"Seno de alfa.","beta":"beta","Cosine of beta.":"Cosseno de beta.","gamma":"gama","Gamma equals ninety degrees.":"Gama é igual a noventa graus.","delta":"delta","Delta is greater than zero.":"Delta é maior que zero.","epsilon":"épsilon","Epsilon tends to zero.":"Épsilon tende a zero.","theta":"teta","Theta equals thirty degrees.":"Teta é igual a trinta graus.","lambda":"lambda","Lambda equals two.":"Lambda é igual a dois.","Mu equals five.":"Mi é igual a cinco.","Two pi.":"Dois pi.","rho":"rô","Rho equals m divided by V.":"Rô é igual a m dividido por V.","sigma":"sigma","Sigma squared.":"Sigma ao quadrado.","phi":"fi","Phi equals forty-five degrees.":"Fi é igual a quarenta e cinco graus.","psi":"psi","Psi of x.":"Psi de x.","omega":"ômega","Omega equals two pi f.":"Ômega é igual a dois pi f.","capital omega / ohm":"ômega maiúsculo / ohm","R equals five ohms.":"R é igual a cinco ohms.","What is the Russian name of «{s}»?":"Qual é o nome russo de «{s}»?","How do you read «{s}» in Russian?":"Como se lê «{s}» em russo?","«{a}» is the name of «{b}» ({c}).":"«{a}» é o nome de «{b}» ({c}).","That reading belongs to «{b}» ({c}).":"Essa leitura pertence a «{b}» ({c}).","Symbols":"Símbolos","Reading tips":"Dicas de leitura","Latin letters in formulas":"Letras latinas em fórmulas","Example":"Exemplo","Read in Russian":"Leitura em russo","subject":"sujeito","verb":"verbo","time adverb (yesterday)":"advérbio de tempo (ontem)","to whom? (recipient)":"para quem? (destinatário)","what? (direct object)":"o quê? (objeto direto)","where? (в + Prep.)":"onde? (в + Prep.)","with whom? (с + Instr.)":"com quem? (с + Instr.)","around / along (по + Dat.)":"ao redor de / ao longo de (по + Dat.)","where to? (в + Acc.)":"para onde? (в + Acus.)","by what? (на + Prep.)":"em quê? (на + Prep.)","without (без + Gen.)":"sem (без + Gen.)","Yesterday I gave my friend a book in the shop.":"Ontem dei um livro ao meu amigo na loja.","He is walking with his brother around the park.":"Ele está passeando com o irmão pelo parque.","We are going to Moscow by train with friends.":"Estamos indo a Moscou de trem com amigos.","The students are reading a new book without a dictionary.":"Os estudantes estão lendo um livro novo sem dicionário.","The subject — the one who does the action or is being described — stays in the dictionary form: Nominative (кто? что?). Other cases are for objects, recipients, places, etc.":"O sujeito — quem faz a ação ou é descrito — fica na forma do dicionário: Nominativo (кто? что?). Os outros casos servem para objetos, destinatários, lugares etc.","After Это (“this is …”) the noun is the thing being named, so it stays in the Nominative. Compare: Это мой друг — Я вижу моего друга.":"Depois de Это (“isto é …”) o substantivo é a coisa nomeada, por isso fica no Nominativo. Compare: Это мой друг — Я вижу моего друга.","Neuter nouns in the plural: -о → -а, -е → -я (окно → окна, море → моря).":"Substantivos neutros no plural: -о → -а, -е → -я (окно → окна, море → моря).","Plural: -ы after hard consonants (стол → столы, лампа → лампы). After г к х ж ч ш щ you must write -и, never -ы (книга → книги, врач → врачи).":"Plural: -ы depois de consoantes duras (стол → столы, лампа → лампы). Depois de г к х ж ч ш щ escreve-se sempre -и, nunca -ы (книга → книги, врач → врачи).","Soft endings: -й, -ь → -и, and -я → -и in the plural (музей → музеи, тетрадь → тетради, словарь → словари, неделя → недели).":"Terminações moles: -й, -ь → -и, e -я → -и no plural (музей → музеи, тетрадь → тетради, словарь → словари, неделя → недели).","Some plurals are irregular and must be memorized: друг → друзья, брат → братья, сын → сыновья, ребёнок → дети, человек → люди.":"Alguns plurais são irregulares e devem ser decorados: друг → друзья, брат → братья, сын → сыновья, ребёнок → дети, человек → люди.","A group of masculine nouns takes stressed -а/-я in the plural: город → города, дом → дома, учитель → учителя, паспорт → паспорта. Learn them as exceptions.":"Um grupo de substantivos masculinos recebe -а/-я tônico no plural: город → города, дом → дома, учитель → учителя, паспорт → паспорта. Aprenda-os como exceções.","Gender is read from the Nominative ending: consonant/-й = masculine, -а/-я = feminine, -о/-е = neuter. For -ь you must learn it: тетрадь, мать, дочь, площадь are feminine; словарь, день, учитель are masculine.":"O gênero lê-se pela terminação do Nominativo: consoante/-й = masculino, -а/-я = feminino, -о/-е = neutro. Para -ь é preciso decorar: тетрадь, мать, дочь, площадь são femininos; словарь, день, учитель são masculinos.","Demonstratives and possessives copy the noun’s gender: этот / мой (masc.), эта / моя (fem.), это / моё (neut.), эти / мои (pl.). Look at the noun first: этот день, эта книга, это окно.":"Demonstrativos e possessivos copiam o gênero do substantivo: этот / мой (masc.), эта / моя (fem.), это / моё (neutro), эти / мои (pl.). Olhe primeiro o substantivo: этот день, эта книга, это окно.","кто asks about people and animals, что about things and ideas. Both are Nominative when they are the subject; кого / чего are Accusative or Genitive forms.":"кто pergunta por pessoas e animais, что por coisas e ideias. Ambos são Nominativo quando são o sujeito; кого / чего são formas do Acusativo ou Genitivo.","нет / не было / не будет always require the Genitive: the thing that is missing goes into the Genitive — У меня нет времени; Нет мамы.":"нет / не было / не будет exigem sempre o Genitivo: o que falta vai para o Genitivo — У меня нет времени; Нет мамы.","The prepositions у, около, без, для, от, до, из, с (from), кроме, напротив, вокруг, далеко от always take the Genitive. Dative or Prepositional after them is a mistake.":"As preposições у, около, без, для, от, до, из, с (de), кроме, напротив, вокруг, далеко от pedem sempre o Genitivo. Dativo ou Preposicional depois delas é erro.","Genitive plural: -ов/-ев for hard masculine nouns (студентов, музеев), -ей after -ь and ж ч ш щ (учителей, врачей), and NO ending for feminine -а/-я and neuter -о/-е (страниц, писем, окон), often with a fleeting vowel.":"Genitivo plural: -ов/-ев para substantivos masculinos duros (студентов, музеев), -ей depois de -ь e ж ч ш щ (учителей, врачей), e SEM terminação para femininos -а/-я e neutros -о/-е (страниц, писем, окон), muitas vezes com vogal fugaz.","Numbers decide the form: 1 + Nominative; 2, 3, 4 + Genitive singular (два года, три книги); 5 and more, and also много / мало / несколько, + Genitive plural (пять рублей, пять лет, много студентов).":"Os números decidem a forma: 1 + Nominativo; 2, 3, 4 + Genitivo singular (два года, три книги); 5 ou mais, e também много / мало / несколько, + Genitivo plural (пять рублей, пять лет, много студентов).","After у, нет, без, для, от… personal pronouns take their Genitive form: у меня, у тебя, у него, у неё, у нас, у них. After a preposition он / она / они add н- (у него, у неё, у них).":"Depois de у, нет, без, для, от… os pronomes pessoais usam a forma do Genitivo: у меня, у тебя, у него, у неё, у нас, у них. Depois de preposição он / она / они recebem н- (у него, у неё, у них).","The Genitive means “of”: the owner goes into the Genitive and comes AFTER the thing owned — книга брата = the brother’s book; машина Антона = Anton’s car.":"O Genitivo significa “de”: o possuidor vai para o Genitivo e vem DEPOIS da coisa possuída — книга брата = o livro do irmão; машина Антона = o carro de Antón.","Some nouns have special Genitive forms to memorize: время → времени, имя → имени (neuter in -мя); мать → матери, дочь → дочери (feminine).":"Alguns substantivos têm formas especiais de Genitivo para decorar: время → времени, имя → имени (neutros em -мя); мать → матери, дочь → дочери (femininos).","Dates answer какого числа? and use a neuter ordinal in the Genitive: пятого мая, первого января. The month is in the Genitive too.":"As datas respondem a какого числа? e usam um ordinal neutro no Genitivo: пятого мая, первого января. O mês também fica no Genitivo.","The recipient — the person TO or FOR whom you call, give, write, help, tell or advise — is in the Dative (кому? чему?): звонить маме, дарить сестре, помогать другу, рассказать нам.":"O destinatário — a pessoa PARA quem você liga, dá, escreve, ajuda, conta ou aconselha — fica no Dativo (кому? чему?): звонить маме, дарить сестре, помогать другу, рассказать нам.","Feelings, age and надо / можно / нужно put the person in the Dative: Мне холодно, Ему надо идти, Сколько тебе лет? The person is never Nominative or Accusative here.":"Sentimentos, idade e надо / можно / нужно colocam a pessoa no Dativo: Мне холодно, Ему надо идти, Сколько тебе лет? Aqui a pessoa nunca é Nominativo nem Acusativo.","With нравиться the one who likes is in the Dative and the thing liked is the subject: Мне нравится кофе (literally: coffee is pleasing to me).":"Com нравиться, quem gosta fica no Dativo e a coisa de que se gosta é o sujeito: Мне нравится кофе (literalmente: o café é agradável para mim).","к + Dative = toward a person or place: Я иду к врачу. After к, он / она / они add н-: к нему, к ней, к ним. (у + Genitive means “at someone’s place”, not “toward”.)":"к + Dativo = em direção a uma pessoa ou lugar: Я иду к врачу. Depois de к, он / она / они recebem н-: к нему, к ней, к ним. (у + Genitivo significa “na casa de alguém”, não “em direção a”.)","по + Dative = along / around / over: по улице, по парку, по городу. In this meaning по never takes the Accusative or Prepositional.":"по + Dativo = ao longo de / por / em: по улице, по парку, по городу. Nesse sentido, по nunca pede Acusativo nem Preposicional.","The Dative plural is always -ам / -ям, even for irregular plurals: студентам, родителям, друзьям, детям, людям.":"O Dativo plural é sempre -ам / -ям, mesmo nos plurais irregulares: студентам, родителям, друзьям, детям, людям.","Dative of pronouns: мне, тебе, ему, ей, нам, вам, им. Forms like меня / нас / тебя are Accusative or Genitive, and мной / нами are Instrumental.":"Dativo dos pronomes: мне, тебе, ему, ей, нам, вам, им. Formas como меня / нас / тебя são Acusativo ou Genitivo, e мной / нами são Instrumental.","The direct object (кого? что?) is in the Accusative. Feminine -а → -у, -я → -ю (сестра → сестру, книга → книгу, собака → собаку).":"O objeto direto (кого? что?) fica no Acusativo. Feminino -а → -у, -я → -ю (сестра → сестру, книга → книгу, собака → собаку).","Inanimate masculine and neuter nouns do not change in the Accusative: Я вижу стол, окно, парк. Only feminine -а/-я change.":"Substantivos masculinos e neutros inanimados não mudam no Acusativo: Я вижу стол, окно, парк. Só mudam os femininos -а/-я.","Animate masculine singular: Accusative = Genitive — Я знаю брата, Андрея, учителя. (Inanimate masculine stays like the Nominative.)":"Masculino animado no singular: Acusativo = Genitivo — Я знаю брата, Андрея, учителя. (O masculino inanimado fica igual ao Nominativo.)","Animate plural (all genders): Accusative = Genitive plural — Я вижу студентов, подруг, кошек, детей.":"Plural animado (todos os gêneros): Acusativo = Genitivo plural — Я вижу студентов, подруг, кошек, детей.","Inanimate plural: Accusative = Nominative plural — Мы читаем книги, видим окна, берём столы.":"Plural inanimado: Acusativo = Nominativo plural — Мы читаем книги, видим окна, берём столы.","Feminine nouns in -ь never change in the Accusative: Я люблю мать, дочь, тетрадь. Only -а/-я endings change.":"Substantivos femininos em -ь nunca mudam no Acusativo: Я люблю мать, дочь, тетрадь. Só mudam as terminações -а/-я.","Accusative of pronouns: меня, тебя, его, её, нас, вас, их — the same as the Genitive. мне / тебе / мной / тобой are other cases.":"Acusativo dos pronomes: меня, тебя, его, её, нас, вас, их — igual ao Genitivo. мне / тебе / мной / тобой são outros casos.","Adjectives, этот and possessives agree with the noun: feminine → -ую / -юю (новую, эту, мою); animate masculine → -ого / -его (этого, моего); inanimate masculine and plural stay like the Nominative.":"Adjetivos, этот e possessivos concordam com o substantivo: feminino → -ую / -юю (новую, эту, мою); masculino animado → -ого / -его (этого, моего); masculino inanimado e plural ficam como o Nominativo.","в / на + Accusative answers куда? (direction): Мы идём в школу, едем в театр, на работу. Inanimate masculine nouns do not change (в театр); feminine -а → -у. For где? you would use the Prepositional (в театре).":"в / на + Acusativo responde a куда? (direção): Мы идём в школу, едем в театр, на работу. Substantivos masculinos inanimados não mudam (в театр); feminino -а → -у. Para где? usa-se o Preposicional (в театре).","в + Accusative answers когда? for days: в среду, в пятницу, в субботу (feminine days change -а → -у), в понедельник, во вторник.":"в + Acusativo responde a когда? para dias: в среду, в пятницу, в субботу (dias femininos mudam -а → -у), в понедельник, во вторник.","с + Instrumental = “with”: гулять с подругой, чай с сахаром, говорить с преподавателями.":"с + Instrumental = “com”: гулять с подругой, чай с сахаром, говорить с преподавателями.","The tool or means (чем?) is in the Instrumental WITHOUT a preposition: писать ручкой, писать карандашом, резать ножом.":"A ferramenta ou meio (чем?) fica no Instrumental SEM preposição: писать ручкой, писать карандашом, резать ножом.","After быть, стать, работать (and хотеть быть) the profession is in the Instrumental: Он работает врачом, Она хочет быть учительницей, Он хочет стать инженером. (Present tense “to be” has no verb: Он врач.)":"Depois de быть, стать, работать (e хотеть быть) a profissão fica no Instrumental: Он работает врачом, Она хочет быть учительницей, Он хочет стать инженером. (No presente o verbo “ser” não existe: Он врач.)","The verbs заниматься, интересоваться, увлекаться + Instrumental: Я занимаюсь спортом, мы интересуемся музыкой.":"Os verbos заниматься, интересоваться, увлекаться + Instrumental: Я занимаюсь спортом, мы интересуемся музыкой.","над, под, перед, за (behind), рядом с, между + Instrumental when they answer где?: над столом, перед домом, рядом с университетом.":"над, под, перед, за (atrás de), рядом с, между + Instrumental quando respondem a где?: над столом, перед домом, рядом с университетом.","Instrumental endings: masculine / neuter -ом / -ем, feminine -ой / -ей, feminine -ь → -ью (матерью), plural -ами / -ями (друзьями, преподавателями).":"Terminações do Instrumental: masculino / neutro -ом / -ем, feminino -ой / -ей, feminino -ь → -ью (матерью), plural -ами / -ями (друзьями, преподавателями).","Instrumental of pronouns: мной, тобой, им, ей, нами, вами, ими. After a preposition он / она / они add н-: с ним, с ней, с ними. с + мной = со мной.":"Instrumental dos pronomes: мной, тобой, им, ей, нами, вами, ими. Depois de preposição он / она / они recebem н-: с ним, с ней, с ними. с + мной = со мной.","Seasons and parts of the day use the Instrumental with no preposition: зимой, весной, летом, осенью; утром, днём, вечером, ночью.":"Estações do ano e partes do dia usam o Instrumental sem preposição: зимой, весной, летом, осенью; утром, днём, вечером, ночью.","After ж ч ш щ ц an UNSTRESSED ending is -ем / -ей (товарищем, месяцем); a STRESSED one stays -ом / -ой (врачом, карандашом, ножом).":"Depois de ж ч ш щ ц uma terminação ÁTONA é -ем / -ей (товарищем, месяцем); uma TÔNICA continua -ом / -ой (врачом, карандашом, ножом).","в / на + Prepositional answers где? (location): Я живу в Москве, Книга лежит на столе. For куда? (direction) you would use the Accusative.":"в / на + Preposicional responde a где? (lugar): Я живу в Москве, Книга лежит на столе. Para куда? (direção) usa-se o Acusativo.","о (об / обо) + Prepositional means “about”: Мы говорим о маме, думаем о тебе, книга о любви.":"о (об / обо) + Preposicional significa “sobre”: Мы говорим о маме, думаем о тебе, книга о любви.","A short list of masculine nouns takes stressed -у / -ю after в / на instead of -е: в лесу, в саду, в шкафу, на полу, на мосту, на берегу, в году. Memorize them.":"Uma lista curta de substantivos masculinos recebe -у / -ю tônico depois de в / на em vez de -е: в лесу, в саду, в шкафу, на полу, на мосту, на берегу, в году. Decore-os.","Feminine -ь and -ия and neuter -ие take -и in the Prepositional: о любви, в тетради, в России, в общежитии.":"Femininos em -ь e -ия e neutros em -ие recebem -и no Preposicional: о любви, в тетради, в России, в общежитии.","Months use в + Prepositional: в январе, в марте, в мае. Not the Genitive: января appears only in dates (пятого января).":"Os meses usam в + Preposicional: в январе, в марте, в мае. Não o Genitivo: января aparece só nas datas (пятого января).","Transport: ездить на + Prepositional: на автобусе, на метро, на машине. Not the Instrumental.":"Transporte: ездить на + Preposicional: на автобусе, на метро, на машине. Não o Instrumental.","Prepositional of pronouns: обо мне, о тебе, о нём, о ней, о нас, о вас, о них. After a preposition он / она / они add н-: о нём, в ней, на них.":"Preposicional dos pronomes: обо мне, о тебе, о нём, о ней, о нас, о вас, о них. Depois de preposição он / она / они recebem н-: о нём, в ней, на них.","в vs на has no logic; memorize the groups. на = events, open spaces, stations, work: на концерте, на выставке, на работе, на стадионе. в = enclosed or institutional spaces: в школе, в театре, в университете.":"в e на não têm lógica; decore os grupos. на = eventos, espaços abertos, estações, trabalho: на концерте, на выставке, на работе, на стадионе. в = espaços fechados ou institucionais: в школе, в театре, в университете.","This section is coming soon.":"Esta seção será adicionada em breve.","Capital letters (Shift)":"Letras maiúsculas (Shift)","Punctuation":"Pontuação","Digits 1–5":"Dígitos 1–5","Digits 6–0":"Dígitos 6–0","Symbols № % ( ) -":"Símbolos № % ( ) -","Short sentences":"Frases curtas","Commas & questions":"Vírgulas e perguntas","Computer words":"Palavras de informática","Speed: words":"Velocidade: palavras","Speed: sentences":"Velocidade: frases","Text 1":"Texto 1","Text 2":"Texto 2","Final exam":"Prova final","Review":"Revisão","The doer / the thing described":"Quem faz a ação / a coisa descrita","Who is reading? — Mom is reading.":"Quem está lendo? — A mãe está lendo.","After Это (“this is …”)":"Depois de Это (“isto é …”)","Who is this? — This is my friend.":"Quem é este? — Este é meu amigo.","Plural subject":"Sujeito no plural","What is on the table? — Books are lying there.":"O que está sobre a mesa? — Livros estão ali.","Whose + noun (agrees in gender)":"De quem + substantivo (concorda em gênero)","Whose book is this? — This is my book.":"De quem é este livro? — Este é meu livro.","The possessive follows its noun’s case":"O possessivo segue o caso do seu substantivo","Whose sister do you see? — I see my sister.":"A irmã de quem você vê? — Vejo minha irmã.","Which? + noun in the Nominative":"Qual? + substantivo no Nominativo","Which book? — A new book.":"Qual livro? — Um livro novo.","Which? + noun as a direct object":"Qual? + substantivo como objeto direto","Which book are you reading? — I am reading a new book.":"Qual livro você está lendo? — Estou lendo um livro novo.","нет / не было / не будет (absence)":"нет / не было / не будет (ausência)","What is missing? — There is no time.":"O que falta? — Não há tempo.","у кого? (to have)":"у кого? (ter)","Who has a brother? — She has a brother.":"Quem tem um irmão? — Ela tem um irmão.","у, около, без, для, от, до, из, с (from)":"у, около, без, для, от, до, из, с (de)","Near what do you live? — I live near the university.":"Perto de quê você mora? — Moro perto da universidade.","“of” — the owner":"“de” — o possuidor","Whose book is this? — This is my brother’s book.":"De quem é este livro? — Este é o livro do meu irmão.","After 5+ and много / мало / несколько":"Depois de 5+ e много / мало / несколько","How many friends do you have? — I have many friends.":"Quantos amigos você tem? — Tenho muitos amigos.","Dates: какого числа?":"Datas: какого числа?","What date is the lesson? — The lesson is on May 5th.":"Em que data é a aula? — A aula é no dia 5 de maio.","у + кого? (at someone’s place)":"у + кого? (na casa de alguém)","Where are you? — I am at the doctor’s.":"Onde você está? — Estou no médico.","из / с / от + Genitive (origin)":"из / с / от + Genitivo (origem)","Where are you from? — I am from Russia.":"De onde você é? — Sou da Rússia.","звонить, дарить, помогать, писать… (recipient)":"звонить, дарить, помогать, писать… (destinatário)","Whom are you calling? — I am calling Mom.":"Para quem você está ligando? — Estou ligando para a mãe.","Feelings, age, надо / можно":"Sentimentos, idade, надо / можно","How old are you? — I am twenty.":"Quantos anos você tem? — Tenho vinte.","нравиться (liking)":"нравиться (gostar)","Who likes coffee? — I like coffee.":"Quem gosta de café? — Eu gosto de café.","к + кому? (toward someone)":"к + кому? (em direção a alguém)","Whom are you going to? — I am going to the doctor.":"Para quem você está indo? — Estou indo ao médico.","по + чему? (along, around)":"по + чему? (ao longo de, por)","Where are you walking? — We are walking around the park.":"Por onde você está passeando? — Estamos passeando pelo parque.","Plural recipients":"Destinatários no plural","Whom are you helping? — We help the students.":"A quem você está ajudando? — Ajudamos os estudantes.","Direct object, feminine -а / -я":"Objeto direto, feminino -а / -я","Whom do you see? — I see my sister.":"Quem você vê? — Vejo minha irmã.","Animate masculine singular":"Masculino animado no singular","Whom do you know? — I know the brother.":"Quem você conhece? — Conheço o irmão.","Inanimate masculine / neuter":"Masculino / neutro inanimado","What are you reading? — I am reading a magazine.":"O que você está lendo? — Estou lendo uma revista.","Animate plural":"Plural animado","Whom do you see? — I see the students.":"Quem você vê? — Vejo os estudantes.","Inanimate plural":"Plural inanimado","What are you reading? — We are reading books.":"O que você está lendo? — Estamos lendo livros.","Pronoun as an object":"Pronome como objeto","Whom are you waiting for? — I am waiting for you.":"Q несколько","There are many students in the group.":"Há muitos estudantes no grupo.","On May 20.":"Em 20 de maio.","Comparison “than”":"Comparação “do que”","Nevsky Prospect is shorter than Moskovsky Prospect.":"A avenida Nevski é mais curta que a avenida Moskovski.","After prepositions":"Depois de preposições","We live far from the center.":"Moramos longe do centro.","1 · What is the Genitive?":"1 · O que é o Genitivo?","Questions: кого? чего? (of whom / of what). Use it for absence, “of”, having with у, quantity, dates, comparison and after many prepositions.":"Perguntas: кого? чего? (de quem / de quê). Use-o para ausência, “de”, ter com у, quantidade, datas, comparação e depois de muitas preposições.","only -и":"somente -и","Nom → Gen":"Nom → Gen","2 · Singular endings":"2 · Terminações do singular","Masculine and neuter nouns take -а/-я; feminine nouns take -ы/-и. Remember: after к г х ш ж ч щ write only -и.":"Substantivos masculinos e neutros recebem -а/-я; os femininos recebem -ы/-и. Lembre-se: depois de к г х ш ж ч щ escreva apenas -и.","zero ending":"terminação zero","Nom pl → Gen pl":"Nom pl → Gen pl","3 · Plural endings":"3 · Terminações do plural","The Genitive plural has four endings: -ов/-ев, -ей, and the zero ending. Animate plurals in the Accusative copy these forms.":"O Genitivo plural tem quatro terminações: -ов/-ев, -ей e a terminação zero. Os plurais animados no Acusativo copiam essas formas.","plural only":"somente plural","stress: -ов / -ев":"acento: -ов / -ев","fleeting о / е":"о / е fugaz","fleeting ё / е":"ё / е fugaz","Nom sg → Nom pl → Gen pl":"Nom sg → Nom pl → Gen pl","Note":"Observação","4 · Exceptions & fleeting vowels":"4 · Exceções e vogais fugazes","Memorize these. A vowel appears or disappears in the zero ending (окно → окон).":"Decore-as. Uma vogal aparece ou desaparece na terminação zero (окно → окон).","Preposition":"Preposição","Where is the metro station? — Opposite the university.":"Onde fica a estação de metrô? — Em frente à universidade.","Where shall we meet? — At the entrance.":"Onde nos encontramos? — Na entrada.","The lamp stands near the computer.":"A lâmpada está perto do computador.","The chairs stand around the table.":"As cadeiras estão ao redor da mesa.","The floor lamp is to the right of the bed.":"O abajur de pé fica à direita da cama.","I cannot live without music.":"Não consigo viver sem música.","This is a gift for my brother.":"Este é um presente para o meu irmão.","How do I get to St. Petersburg?":"Como chego a São Petersburgo?","5 · Prepositions":"5 · Preposições","All of these take the Genitive. They answer где? (location) and откуда? / до чего? (from / up to).":"Todas estas pedem o Genitivo. Respondem a где? (lugar) e откуда? / до чего? (de onde / até onde).","I work for the director.":"Trabalho para o diretor.","I saw Ivan at Masha’s place.":"Vi o Ivan na casa da Macha.","I asked Andrei for a pen.":"Pedi uma caneta ao Andrei.","I have no time.":"Não tenho tempo.","к кому? (Dat.) vs у кого? (Gen.)":"к кому? (Dat.) vs у кого? (Gen.)","I was at grandma’s, today I am going to my uncle’s.":"Estive na casa da vovó, hoje vou à casa do meu tio.","Pattern":"Padrão","6 · у кого? constructions":"6 · Construções com у кого?","у + Genitive shows who HAS something or where someone is (at someone’s place). The same у is used to take or ask from someone.":"у + Genitivo mostra QUEM TEM algo ou onde alguém está (na casa de alguém). O mesmo у é usado para pegar ou pedir algo a alguém.","Number":"Número","Examples":"Exemplos","How many students are in the group? — Nine.":"Quantos estudantes há no grupo? — Nove.","St. Petersburg has many bridges but few hotels.":"São Petersburgo tem muitas pontes, mas poucos hotéis.","7 · Quantity & numbers":"7 · Quantidade e números","много / мало / немного / несколько + Genitive plural. Numbers decide the form: 1 Nominative, 2–4 Genitive singular, 5+ Genitive plural.":"много / мало / немного / несколько + Genitivo plural. Os números decidem a forma: 1 Nominativo, 2–4 Genitivo singular, 5+ Genitivo plural.","own":"próprio","his · her · their":"dele · dela · deles","this · that":"este · aquele","all":"todos","Masc. & Neut.":"Masc. e Neut.","One of my brothers has a laptop.":"Um dos meus irmãos tem um notebook.","This student has a dictionary.":"Este estudante tem um dicionário.","8 · Adjectives & pronouns":"8 · Adjetivos e pronomes","Question: какого? какой? каких? (чьего? чьей? чьих?). The endings copy the noun.":"Pergunta: какого? какой? каких? (чьего? чьей? чьих?). As terminações copiam o substantivo.","Nom":"Nom","у + Gen":"у + Gen","+ prep. (н-)":"+ prep. (н-)","9 · Personal pronouns":"9 · Pronomes pessoais","After у the pronoun is in the Genitive. After prepositions he/she/they add н-.":"Depois de у o pronome fica no Genitivo. Depois de preposições ele/ela/eles recebem н-.","Dates":"Datas","On May 20, 1981.":"Em 20 de maio de 1981.","A quarter to two. · Five past twelve.":"Um quarto para as duas. · Doze e cinco.","I love the girl without whom I cannot live.":"Amo a moça sem a qual não consigo viver.","который forms":"formas de который","10 · Time, dates & который":"10 · Hora, datas e который","Dates answer какого числа? with a Genitive ordinal. Telling time uses Genitive too. который copies the noun’s gender and number; its case comes from its job.":"As datas respondem a какого числа? com um ordinal no Genitivo. A hora também usa o Genitivo. который copia o gênero e o número do substantivo; seu caso vem da sua função.","11 · Tips":"11 · Dicas","After к г х ш ж ч щ the feminine Genitive is always -и: книги, студентки, секретарши.":"Depois de к г х ш ж ч щ o Genitivo feminino é sempre -и: книги, студентки, секретарши.","Negation нет, не было, не будет always takes the Genitive: У меня нет времени.":"A negação нет, не было, не будет exige sempre o Genitivo: У меня нет времени.","Animate plural Accusative = Genitive plural: Я вижу студентов / У нас нет студентов.":"Acusativo plural animado = Genitivo plural: Я вижу студентов / У нас нет студентов.","Compare: Я люблю сестёр (Acc.) vs У меня нет сестёр (Gen.): same form, different case.":"Compare: Я люблю сестёр (Acus.) vs У меня нет сестёр (Gen.): mesma forma, casos diferentes.","тётя: Genitive plural is тётей (the textbook table shows a typo).":"тётя: o Genitivo plural é тётей (a tabela do livro tem um erro de digitação).","Prepositions у, около, без, для, от, до, из, с, кроме all need the Genitive; learn them as one list.":"As preposições у, около, без, для, от, до, из, с, кроме exigem todas o Genitivo; aprenda-as como uma lista só.","Giving, telling, showing, writing":"Dar, contar, mostrar, escrever","Andrei always gave Maria books.":"André sempre dava livros à Maria.","Calling, helping, advising":"Ligar, ajudar, aconselhar","The mother called her daughter every day.":"A mãe ligava para a filha todos os dias.","Liking: нравиться":"Gostar: нравиться","John likes Anna.":"O João gosta da Anna.","Feelings & states":"Sentimentos e estados","I am cold.":"Estou com frio.","Age":"Idade","Anna must not smoke.":"A Anna não deve fumar.","к + Dative: going to someone":"к + Dativo: ir a alguém","Today I am going to my uncle’s.":"Hoje vou à casa do meu tio.","по + Dative":"по + Dativo","The children walk around the park.":"As crianças passeiam pelo parque.","1 · What is the Dative?":"1 · O que é o Dativo?","Questions: кому? чему? (to/for whom, to/for what). It marks the RECIPIENT: who receives, hears, is helped or disturbed. It is also the case of feelings (мне холодно), age, надо/можно, and of the prepositions к and по.":"Perguntas: кому? чему? (a/para quem, a/para quê). Marca o DESTINATÁRIO: quem recebe, ouve, é ajudado ou incomodado. É também o caso dos sentimentos (мне холодно), da idade, de надо/можно e das preposições к e по.","2 · Verbs with the Dative":"2 · Verbos com o Dativo","Learn the verb together with кому. Both aspects are shown (imperfective / perfective).":"Aprenda o verbo junto com кому. Os dois aspectos são mostrados (imperfectivo / perfectivo).","Nom → Dat":"Nom → Dat","3 · Singular endings":"3 · Terminações do singular","Masculine and neuter take -у/-ю, feminine -е or -и.":"Masculino e neutro recebem -у/-ю, feminino -е ou -и.","feminine":"feminino","irregular plurals":"plurais irregulares","Nom pl → Dat pl":"Nom pl → Dat pl","The teacher advised the students to read more.":"O professor aconselhou os estudantes a lerem mais.","Parents often buy gifts for their sons and daughters.":"Os pais costumam comprar presentes para seus filhos e filhas.","4 · Plural endings":"4 · Terminações do plural","All genders: -ам after hard endings, -ям after soft ones. The word to learn is “-ам / -ям”.":"Todos os gêneros: -ам depois de terminações duras, -ям depois de moles. A forma a aprender é “-ам / -ям”.","Dat":"Dat","к + Dat":"к + Dat","по + Dat":"по + Dat","He always gives me books.":"Ele sempre me dá livros.","I often buy myself ice cream.":"Muitas vezes compro sorvete para mim.","After к and по the pronouns he/she/they take н-: к нему, ко мне.":"Depois de к e по os pronomes ele/ela/eles recebem н-: к нему, ко мне.","such":"tal","one · all":"um · todos","I call my brother John.":"Chamo meu irmão de João.","I showed the way to this tourist.":"Mostrei o caminho a este turista.","We call your parents.":"Ligamos para os seus pais.","6 · Adjectives & pronouns":"6 · Adjetivos e pronomes","Question: какому? какой? каким? (чьему? чьей? чьим?). Endings copy the noun.":"Pergunta: какому? какой? каким? (чьему? чьей? чьим?). As terminações copiam o substantivo.","I felt good yesterday. · I will feel good tomorrow.":"Ontem me senti bem. · Amanhã vou me sentir bem.","нравиться + noun: agrees with the thing liked":"нравиться + substantivo: concorda com a coisa de que se gosta","I liked them very much. · I liked him / it very much.":"Gostei muito deles. · Gostei muito dele / disso.","нравиться + infinitive: always нравится":"нравиться + infinitivo: sempre нравится","Mom likes to cook.":"A mamãe gosta de cozinhar.","нравилось (repeated) vs понравилось (one time)":"нравилось (repetido) vs понравилось (uma vez)","I used to like skiing. · I liked it in Moscow.":"Eu gostava de esquiar. · Gostei de estar em Moscou.","Age of things":"Idade das coisas","How old is St. Petersburg?":"Quantos anos tem São Petersburgo?","кому надо / нужно + infinitive":"кому надо / нужно + infinitivo","We need to study a lot.":"Precisamos estudar muito.","кому можно / нельзя + infinitive":"кому можно / нельзя + infinitivo","You may eat everything.":"Você pode comer tudo.","7 · Feelings, age, нравиться, надо":"7 · Sentimentos, idade, нравиться, надо","Pattern: кому + word + infinitive. Past: было / будет. Age: кому + number + год / года / лет.":"Padrão: кому + palavra + infinitivo. Passado: было / будет. Idade: кому + número + год / года / лет.","у + Gen (where?)":"у + Gen (onde?)","к + Dat (where to?)":"к + Dat (para onde?)","Yesterday I was at grandma’s, today I went to my uncle’s.":"Ontem estive na casa da vovó, hoje fui à casa do meu tio.","Was Anna at your place yesterday? — Yes, she came to me.":"A Anna esteve na sua casa ontem? — Sim, ela veio me ver.","у + Genitive = at someone’s place; к + Dative = toward someone. Verbs: ходить/пойти, ездить/поехать, приходить/приехать.":"у + Genitivo = na casa de alguém; к + Dativo = em direção a alguém. Verbos: ходить/пойти, ездить/поехать, приходить/приехать.","communication & media “by, over”":"comunicação e mídia “por, através de”","by phone · online · by mail · on the radio · on TV":"por telefone · on-line · pelo correio · no rádio · na TV","to miss someone":"sentir falta de alguém","to miss mom · home":"sentir falta da mamãe · de casa","subject: “on / in” a field":"disciplina: “de” / “em” uma área","grammar class · maths exam · history book · economics textbook · literature lecture":"aula de gramática · prova de matemática · livro de história · manual de economia · aula de literatura","movement “along, around”":"movimento “ao longo de, por”","walk along the street · sidewalk · drive along the road · stroll in the park · forest · city":"andar pela rua · calçada · dirigir pela estrada · passear no parque · floresta · cidade","travelling “around”":"viagem “por”","to travel around the world · Europe · Russia":"viajar pelo mundo · Europa · Rússia","repeated places (plural)":"lugares repetidos (plural)","to go along streets · avenues · squares · shops":"ir pelas ruas · avenidas · praças · lojas","Translation":"Tradução","9 · по + Dative":"9 · по + Dativo","Six meanings of по. Learn them as fixed groups.":"Seis significados de по. Aprenda-os como grupos fixos.","I know the man you visited.":"Conheço o homem que você visitou.","I love the friends I often call.":"Amo os amigos para quem ligo com frequência.","You call your own friend.":"Você liga para o seu próprio amigo.","который in the Dative copies gender and number: которому, которой, которым. свой refers to the subject.":"который no Dativo copia o gênero e o número: которому, которой, которым. свой refere-se ao sujeito.","11 · Prepositions":"11 · Preposições","Only к and по take the Dative.":"Somente к e по pedem o Dativo.","12 · Tips":"12 · Dicas","The recipient is in the Dative, the thing given is in the Accusative: Я дарю маме книгу.":"O destinatário fica no Dativo, a coisa dada fica no Acusativo: Я дарю маме книгу.","Feelings need no verb: Мне скучно. Past: Мне было скучно.":"Sentimentos não precisam de verbo: Мне скучно. Passado: Мне было скучно.","нравиться: the person who likes is Dative; the thing liked is the subject: Мне нравится кофе. Мне нравятся фильмы.":"нравиться: quem gosta fica no Dativo; a coisa de que se gosta é o sujeito: Мне нравится кофе. Мне нравятся фильмы.","Dative plural is always -ам / -ям, even for irregular plurals: друзьям, детям, людям.":"O Dativo plural é sempre -ам / -ям, mesmo nos plurais irregulares: друзьям, детям, людям.","Direct object":"Objeto direto","Direction: в / на + Acc":"Direção: в / на + Acus","We go to the park. He goes to work.":"Vamos ao parque. Ele vai ao trabalho.","Time: days, duration, frequency":"Tempo: dias, duração, frequência","I will come on Friday. He slept all night.":"Virei na sexta-feira. Ele dormiu a noite toda.","Thanks for the help. He tells about Russia.":"Obrigado pela ajuda. Ele conta sobre a Rússia.","Price & measure":"Preço e medida","The ticket costs 100 rubles.":"O ingresso custa 100 rublos.","1 · What is the Accusative?":"1 · O que é o Acusativo?","Questions: кого? что? (whom / what). It marks the DIRECT OBJECT, the receiver of the action. It also shows direction (куда?), some time words, price and measure. Two things decide the form: gender and animacy (alive or not).":"Perguntas: кого? что? (quem / o quê). Marca o OBJETO DIRETO, o receptor da ação. Mostra também direção (куда?), algumas palavras de tempo, preço e medida. Duas coisas decidem a forma: o gênero e a animacidade (vivo ou não).","I watch a movie. I know him.":"Assisto a um filme. Eu o conheço.","I count on my father.":"Conto com meu pai.","2 · Verbs with the Accusative":"2 · Verbos com o Acusativo","Learn the verb pairs (imperfective / perfective). Two groups: things (что?) and people (кого?). Some verbs need на + Accusative.":"Aprenda os pares de verbos (imperfectivo / perfectivo). Dois grupos: coisas (что?) e pessoas (кого?). Alguns verbos exigem на + Acusativo.","Masc. inanimate":"Masc. inanimado","= Nom.":"= Nom.","Fem. inanimate":"Fem. inanimado","Fem. -ь":"Fem. -ь","Masc. animate":"Masc. animado","= Gen.":"= Gen.","Fem. animate":"Fem. animado","Full names":"Nomes completos","each part changes":"cada parte muda","Type":"Tipo","Nom → Acc":"Nom → Acus","I see my brother. I see my sister.":"Vejo meu irmão. Vejo minha irmã.","I know Anna and Ivan.":"Conheço a Anna e o Ivan.","3 · Singular nouns":"3 · Substantivos no singular","Inanimate (что?): masculine and neuter do not change; only feminine -а/-я change. Animate (кого?): masculine takes the Genitive form; feminine behaves the same as inanimate.":"Inanimados (что?): masculino e neutro não mudam; só mudam os femininos -а/-я. Animados (кого?): o masculino recebe a forma do Genitivo; o feminino se comporta como o inanimado.","Inanimate":"Inanimado","= Gen. pl.":"= Gen. pl.","memorize":"decorar","After ц":"Depois de ц","Nom pl → Acc pl":"Nom pl → Acus pl","I saw journalists, doctors and teachers.":"Vi jornalistas, médicos e professores.","There are no journalists, doctors or teachers here.":"Não há jornalistas, médicos nem professores aqui.","Everyone loves cats, dogs and children.":"Todos amam gatos, cachorros e crianças.","I have no money and no children.":"Não tenho dinheiro nem filhos.","Accusative":"Acusativo","Genitive":"Genitivo","4 · Plural nouns":"4 · Substantivos no plural","Inanimate plural = Nominative. Animate plural (all genders) = Genitive plural. Compare the two cases on the same word.":"Plural inanimado = Nominativo. Plural animado (todos os gêneros) = Genitivo plural. Compare os dois casos na mesma palavra.","Monday":"segunda-feira","Tuesday":"terça-feira","Wednesday":"quarta-feira","Thursday":"quinta-feira","Friday":"sexta-feira","Saturday":"sábado","Sunday":"domingo","weekend, day off":"fim de semana, dia de folga","Acc: когда?":"Acus: когда?","5 · Days of the week":"5 · Dias da semana","в + Accusative answers когда? (when?). Only feminine days change; во before вторник.":"в + Acusativo responde a когда? (quando?). Só os dias femininos mudam; во antes de вторник.","Acc кого?":"Acus кого?","Gen (у кого?)":"Gen (у кого?)","Irina sings beautifully. Everyone listens to her.":"A Irina canta lindamente. Todos a escutam.","This is my key. I never forget it.":"Esta é a minha chave. Nunca a esqueço.","I will wait for you at the stop.":"Vou esperar você no ponto.","6 · Personal pronouns":"6 · Pronomes pessoais","The Accusative looks exactly like the Genitive (the form after у). The reflexive себя refers back to the subject.":"O Acusativo é idêntico ao Genitivo (a forma depois de у). O reflexivo себя remete ao sujeito.","my · your":"meu · seu","our · your · own":"nosso · seu · próprio","We love your films.":"Adoramos os seus filmes.","She cleaned our room.":"Ela limpou o nosso quarto.","I bought a new blue coat.":"Comprei um casaco azul novo.","7 · Modifiers with INANIMATE nouns":"7 · Modificadores com substantivos INANIMADOS","Masculine and plural stay like the Nominative; only the feminine changes (-ую / -юю).":"Masculino e plural ficam como o Nominativo; só o feminino muda (-ую / -юю).","an interesting novel · a nice person":"um romance interessante · uma pessoa simpática","an interesting book · a nice girl · interesting books · interesting people":"um livro interessante · uma moça simpática · livros interessantes · pessoas interessantes","Why do the endings differ?":"Por que as terminações diferem?","I know this young professor.":"Conheço este jovem professor.","We know Russian folk songs and interesting people.":"Conhecemos canções folclóricas russas e pessoas interessantes.","8 · Modifiers with ANIMATE nouns":"8 · Modificadores com substantivos ANIMADOS","Masculine singular and all plurals now take the Genitive endings; the feminine stays -ую / -юю.":"O masculino singular e todos os plurais recebem agora as terminações do Genitivo; o feminino continua -ую / -юю.","Person":"Pessoa","Own: свой":"Próprio: свой","I took my own book. He took my book.":"Peguei o meu próprio livro. Ele pegou o meu livro.","He loves his own sister. I met his sister.":"Ele ama a própria irmã. Conheci a irmã dele.","свой = belongs to the SUBJECT of the sentence. мой / твой / наш / ваш = someone else’s. его · её · их never change.":"свой = pertence ao SUJEITO da frase. мой / твой / наш / ваш = de outra pessoa. его · её · их nunca mudam.","the whole day · whole week · all the time · all weekend · whole group · all the things":"o dia inteiro · a semana inteira · o tempo todo · o fim de semana todo · o grupo todo · todas as coisas","this sandwich · this letter · this phrase · these texts":"este sanduíche · esta carta · esta frase · estes textos","one sandwich · one rule · one cup of coffee · some people":"um sanduíche · uma regra · uma xícara de café · algumas pessoas","Word":"Palavra","These words agree with the noun and use the endings in tables 7 and 8.":"Essas palavras concordam com o substantivo e usam as terminações das tabelas 7 e 8.","Anton invited his friend Anna to an exhibition.":"O Antón convidou a amiga Anna para uma exposição.","They invited Anton to go to Moscow.":"Convidaram o Antón para ir a Moscou.","Как зовут + Acc":"Как зовут + Acus","What are your parents called? What is our teacher called?":"Como se chamam os seus pais? Como se chama o nosso professor?","11 · Invitations & Как зовут":"11 · Convites e Как зовут","приглашать кого? куда? / пойти, поехать куда? куда = в / на + Accusative. Как зовут + Acc.":"приглашать кого? куда? / пойти, поехать куда? куда = в / на + Acusativo. Как зовут + Acus.","Form":"Forma","I bought a new tie that I liked.":"Comprei uma gravata nova de que gostei.","Andrei fell in love with a girl he recently met.":"André se apaixonou por uma moça que conheceu há pouco.","I know the man you also know.":"Conheço o homem que você também conhece.","We liked the people we met here.":"Gostamos das pessoas que conhecemos aqui.","12 · который in the Accusative":"12 · который no Acusativo","Gender and number come from the noun it replaces; the case is Accusative because it is the object of the second clause.":"O gênero e o número vêm do substantivo que ele substitui; o caso é Acusativo porque é o objeto da segunda oração.","13 · Prepositions":"13 · Preposições","These prepositions take the Accusative.":"Estas preposições pedem o Acusativo.","— Which book did your friend buy? — An interesting one.":"— Que livro o seu amigo comprou? — Um interessante.","— Whom do you love? — My brother.":"— Quem você ama? — Meu irmão.","— I saw your sister. — Which sister did you see? — The older one.":"— Vi a sua irmã. — Qual irmã você viu? — A mais velha.","14 · Question practice":"14 · Prática de perguntas","Ask about the modifier with какого? / какую? / каких?; answer with the matching ending.":"Pergunte sobre o modificador com какого? / какую? / каких?; responda com a terminação correspondente.","15 · Tips":"15 · Dicas","Decision order: 1) feminine -а/-я? → -у/-ю. 2) animate masculine singular or any animate plural? → Genitive form. 3) otherwise = Nominative.":"Ordem de decisão: 1) feminino -а/-я? → -у/-ю. 2) masculino animado no singular ou qualquer plural animado? → forma do Genitivo. 3) caso contrário = Nominativo.","Only living beings (people, animals) are animate; things and plants are not.":"Só os seres vivos (pessoas, animais) são animados; coisas e plantas não são.","Fem. -ь never changes: мать → мать, дочь → дочь, тетрадь → тетрадь.":"Fem. -ь nunca muda: мать → мать, дочь → дочь, тетрадь → тетрадь.","Word order is free: Папу любит мама = Mom loves Dad. The ending shows who is who.":"A ordem das palavras é livre: Папу любит мама = A mamãe ama o papai. A terminação mostra quem é quem.","The textbook table shows тёть; the correct Genitive/Accusative plural is тётей.":"A tabela do livro mostra тёть; o Genitivo/Acusativo plural correto é тётей.","после в / на: куда? (Acc) vs где? (Prep): Я иду в школу — Я в школе.":"после в / на: куда? (Acus) vs где? (Prep): Я иду в школу — Я в школе.","Interest, activity: чем?":"Interesse, atividade: чем?","Before, I used to do sports.":"Antes, eu praticava esportes.","Tool, means: чем?":"Ferramenta, meio: чем?","All people write with a pen.":"Todas as pessoas escrevem com caneta.","Job, role: кем?":"Trabalho, papel: кем?","My father works as a teacher.":"Meu pai trabalha como professor.","Pride, admiration: гордиться, любоваться":"Orgulho, admiração: гордиться, любоваться","The mother is proud of her daughter.":"A mãe tem orgulho da filha.","With: с кем? с чем?":"Com: с кем? с чем?","I go to the cinema with a friend.":"Vou ao cinema com um amigo.","Position: перед, под, над, за, рядом с":"Posição: перед, под, над, за, рядом с","A picture hangs above the table.":"Um quadro está pendurado acima da mesa.","1 · What is the Instrumental?":"1 · O que é o Instrumental?","Questions: чем? кем? (by what? / by whom?). The Instrumental names the tool or means, the person you do things WITH (с кем?), the job or role after быть/стать/работать, and interests.":"Perguntas: чем? кем? (com quê? / por quem?). O Instrumental nomeia a ferramenta ou o meio, a pessoa COM quem você faz as coisas (с кем?), a profissão ou o papel depois de быть/стать/работать e os interesses.","What did you do before? — I did sports.":"O que você fazia antes? — Eu praticava esportes.","What does your sister want to become? — An actress.":"O que a sua irmã quer ser? — Atriz.","In the park we admired nature.":"No parque, admiramos a natureza.","2 · Verbs with the Instrumental":"2 · Verbos com o Instrumental","Learn the verb together with чем? / кем?. Groups: interests and means (чем?), professions (кем?).":"Aprenda o verbo junto com чем? / кем?. Grupos: interesses e meios (чем?), profissões (кем?).","-∅ → -ом (-ем after ж ч ш щ ц unstressed)":"-∅ → -ом (-ем depois de ж ч ш щ ц átono)","-я → -ей (-ёй stressed) · after ц ш ж ч щ → -ей":"-я → -ей (-ёй tônico) · depois de ц ш ж ч щ → -ей","Nom → Instr":"Nom → Instr","My grandfather was an engineer.":"Meu avô era engenheiro.","Artists paint with a brush.":"Os artistas pintam com pincel.","Masculine and neuter take -ом/-ем, feminine -ой/-ей; after ц ш ж ч щ (unstressed) use -ем/-ей.":"Masculino e neutro recebem -ом/-ем, feminino -ой/-ей; depois de ц ш ж ч щ (átono) use -ем/-ей.","с + Instr":"с + Instr","I talked on the phone with a friend.":"Falei ao telefone com um amigo.","In the library I met a Japanese man and an American woman.":"Na biblioteca conheci um japonês e uma americana.","4 · с кем? — with":"4 · с кем? — com","с + Instrumental means “with”. Before some words it becomes со: со мной, со спортсменкой.":"с + Instrumental significa “com”. Diante de algumas palavras vira со: со мной, со спортсменкой.","hard → -ами":"duro → -ами","soft / -и → -ями":"mole / -и → -ями","irregular!":"irregular!","tools: чем?":"ferramentas: чем?","Nom pl → Instr pl":"Nom pl → Instr pl","I go to Pushkin with friends.":"Vou a Púchkin com amigos.","I always consult my parents.":"Sempre consulto meus pais.","Children walk with their parents.":"As crianças passeiam com os pais.","5 · Plural endings":"5 · Terminações do plural","Plural: -ами / -ями for all genders; four irregular plurals must be memorized.":"Plural: -ами / -ями para todos os gêneros; quatro plurais irregulares devem ser decorados.","Instr":"Instr","My sister likes to argue with me.":"Minha irmã gosta de discutir comigo.","We want to go to the theater. Will you come with us?":"Queremos ir ao teatro. Você vem com a gente?","I met him at university.":"Conheci-o na universidade.","After a preposition the pronouns take н-: с ним, с ней, с ними, перед ним. “Что с вами?” = What is wrong with you?":"Depois de preposição os pronomes recebem н-: с ним, с ней, с ними, перед ним. “Что с вами?” = O que há com você?","Answer":"Resposta","What is wrong? Why are you so sad? — Nothing, I am fine.":"O que houve? Por que você está tão triste? — Nada, estou bem.","Что с вами? asks about someone’s condition. Answer: Со мной всё в порядке.":"Что с вами? pergunta pelo estado de alguém. Resposta: Со мной всё в порядке.","Before classes I always drink coffee.":"Antes das aulas sempre tomo café.","The garage is under the house.":"A garagem fica embaixo da casa.","I live next to the university.":"Moro ao lado da universidade.","In class we sit at desks. In the theater I sat behind a woman.":"Na aula sentamos nas carteiras. No teatro sentei atrás de uma mulher.","On Saturday I went to the shop for groceries.":"No sábado fui à loja comprar mantimentos.","8 · Prepositions: перед, под, над, за, рядом с":"8 · Preposições: перед, под, над, за, рядом с","Six prepositions take the Instrumental; learn them by meaning.":"Seis preposições pedem o Instrumental; aprenda-as pelo significado.","joy":"alegria","pleasure":"prazer","interest":"interesse","pride":"orgulho","surprise":"surpresa","difficulty":"dificuldade","ease":"facilidade","anxiety":"ansiedade","hope":"esperança","love":"amor","Noun":"Substantivo","I read your letter with joy.":"Li a sua carta com alegria.","Parents often speak of their children with pride.":"Os pais costumam falar dos filhos com orgulho.","I translated this text with difficulty.":"Traduzi este texto com dificuldade.","We listened to his story with interest.":"Ouvimos a história dele com interesse.","9 · с + abstract noun (how?)":"9 · с + substantivo abstrato (como?)","с + abstract noun answers как? (in what manner).":"с + substantivo abstrato responde a как? (de que maneira).","I talked with your friend.":"Conversei com o seu amigo.","He was meeting my sister.":"Ele estava encontrando a minha irmã.","I talk on the phone with your friends.":"Falo ao telefone com os seus amigos.","I went to the cinema with this girl.":"Fui ao cinema com esta moça.","10 · Adjectives & pronouns":"10 · Adjetivos e pronomes","Endings copy the noun. Question: каким? с каким?":"As terminações copiam o substantivo. Pergunta: каким? с каким?","He lives together with his own parents.":"Ele mora junto com os próprios pais.","I love spending time with my friends.":"Adoro passar tempo com meus amigos.","свой refers to the subject: Я говорю со своим братом; Он говорит с моим братом.":"свой refere-se ao sujeito: Я говорю со своим братом; Он говорит с моим братом.","physics — physicist":"física — físico","ballet — ballerina":"balé — bailarina","photography — photographer":"fotografia — fotógrafo","business — businessman":"negócios — empresário","translation — translator (f.)":"tradução — tradutora (f.)","sport — athlete":"esporte — atleta","computer science — programmer":"informática — programador","Field — job":"Área — profissão","Phrase":"Expressão","What does your father do? — He works as a teacher.":"O que o seu pai faz? — Ele trabalha como professor.","In France I was friends with Paul, Jacques and Josephine.":"Na França fui amigo de Paul, Jacques e Josephine.","He wants to do business and become a businessman.":"Ele quer fazer negócios e se tornar empresário.","12 · Interests and professions":"12 · Interesses e profissões","быть, стать, работать + Instrumental for jobs; interests use заниматься + Instrumental.":"быть, стать, работать + Instrumental para profissões; interesses usam заниматься + Instrumental.","She was a famous ballerina.":"Ela era uma bailarina famosa.","A picture hangs above the big desk.":"Um quadro está pendurado acima da grande escrivaninha.","I am into modern music.":"Interesso-me por música moderna.","Chinese and Japanese write characters with black ink.":"Chineses e japoneses escrevem caracteres com tinta preta.","I went to the dacha with my school friends.":"Fui à dacha com meus colegas de escola.","13 · Adjective + noun":"13 · Adjetivo + substantivo","A noun with an adjective takes the Instrumental ending on both words.":"Um substantivo com adjetivo recebe a terminação do Instrumental nas duas palavras.","Today I met the girl I got to know at the disco.":"Hoje encontrei a moça que conheci na balada.","I do the business my father used to do.":"Faço o negócio que meu pai fazia.","We put up tables above which we hung lamps.":"Montamos mesas acima das quais penduramos lâmpadas.","14 · который in the Instrumental":"14 · который no Instrumental","который keeps gender and number from the noun; the Instrumental ending comes from с / над or the verb.":"который mantém o gênero e o número do substantivo; a terminação do Instrumental vem de с / над ou do verbo.","быть / стать / работать are followed by the Instrumental for jobs: Он стал врачом.":"быть / стать / работать são seguidos do Instrumental para profissões: Он стал врачом.","Present tense has no быть: Он врач (Nominative). Past or future: Он был врачом (Instrumental).":"No presente não há быть: Он врач (Nominativo). No passado ou futuro: Он был врачом (Instrumental).","мать → матерью, дочь → дочерью; irregular plurals: детьми, людьми, дочерьми, лошадьми.":"мать → матерью, дочь → дочерью; plurais irregulares: детьми, людьми, дочерьми, лошадьми.","с means “with” (Instrumental) but “from” with the Genitive: с другом / с работы.":"с significa “com” (Instrumental), mas “de/desde” com o Genitivo: с другом / с работы.","Instrumental is not used after у, около, без, для, от, до, из: those need the Genitive.":"O Instrumental não é usado depois de у, около, без, для, от, до, из: essas pedem o Genitivo.","Location: в / на + where?":"Lugar: в / на + onde?","I live in Moscow. The book is on the table.":"Moro em Moscou. O livro está sobre a mesa.","Topic: о / об + about whom, what?":"Tema: о / об + sobre quem, o quê?","He reads a book about St. Petersburg.":"Ele lê um livro sobre São Petersburgo.","Transport: на + what by?":"Transporte: на + de quê?","We go to the park by bus.":"Vamos ao parque de ônibus.","Months: в + month":"Meses: в + mês","I was in Africa in October.":"Estive na África em outubro.","Events: на + event":"Eventos: на + evento","On Saturday we were at the disco.":"No sábado estivemos na balada.","1 · What is the Prepositional?":"1 · O que é o Preposicional?","Questions: где? о ком? о чём? (where? / about whom, what?). The Prepositional is used ONLY after a preposition: в, на, о, при. It shows location, the topic you talk about, transport you ride, and months.":"Perguntas: где? о ком? о чём? (onde? / sobre quem, o quê?). O Preposicional é usado SOMENTE depois de uma preposição: в, на, о, при. Mostra o lugar, o assunto de que se fala, o transporte que se usa e os meses.","Yesterday I was in the library and read a book about St. Petersburg.":"Ontem estive na biblioteca e li um livro sobre São Petersburgo.","As a child I dreamed about living in Australia.":"Qu
