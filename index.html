const RU={
n_subj:['The subject — the one who does the action or is being described — stays in the dictionary form: Nominative (кто? что?). Other cases are for objects, recipients, places, etc.','فاعل جمله (کسی که کار رو انجام میده یا درباره‌اش حرف میزنیم) همیشه شکل اصلی کلمه‌ست: پادژ ۱ (кто? что?). پادژهای دیگه برای مفعول، گیرنده، مکان و ... هستن.','Le sujet (celui qui fait l’action ou dont on parle) garde la forme du dictionnaire : le nominatif (кто ? что ?). Les autres cas servent pour le COD, le destinataire, le lieu, etc.','الفاعل (من يقوم بالفعل أو من نتحدث عنه) يبقى بصيغته المعجمية: المرفوع (кто؟ что؟). أما بقية الحالات فللمفعول والمتلقي والمكان وغيرها.','Chủ ngữ (người/vật làm hành động hoặc được nói tới) giữ nguyên dạng từ điển: danh cách (кто? что?). Các cách khác dùng cho tân ngữ, người nhận, nơi chốn…'],
n_this:['After Это (“this is …”) the noun is the thing being named, so it stays in the Nominative. Compare: Это мой друг — Я вижу моего друга.','بعد از Это («این … ه») اسم همون چیزیه که معرفی میشه، پس پادژ ۱ می‌مونه. مقایسه کن: Это мой друг — Я вижу моего друга.','Après Это (« c’est … ») le nom reste au nominatif. Comparez : Это мой друг — Я вижу моего друга.','بعد Это («هذا …») يبقى الاسم في المرفوع. قارن: Это мой друг — Я вижу моего друга.','Sau Это (“đây là …”) danh từ giữ danh cách. So sánh: Это мой друг — Я вижу моего друга.'],
n_pl_neut:['Neuter nouns in the plural: -о → -а, -е → -я (окно → окна, море → моря).','اسم‌های خنثی در جمع: -о ← -а، -е ← -я (окно ← окна، море ← моря).','Neutres au pluriel : -о → -а, -е → -я (окно → окна, море → моря).','المحايد في الجمع: -о ← -а و -е ← -я (окно ← окна، море ← моря).','Danh từ trung ở số nhiều: -о → -а, -е → -я (окно → окна, море → моря).'],
n_pl_y:['Plural: -ы after hard consonants (стол → столы, лампа → лампы). After г к х ж ч ш щ you must write -и, never -ы (книга → книги, врач → врачи).','جمع: بعد از صامت سخت -ы (стол ← столы، лампа ← лампы). بعد از г к х ж ч ш щ باید -и نوشت، نه -ы (книга ← книги، врач ← врачи).','Pluriel : -ы après consonne dure (стол → столы, лампа → лампы). Après г к х ж ч ш щ on écrit toujours -и, jamais -ы (книга → книги, врач → врачи).','الجمع: -ы بعد الصامت الصلب (стол ← столы، лампа ← лампы). وبعد г к х ж ч ш щ نكتب -и دائمًا وليس -ы (книга ← книги، врач ← врачи).','Số nhiều: -ы sau phụ âm cứng (стол → столы, лампа → лампы). Sau г к х ж ч ш щ phải viết -и, không bao giờ -ы (книга → книги, врач → врачи).'],
n_pl_soft:['Soft endings: -й, -ь → -и, and -я → -и in the plural (музей → музеи, тетрадь → тетради, словарь → словари, неделя → недели).','پایانه‌های نرم در جمع: -й و -ь ← -и و -я ← -и (музей ← музеи، тетрадь ← тетради، словарь ← словари، неделя ← недели).','Terminaisons molles au pluriel : -й, -ь → -и et -я → -и (музей → музеи, тетрадь → тетради, словарь → словари, неделя → недели).','النهايات الرخوة في الجمع: -й و-ь ← -и و-я ← -и (музей ← музеи، тетрадь ← тетради، словарь ← словари، неделя ← недели).','Đuôi mềm ở số nhiều: -й, -ь → -и và -я → -и (музей → музеи, тетрадь → тетради, словарь → словари, неделя → недели).'],
n_pl_irr:['Some plurals are irregular and must be memorized: друг → друзья, брат → братья, сын → сыновья, ребёнок → дети, человек → люди.','بعضی جمع‌ها بی‌قاعده‌ن و باید حفظ بشن: друг ← друзья، брат ← братья، сын ← сыновья، ребёнок ← дети، человек ← люди.','Certains pluriels sont irréguliers et s’apprennent par cœur : друг → друзья, брат → братья, сын → сыновья, ребёнок → дети, человек → люди.','بعض الجموع شاذة ويجب حفظها: друг ← друзья، брат ← братья، сын ← сыновья، ребёнок ← дети، человек ← люди.','Một số số nhiều bất quy tắc phải học thuộc: друг → друзья, брат → братья, сын → сыновья, ребёнок → дети, человек → люди.'],
n_pl_a:['A group of masculine nouns takes stressed -а/-я in the plural: город → города, дом → дома, учитель → учителя, паспорт → паспорта. Learn them as exceptions.','یه گروه از اسم‌های مذکر تو جمع -а/-я میگیرن: город ← города، дом ← дома، учитель ← учителя، паспорт ← паспорта. اینا استثنا هستن و باید حفظ بشن.','Un groupe de noms masculins prend -а/-я accentué au pluriel : город → города, дом → дома, учитель → учителя, паспорт → паспорта. Ce sont des exceptions.','مجموعة من الأسماء المذكرة تأخذ -а/-я في الجمع: город ← города، дом ← дома، учитель ← учителя، паспорт ← паспорта. هذه استثناءات تُحفظ.','Một nhóm danh từ giống đực dùng -а/-я ở số nhiều: город → города, дом → дома, учитель → учителя, паспорт → паспорта. Đây là ngoại lệ, hãy học thuộc.'],
n_gender:['Gender is read from the Nominative ending: consonant/-й = masculine, -а/-я = feminine, -о/-е = neuter. For -ь you must learn it: тетрадь, мать, дочь, площадь are feminine; словарь, день, учитель are masculine.','جنسیت از پایانه‌ی پادژ ۱ فهمیده میشه: صامت/-й = مذکر، -а/-я = مؤنث، -о/-е = خنثی. برای -ь باید حفظ کنی: тетрадь، мать، дочь، площадь مؤنث و словарь، день، учитель مذکرن.','Le genre se lit à la terminaison du nominatif : consonne/-й = masculin, -а/-я = féminin, -о/-е = neutre. Pour -ь il faut l’apprendre : тетрадь, мать, дочь, площадь sont féminins ; словарь, день, учитель sont masculins.','يُعرف الجنس من نهاية المرفوع: صامت/-й = مذكر، -а/-я = مؤنث، -о/-е = محايد. أما -ь فيجب حفظه: тетрадь، мать، дочь، площадь مؤنثة، وأما словарь، день، учитель فمذكرة.','Giống nhận ra từ đuôi danh cách: phụ âm/-й = đực, -а/-я = cái, -о/-е = trung. Với -ь phải học thuộc: тетрадь, мать, дочь, площадь là giống cái; словарь, день, учитель là giống đực.'],
n_agree:['Demonstratives and possessives copy the noun’s gender: этот / мой (masc.), эта / моя (fem.), это / моё (neut.), эти / мои (pl.). Look at the noun first: этот день, эта книга, это окно.','اشاره و ملکی جنسیت اسم رو کپی میکنن: этот / мой (مذکر)، эта / моя (مؤنث)، это / моё (خنثی)، эти / мои (جمع). اول به اسم نگاه کن: этот день، эта книга، это окно.','Démonstratifs et possessifs prennent le genre du nom : этот / мой (masc.), эта / моя (fém.), это / моё (neutre), эти / мои (pluriel). Regardez d’abord le nom : этот день, эта книга, это окно.','أسماء الإشارة وصيغ الملكية تنسخ جنس الاسم: этот / мой (مذكر)، эта / моя (مؤنث)، это / моё (محايد)، эти / мои (جمع). انظر إلى الاسم أولًا: этот день، эта книга، это окно.','Từ chỉ định và sở hữu theo giống của danh từ: этот / мой (đực), эта / моя (cái), это / моё (trung), эти / мои (số nhiều). Nhìn danh từ trước: этот день, эта книга, это окно.'],
n_who:['кто asks about people and animals, что about things and ideas. Both are Nominative when they are the subject; кого / чего are Accusative or Genitive forms.','кто برای آدم و حیوون، что برای چیزها و مفاهیم. وقتی فاعل باشن هر دو پادژ ۱ هستن؛ кого / чего شکل پادژ ۴ یا ۲ هستن.','кто s’emploie pour les personnes et les animaux, что pour les choses et les idées. Les deux sont au nominatif quand ils sont sujets ; кого / чего sont des formes de l’accusatif ou du génitif.','кто للأشخاص والحيوانات، وчто للأشياء والأفكار. كلاهما في المرفوع حين يكونان فاعلًا؛ أما кого / чего فهما صيغتا المنصوب أو المضاف.','кто hỏi về người và động vật, что hỏi về đồ vật và ý niệm. Cả hai ở danh cách khi làm chủ ngữ; кого / чего là dạng đối cách hoặc sở hữu cách.'],

g_neg:['нет / не было / не будет always require the Genitive: the thing that is missing goes into the Genitive — У меня нет времени; Нет мамы.','нет / не было / не будет همیشه پادژ ۲ میخوان: چیزی که نیست میره پادژ ۲ — У меня нет времени؛ Нет мамы.','нет / не было / не будет exigent toujours le génitif : ce qui manque se met au génitif — У меня нет времени ; Нет мамы.','нет / не было / не будет تتطلب المضاف دائمًا: الشيء المفقود يوضع في المضاف — У меня нет времени؛ Нет мамы.','нет / не было / не будет luôn đi với sở hữu cách: vật không có đặt ở sở hữu cách — У меня нет времени; Нет мамы.'],
g_prep:['The prepositions у, около, без, для, от, до, из, с (from), кроме, напротив, вокруг, далеко от always take the Genitive. Dative or Prepositional after them is a mistake.','حروف اضافه у، около، без، для، от، до، из، с (از)، кроме، напротив، вокруг، далеко от همیشه پادژ ۲ میخوان. پادژ ۳ یا ۶ بعدشون غلطه.','Les prépositions у, около, без, для, от, до, из, с (de), кроме, напротив, вокруг, далеко от veulent toujours le génitif. Le datif ou le prépositionnel après elles est une faute.','الحروف у، около، без، для، от، до، из، с (من)، кроме، напротив، вокруг، далеко от تتطلب المضاف دائمًا. والداتيف أو الجر بعدها خطأ.','Các giới từ у, около, без, для, от, до, из, с (từ), кроме, напротив, вокруг, далеко от luôn đi với sở hữu cách. Dùng tặng cách hay giới cách sau chúng là sai.'],
g_pl:['Genitive plural: -ов/-ев for hard masculine nouns (студентов, музеев), -ей after -ь and ж ч ш щ (учителей, врачей), and NO ending for feminine -а/-я and neuter -о/-е (страниц, писем, окон), often with a fleeting vowel.','جمع پادژ ۲: -ов/-ев برای مذکر سخت (студентов، музеев)، -ей بعد از -ь و ж ч ш щ (учителей، врачей)، و بدون پایانه برای مؤنث -а/-я و خنثی -о/-е (страниц، писем، окон)، معمولاً با یه حرف صدادار متحرک.','Génitif pluriel : -ов/-ев pour les masculins durs (студентов, музеев), -ей après -ь et ж ч ш щ (учителей, врачей), et AUCUNE terminaison pour les féminins en -а/-я et les neutres en -о/-е (страниц, писем, окон), souvent avec une voyelle mobile.','جمع المضاف: -ов/-ев للمذكر الصلب (студентов، музеев)، و-ей بعد -ь و ж ч ш щ (учителей، врачей)، وبلا نهاية للمؤنث -а/-я والمحايد -о/-е (страниц، писем، окон)، غالبًا مع حرف علة متحرك.','Số nhiều sở hữu cách: -ов/-ев cho giống đực cứng (студентов, музеев), -ей sau -ь và ж ч ш щ (учителей, врачей), và KHÔNG đuôi cho giống cái -а/-я và trung -о/-е (страниц, писем, окон), thường có nguyên âm xuất hiện.'],
g_num:['Numbers decide the form: 1 + Nominative; 2, 3, 4 + Genitive singular (два года, три книги); 5 and more, and also много / мало / несколько, + Genitive plural (пять рублей, пять лет, много студентов).','عدد شکل رو تعیین میکنه: ۱ + پادژ ۱؛ ۲، ۳، ۴ + مفردِ پادژ ۲ (два года، три книги)؛ ۵ به بالا و همچنین много / мало / несколько + جمعِ پادژ ۲ (пять рублей، пять лет، много студентов).','Le nombre décide de la forme : 1 + nominatif ; 2, 3, 4 + génitif singulier (два года, три книги) ; 5 et plus, ainsi que много / мало / несколько, + génitif pluriel (пять рублей, пять лет, много студентов).','العدد يحدد الصيغة: ١ + المرفوع؛ ٢ و٣ و٤ + المضاف المفرد (два года، три книги)؛ ٥ فأكثر، وكذلك много / мало / несколько، + جمع المضاف (пять рублей، пять лет، много студентов).','Số đếm quyết định dạng từ: 1 + danh cách; 2, 3, 4 + sở hữu cách số ít (два года, три книги); từ 5 trở lên và cả много / мало / несколько + sở hữu cách số nhiều (пять рублей, пять лет, много студентов).'],
g_pron:['After у, нет, без, для, от… personal pronouns take their Genitive form: у меня, у тебя, у него, у неё, у нас, у них. After a preposition он / она / они add н- (у него, у неё, у них).','بعد از у، нет، без، для، от… ضمیرها شکل پادژ ۲ میگیرن: у меня، у тебя، у него، у неё، у нас، у них. بعد از حرف اضافه он / она / они یه н- اضافه میکنن (у него، у неё، у них).','Après у, нет, без, для, от… les pronoms prennent leur forme du génitif : у меня, у тебя, у него, у неё, у нас, у них. Après une préposition он / она / они ajoutent н- (у него, у неё, у них).','بعد у، нет، без، для، от… تأخذ الضمائر صيغة المضاف: у меня، у тебя، у него، у неё، у нас، у них. وبعد حرف الجر تأخذ он / она / они حرف н- (у него، у неё، у них).','Sau у, нет, без, для, от… đại từ dùng dạng sở hữu cách: у меня, у тебя, у него, у неё, у нас, у них. Sau giới từ, он / она / они thêm н- (у него, у неё, у них).'],
g_poss:['The Genitive means “of”: the owner goes into the Genitive and comes AFTER the thing owned — книга брата = the brother’s book; машина Антона = Anton’s car.','پادژ ۲ یعنی «مالِ»: صاحب چیز میره پادژ ۲ و بعد از چیزِ مالکیت میاد — книга брата = کتابِ برادر؛ машина Антона = ماشینِ آنتون.','Le génitif signifie « de » : le possesseur se met au génitif et vient APRÈS la chose possédée — книга брата = le livre du frère ; машина Антона = la voiture d’Anton.','المضاف يعني «لـ / من»: يوضع المالك في المضاف ويأتي بعد الشيء المملوك — книга брата = كتاب الأخ؛ машина Антона = سيارة أنطون.','Sở hữu cách nghĩa là “của”: chủ sở hữu ở sở hữu cách và đứng SAU vật bị sở hữu — книга брата = sách của anh trai; машина Антона = xe của Anton.'],
g_irr:['Some nouns have special Genitive forms to memorize: время → времени, имя → имени (neuter in -мя); мать → матери, дочь → дочери (feminine).','بعضی اسم‌ها شکل ویژه‌ی پادژ ۲ دارن که باید حفظ بشه: время ← времени، имя ← имени (خنثی با -мя)؛ мать ← матери، дочь ← дочери (مؤنث).','Certains noms ont un génitif particulier à apprendre : время → времени, имя → имени (neutres en -мя) ; мать → матери, дочь → дочери (féminins).','لبعض الأسماء صيغ مضاف خاصة تُحفظ: время ← времени، имя ← имени (محايد بـ -мя)؛ мать ← матери، дочь ← дочери (مؤنث).','Một số danh từ có dạng sở hữu cách đặc biệt cần thuộc: время → времени, имя → имени (trung -мя); мать → матери, дочь → дочери (giống cái).'],
g_date:['Dates answer какого числа? and use a neuter ordinal in the Genitive: пятого мая, первого января. The month is in the Genitive too.','تاریخ جواب какого числа؟ میده و عدد ترتیبیِ خنثی تو پادژ ۲ میاد: пятого мая، первого января. ماه هم پادژ ۲ ه.','Les dates répondent à какого числа ? avec un ordinal neutre au génitif : пятого мая, первого января. Le mois est aussi au génitif.','التواريخ تجيب عن какого числа؟ بعدد ترتيبي محايد في المضاف: пятого мая، первого января. والشهر أيضًا في المضاف.','Ngày tháng trả lời какого числа? bằng số thứ tự giống trung ở sở hữu cách: пятого мая, первого января. Tháng cũng ở sở hữu cách.'],

d_recip:['The recipient — the person TO or FOR whom you call, give, write, help, tell or advise — is in the Dative (кому? чему?): звонить маме, дарить сестре, помогать другу, рассказать нам.','گیرنده — کسی که بهش زنگ میزنی، چیزی میدی، مینویسی، کمک میکنی، تعریف میکنی — پادژ ۳ ه (кому? чему?): звонить маме، дарить сестре، помогать другу، рассказать нам.','Le destinataire — la personne À qui ou POUR qui on téléphone, donne, écrit, aide, raconte — est au datif (кому ? чему ?) : звонить маме, дарить сестре, помогать другу, рассказать нам.','المتلقي — الشخص الذي تتصل به أو تعطيه أو تكتب له أو تساعده أو تروي له — في الداتيف (кому؟ чему؟): звонить маме، дарить сестре، помогать другу، рассказать нам.','Người nhận — người mà bạn gọi, tặng, viết, giúp, kể cho — ở tặng cách (кому? чему?): звонить маме, дарить сестре, помогать другу, рассказать нам.'],
d_feel:['Feelings, age and надо / можно / нужно put the person in the Dative: Мне холодно, Ему надо идти, Сколько тебе лет? The person is never Nominative or Accusative here.','حس‌ها، سن و надо / можно / нужно شخص رو تو پادژ ۳ میذارن: Мне холодно، Ему надо идти، Сколько тебе лет؟ شخص اینجا هیچ‌وقت پادژ ۱ یا ۴ نمیشه.','Sensations, âge et надо / можно / нужно mettent la personne au datif : Мне холодно, Ему надо идти, Сколько тебе лет ? La personne n’est jamais au nominatif ni à l’accusatif ici.','المشاعر والعمر وнадо / можно / нужно تضع الشخص في الداتيف: Мне холодно، Ему надо идти، Сколько тебе лет؟ ولا يكون الشخص هنا مرفوعًا ولا منصوبًا.','Cảm giác, tuổi và надо / можно / нужно đặt người ở tặng cách: Мне холодно, Ему надо идти, Сколько тебе лет? Ở đây người đó không bao giờ ở danh cách hay đối cách.'],
d_like:['With нравиться the one who likes is in the Dative and the thing liked is the subject: Мне нравится кофе (literally: coffee is pleasing to me).','با нравиться، کسی که دوست داره پادژ ۳ ه و چیزی که دوست داره فاعله: Мне нравится кофе (تحت‌اللفظی: قهوه برای من خوشاینده).','Avec нравиться, celui qui aime est au datif et la chose aimée est le sujet : Мне нравится кофе (littéralement : le café plaît à moi).','مع нравиться يكون من يُعجَب في الداتيف والشيء المُعجِب هو الفاعل: Мне нравится кофе (حرفيًا: القهوة تعجبني).','Với нравиться, người thích ở tặng cách và vật được thích là chủ ngữ: Мне нравится кофе (nghĩa đen: cà phê làm tôi vừa lòng).'],
d_k:['к + Dative = toward a person or place: Я иду к врачу. After к, он / она / они add н-: к нему, к ней, к ним. (у + Genitive means “at someone’s place”, not “toward”.)','к + پادژ ۳ = به سمت آدم یا جا: Я иду к врачу. بعد از к، он / она / они یه н- میگیرن: к нему، к ней، к ним. (у + پادژ ۲ یعنی «پیش کسی»، نه «به سمت».)','к + datif = vers une personne ou un lieu : Я иду к врачу. Après к, он / она / они ajoutent н- : к нему, к ней, к ним. (у + génitif = « chez quelqu’un », pas « vers ».)','к + الداتيف = نحو شخص أو مكان: Я иду к врачу. بعد к تأخذ он / она / они حرف н-: к нему، к ней، к ним. (у + المضاف تعني «عند شخص» لا «نحو».)','к + tặng cách = hướng tới người hoặc nơi: Я иду к врачу. Sau к, он / она / они thêm н-: к нему, к ней, к ним. (у + sở hữu cách nghĩa là “ở chỗ ai”, không phải “đến”.)'],
d_po:['по + Dative = along / around / over: по улице, по парку, по городу. In this meaning по never takes the Accusative or Prepositional.','по + پادژ ۳ = در طول / دور و بر / روی: по улице، по парку، по городу. تو این معنی по هیچ‌وقت پادژ ۴ یا ۶ نمیگیره.','по + datif = le long de / dans / à travers : по улице, по парку, по городу. Dans ce sens по ne prend jamais l’accusatif ni le prépositionnel.','по + الداتيف = على امتداد / في أنحاء: по улице، по парку، по городу. بهذا المعنى لا تأخذ по المنصوب ولا الجر أبدًا.','по + tặng cách = dọc theo / khắp / quanh: по улице, по парку, по городу. Với nghĩa này по không bao giờ đi với đối cách hay giới cách.'],
d_pl:['The Dative plural is always -ам / -ям, even for irregular plurals: студентам, родителям, друзьям, детям, людям.','جمع پادژ ۳ همیشه -ам / -ям ه، حتی تو جمع‌های بی‌قاعده: студентам، родителям، друзьям، детям، людям.','Le datif pluriel est toujours -ам / -ям, même pour les pluriels irréguliers : студентам, родителям, друзьям, детям, людям.','جمع الداتيف دائمًا -ам / -ям حتى في الجموع الشاذة: студентам، родителям، друзьям، детям، людям.','Số nhiều tặng cách luôn là -ам / -ям, kể cả số nhiều bất quy tắc: студентам, родителям, друзьям, детям, людям.'],
d_pron:['Dative of pronouns: мне, тебе, ему, ей, нам, вам, им. Forms like меня / нас / тебя are Accusative or Genitive, and мной / нами are Instrumental.','پادژ ۳ ضمایر: мне، тебе، ему، ей، нам، вам، им. شکل‌هایی مثل меня / нас / тебя پادژ ۴ یا ۲ هستن و мной / нами پادژ ۵.','Datif des pronoms : мне, тебе, ему, ей, нам, вам, им. Les formes меня / нас / тебя sont à l’accusatif ou au génitif, et мной / нами à l’instrumental.','الداتيف للضمائر: мне، тебе، ему، ей، нам، вам، им. أما меня / нас / тебя فمنصوب أو مضاف، وмной / нами أداة.','Tặng cách của đại từ: мне, тебе, ему, ей, нам, вам, им. Các dạng меня / нас / тебя là đối cách hoặc sở hữu cách, còn мной / нами là công cụ cách.'],

a_obj:['The direct object (кого? что?) is in the Accusative. Feminine -а → -у, -я → -ю (сестра → сестру, книга → книгу, собака → собаку).','مفعول مستقیم (кого؟ что؟) پادژ ۴ ه. مؤنث -а ← -у، -я ← -ю (сестра ← сестру، книга ← книгу، собака ← собаку).','Le COD (кого ? что ?) est à l’accusatif. Féminin -а → -у, -я → -ю (сестра → сестру, книга → книгу, собака → собаку).','المفعول به (кого؟ что؟) في المنصوب. المؤنث -а ← -у و-я ← -ю (сестра ← сестру، книга ← книгу، собака ← собаку).','Tân ngữ trực tiếp (кого? что?) ở đối cách. Giống cái -а → -у, -я → -ю (сестра → сестру, книга → книгу, собака → собаку).'],
a_inan:['Inanimate masculine and neuter nouns do not change in the Accusative: Я вижу стол, окно, парк. Only feminine -а/-я change.','اسم‌های بی‌جانِ مذکر و خنثی تو پادژ ۴ تغییر نمیکنن: Я вижу стол، окно، парк. فقط مؤنث -а/-я عوض میشه.','Les noms inanimés masculins et neutres ne changent pas à l’accusatif : Я вижу стол, окно, парк. Seuls les féminins en -а/-я changent.','الأسماء غير الحية المذكرة والمحايدة لا تتغير في المنصوب: Я вижу стол، окно، парк. فقط المؤنث -а/-я يتغير.','Danh từ vô sinh giống đực và trung không đổi ở đối cách: Я вижу стол, окно, парк. Chỉ giống cái -а/-я đổi.'],
a_anim:['Animate masculine singular: Accusative = Genitive — Я знаю брата, Андрея, учителя. (Inanimate masculine stays like the Nominative.)','مذکر جاندار مفرد: پادژ ۴ = پادژ ۲ — Я знаю брата، Андрея، учителя. (مذکر بی‌جان مثل پادژ ۱ می‌مونه.)','Masculin animé singulier : accusatif = génitif — Я знаю брата, Андрея, учителя. (Le masculin inanimé reste comme le nominatif.)','المذكر الحي المفرد: المنصوب = المضاف — Я знаю брата، Андрея، учителя. (المذكر غير الحي يبقى كالمرفوع.)','Giống đực hữu sinh số ít: đối cách = sở hữu cách — Я знаю брата, Андрея, учителя. (Giống đực vô sinh giữ như danh cách.)'],
a_pl_anim:['Animate plural (all genders): Accusative = Genitive plural — Я вижу студентов, подруг, кошек, детей.','جمع جاندار (همه‌ی جنس‌ها): پادژ ۴ = جمع پادژ ۲ — Я вижу студентов، подруг، кошек، детей.','Pluriel animé (tous genres) : accusatif = génitif pluriel — Я вижу студентов, подруг, кошек, детей.','جمع الحي (كل الأجناس): المنصوب = جمع المضاف — Я вижу студентов، подруг، кошек، детей.','Số nhiều hữu sinh (mọi giống): đối cách = sở hữu cách số nhiều — Я вижу студентов, подруг, кошек, детей.'],
a_pl_inan:['Inanimate plural: Accusative = Nominative plural — Мы читаем книги, видим окна, берём столы.','جمع بی‌جان: پادژ ۴ = جمع پادژ ۱ — Мы читаем книги، видим окна، берём столы.','Pluriel inanimé : accusatif = nominatif pluriel — Мы читаем книги, видим окна, берём столы.','جمع غير الحي: المنصوب = جمع المرفوع — Мы читаем книги، видим окна، берём столы.','Số nhiều vô sinh: đối cách = danh cách số nhiều — Мы читаем книги, видим окна, берём столы.'],
a_fem_soft:['Feminine nouns in -ь never change in the Accusative: Я люблю мать, дочь, тетрадь. Only -а/-я endings change.','مؤنث‌های -ь تو پادژ ۴ هیچ‌وقت تغییر نمیکنن: Я люблю мать، дочь، тетрадь. فقط پایانه‌های -а/-я عوض میشن.','Les féminins en -ь ne changent jamais à l’accusatif : Я люблю мать, дочь, тетрадь. Seules les terminaisons -а/-я changent.','المؤنث بـ -ь لا يتغير أبدًا في المنصوب: Я люблю мать، дочь، тетрадь. فقط النهايتان -а/-я تتغيران.','Giống cái -ь không bao giờ đổi ở đối cách: Я люблю мать, дочь, тетрадь. Chỉ đuôi -а/-я đổi.'],
a_pron:['Accusative of pronouns: меня, тебя, его, её, нас, вас, их — the same as the Genitive. мне / тебе / мной / тобой are other cases.','پادژ ۴ ضمایر: меня، тебя، его، её، нас، вас، их — دقیقاً مثل پادژ ۲. мне / тебе / мной / тобой پادژهای دیگه‌ان.','Accusatif des pronoms : меня, тебя, его, её, нас, вас, их — identique au génitif. мне / тебе / мной / тобой sont d’autres cas.','المنصوب للضمائر: меня، тебя، его، её، нас، вас، их — مثل المضاف تمامًا. أما мне / тебе / мной / тобой فحالات أخرى.','Đối cách của đại từ: меня, тебя, его, её, нас, вас, их — giống hệt sở hữu cách. мне / тебе / мной / тобой là các cách khác.'],
a_mod:['Adjectives, этот and possessives agree with the noun: feminine → -ую / -юю (новую, эту, мою); animate masculine → -ого / -его (этого, моего); inanimate masculine and plural stay like the Nominative.','صفت، этот و ملکی‌ها با اسم هماهنگ میشن: مؤنث ← -ую / -юю (новую، эту، мою)؛ مذکر جاندار ← -ого / -его (этого، моего)؛ مذکر بی‌جان و جمع مثل پادژ ۱ می‌مونن.','Adjectifs, этот et possessifs s’accordent avec le nom : féminin → -ую / -юю (новую, эту, мою) ; masculin animé → -ого / -его (этого, моего) ; masculin inanimé et pluriel restent comme le nominatif.','الصفات وэтот والملكية تتفق مع الاسم: المؤنث ← -ую / -юю (новую، эту، мою)؛ المذكر الحي ← -ого / -его (этого، моего)؛ والمذكر غير الحي والجمع كالمرفوع.','Tính từ, этот và từ sở hữu hòa hợp với danh từ: giống cái → -ую / -юю (новую, эту, мою); giống đực hữu sinh → -ого / -его (этого, моего); giống đực vô sinh và số nhiều như danh cách.'],
a_dir:['в / на + Accusative answers куда? (direction): Мы идём в школу, едем в театр, на работу. Inanimate masculine nouns do not change (в театр); feminine -а → -у. For где? you would use the Prepositional (в театре).','в / на + پادژ ۴ جواب куда؟ (جهت) میده: Мы идём в школу، едем в театр، на работу. مذکر بی‌جان تغییر نمیکنه (в театр)؛ مؤنث -а ← -у. برای где؟ پادژ ۶ میاد (в театре).','в / на + accusatif répond à куда ? (direction) : Мы идём в школу, едем в театр, на работу. Le masculin inanimé ne change pas (в театр) ; féminin -а → -у. Pour где ? on utilise le prépositionnel (в театре).','в / на + المنصوب يجيب عن куда؟ (الاتجاه): Мы идём в школу، едем в театр، на работу. المذكر غير الحي لا يتغير (в театр)؛ والمؤنث -а ← -у. أما где؟ فيحتاج الجر (в театре).','в / на + đối cách trả lời куда? (hướng đi): Мы идём в школу, едем в театр, на работу. Giống đực vô sinh không đổi (в театр); giống cái -а → -у. Với где? dùng giới cách (в театре).'],
a_day:['в + Accusative answers когда? for days: в среду, в пятницу, в субботу (feminine days change -а → -у), в понедельник, во вторник.','в + پادژ ۴ برای روزها جواب когда؟ میده: в среду، в пятницу، в субботу (روزهای مؤنث -а ← -у میشن)، в понедельник، во вторник.','в + accusatif répond à когда ? pour les jours : в среду, в пятницу, в субботу (jours féminins : -а → -у), в понедельник, во вторник.','в + المنصوب يجيب عن когда؟ للأيام: в среду، в пятницу، в субботу (الأيام المؤنثة -а ← -у)، в понедельник، во вторник.','в + đối cách trả lời когда? cho các ngày: в среду, в пятницу, в субботу (ngày giống cái -а → -у), в понедельник, во вторник.'],

i_with:['с + Instrumental = “with”: гулять с подругой, чай с сахаром, говорить с преподавателями.','с + پادژ ۵ = «با»: гулять с подругой، чай с сахаром، говорить с преподавателями.','с + instrumental = « avec » : гулять с подругой, чай с сахаром, говорить с преподавателями.','с + الأداة = «مع»: гулять с подругой، чай с сахаром، говорить с преподавателями.','с + công cụ cách = “với”: гулять с подругой, чай с сахаром, говорить с преподавателями.'],
i_tool:['The tool or means (чем?) is in the Instrumental WITHOUT a preposition: писать ручкой, писать карандашом, резать ножом.','ابزار (чем؟) بدون حرف اضافه تو پادژ ۵ میاد: писать ручкой، писать карандашом، резать ножом.','L’outil ou le moyen (чем ?) se met à l’instrumental SANS préposition : писать ручкой, писать карандашом, резать ножом.','الأداة أو الوسيلة (чем؟) تأتي في حالة الأداة بدون حرف جر: писать ручкой، писать карандашом، резать ножом.','Dụng cụ / phương tiện (чем?) ở công cụ cách KHÔNG có giới từ: писать ручкой, писать карандашом, резать ножом.'],
i_prof:['After быть, стать, работать (and хотеть быть) the profession is in the Instrumental: Он работает врачом, Она хочет быть учительницей, Он хочет стать инженером. (Present tense “to be” has no verb: Он врач.)','بعد از быть، стать، работать (و хотеть быть) شغل تو پادژ ۵ میاد: Он работает врачом، Она хочет быть учительницей، Он хочет стать инженером. (حال «بودن» فعل نداره: Он врач.)','Après быть, стать, работать (et хотеть быть) la profession est à l’instrumental : Он работает врачом, Она хочет быть учительницей, Он хочет стать инженером. (Au présent « être » n’a pas de verbe : Он врач.)','بعد быть وстать وработать (وхотеть быть) تأتي المهنة في حالة الأداة: Он работает врачом، Она хочет быть учительницей، Он хочет стать инженером. (في المضارع لا فعل «يكون»: Он врач.)','Sau быть, стать, работать (và хотеть быть) nghề nghiệp ở công cụ cách: Он работает врачом, Она хочет быть учительницей, Он хочет стать инженером. (Thì hiện tại “là” không có động từ: Он врач.)'],
i_hob:['The verbs заниматься, интересоваться, увлекаться + Instrumental: Я занимаюсь спортом, мы интересуемся музыкой.','فعل‌های заниматься، интересоваться، увлекаться + پادژ ۵: Я занимаюсь спортом، мы интересуемся музыкой.','Les verbes заниматься, интересоваться, увлекаться + instrumental : Я занимаюсь спортом, мы интересуемся музыкой.','الأفعال заниматься وинтересоваться وувлекаться + الأداة: Я занимаюсь спортом، мы интересуемся музыкой.','Các động từ заниматься, интересоваться, увлекаться + công cụ cách: Я занимаюсь спортом, мы интересуемся музыкой.'],
i_place:['над, под, перед, за (behind), рядом с, между + Instrumental when they answer где?: над столом, перед домом, рядом с университетом.','над، под، перед، за (پشت)، рядом с، между + پادژ ۵ وقتی جواب где؟ میدن: над столом، перед домом، рядом с университетом.','над, под, перед, за (derrière), рядом с, между + instrumental quand ils répondent à где ? : над столом, перед домом, рядом с университетом.','над، под، перед، за (خلف)، рядом с، между + الأداة حين تجيب عن где؟: над столом، перед домом، рядом с университетом.','над, под, перед, за (sau), рядом с, между + công cụ cách khi trả lời где?: над столом, перед домом, рядом с университетом.'],
i_end:['Instrumental endings: masculine / neuter -ом / -ем, feminine -ой / -ей, feminine -ь → -ью (матерью), plural -ами / -ями (друзьями, преподавателями).','پایانه‌های پادژ ۵: مذکر / خنثی -ом / -ем، مؤنث -ой / -ей، مؤنث -ь ← -ью (матерью)، جمع -ами / -ями (друзьями، преподавателями).','Terminaisons de l’instrumental : masculin / neutre -ом / -ем, féminin -ой / -ей, féminin -ь → -ью (матерью), pluriel -ами / -ями (друзьями, преподавателями).','نهايات الأداة: المذكر / المحايد -ом / -ем، المؤنث -ой / -ей، المؤنث بـ -ь ← -ью (матерью)، الجمع -ами / -ями (друзьями، преподавателями).','Đuôi công cụ cách: giống đực / trung -ом / -ем, giống cái -ой / -ей, giống cái -ь → -ью (матерью), số nhiều -ами / -ями (друзьями, преподавателями).'],
i_pron:['Instrumental of pronouns: мной, тобой, им, ей, нами, вами, ими. After a preposition он / она / они add н-: с ним, с ней, с ними. с + мной = со мной.','پادژ ۵ ضمایر: мной، тобой، им، ей، нами، вами، ими. بعد از حرف اضافه он / она / они یه н- میگیرن: с ним، с ней، с ними. с + мной = со мной.','Instrumental des pronoms : мной, тобой, им, ей, нами, вами, ими. Après une préposition он / она / они ajoutent н- : с ним, с ней, с ними. с + мной = со мной.','الأداة للضمائر: мной، тобой، им، ей، нами، вами، ими. وبعد حرف الجر تأخذ он / она / они حرف н-: с ним، с ней، с ними. с + мной = со мной.','Công cụ cách của đại từ: мной, тобой, им, ей, нами, вами, ими. Sau giới từ, он / она / они thêm н-: с ним, с ней, с ними. с + мной = со мной.'],
i_season:['Seasons and parts of the day use the Instrumental with no preposition: зимой, весной, летом, осенью; утром, днём, вечером, ночью.','فصل‌ها و بخش‌های روز بدون حرف اضافه پادژ ۵ میگیرن: зимой، весной، летом، осенью؛ утром، днём، вечером، ночью.','Les saisons et les moments de la journée se mettent à l’instrumental sans préposition : зимой, весной, летом, осенью ; утром, днём, вечером, ночью.','الفصول وأوقات اليوم تأتي في حالة الأداة بلا حرف جر: зимой، весной، летом، осенью؛ утром، днём، вечером، ночью.','Mùa và các buổi trong ngày dùng công cụ cách, không giới từ: зимой, весной, летом, осенью; утром, днём, вечером, ночью.'],
i_zh:['After ж ч ш щ ц an UNSTRESSED ending is -ем / -ей (товарищем, месяцем); a STRESSED one stays -ом / -ой (врачом, карандашом, ножом).','بعد از ж ч ш щ ц پایانه‌ی بی‌تکیه -ем / -ей ه (товарищем، месяцем)؛ پایانه‌ی تکیه‌دار -ом / -ой می‌مونه (врачом، карандашом، ножом).','Après ж ч ш щ ц une terminaison NON accentuée est -ем / -ей (товарищем, месяцем) ; accentuée elle reste -ом / -ой (врачом, карандашом, ножом).','بعد ж ч ш щ ц تكون النهاية غير المشددة -ем / -ей (товарищем، месяцем)، والمشددة تبقى -ом / -ой (врачом، карандашом، ножом).','Sau ж ч ш щ ц, đuôi KHÔNG nhấn là -ем / -ей (товарищем, месяцем); đuôi có nhấn vẫn là -ом / -ой (врачом, карандашом, ножом).'],

p_loc:['в / на + Prepositional answers где? (location): Я живу в Москве, Книга лежит на столе. For куда? (direction) you would use the Accusative.','в / на + پادژ ۶ جواب где؟ (مکان) میده: Я живу в Москве، Книга лежит на столе. برای куда؟ (جهت) پادژ ۴ میاد.','в / на + prépositionnel répond à где ? (lieu) : Я живу в Москве, Книга лежит на столе. Pour куда ? (direction) on utilise l’accusatif.','в / на + الجر يجيب عن где؟ (المكان): Я живу в Москве، Книга лежит на столе. أما куда؟ (الاتجاه) فيحتاج المنصوب.','в / на + giới cách trả lời где? (vị trí): Я живу в Москве, Книга лежит на столе. Với куда? (hướng đi) dùng đối cách.'],
p_about:['о (об / обо) + Prepositional means “about”: Мы говорим о маме, думаем о тебе, книга о любви.','о (об / обо) + پادژ ۶ یعنی «درباره‌ی»: Мы говорим о маме، думаем о тебе، книга о любви.','о (об / обо) + prépositionnel signifie « à propos de » : Мы говорим о маме, думаем о тебе, книга о любви.','о (об / обо) + الجر تعني «عن»: Мы говорим о маме، думаем о тебе، книга о любви.','о (об / обо) + giới cách nghĩa là “về”: Мы говорим о маме, думаем о тебе, книга о любви.'],
p_u:['A short list of masculine nouns takes stressed -у / -ю after в / на instead of -е: в лесу, в саду, в шкафу, на полу, на мосту, на берегу, в году. Memorize them.','یه لیست کوتاه از اسم‌های مذکر بعد از в / на به‌جای -е، -у / -ю تکیه‌دار میگیرن: в лесу، в саду، в шкафу، на полу، на мосту، на берегу، в году. حفظشون کن.','Une courte liste de noms masculins prend -у / -ю accentué après в / на au lieu de -е : в лесу, в саду, в шкафу, на полу, на мосту, на берегу, в году. À mémoriser.','قائمة قصيرة من الأسماء المذكرة تأخذ -у / -ю مشددة بعد в / на بدل -е: в лесу، в саду، в шкафу، на полу، на мосту، на берегу، в году. احفظها.','Một danh sách ngắn danh từ giống đực dùng -у / -ю có nhấn sau в / на thay cho -е: в лесу, в саду, в шкафу, на полу, на мосту, на берегу, в году. Hãy thuộc.'],
p_i:['Feminine -ь and -ия and neuter -ие take -и in the Prepositional: о любви, в тетради, в России, в общежитии.','مؤنث -ь و -ия و خنثی -ие تو پادژ ۶ -и میگیرن: о любви، в тетради، в России، в общежитии.','Les féminins en -ь et -ия et les neutres en -ие prennent -и au prépositionnel : о любви, в тетради, в России, в общежитии.','المؤنث بـ -ь و-ия والمحايد بـ -ие يأخذ -и في الجر: о любви، в тетради، в России، в общежитии.','Giống cái -ь và -ия, giống trung -ие dùng -и ở giới cách: о любви, в тетради, в России, в общежитии.'],
p_month:['Months use в + Prepositional: в январе, в марте, в мае. Not the Genitive: января appears only in dates (пятого января).','ماه‌ها: в + پادژ ۶: в январе، в марте، в мае. نه پادژ ۲: января فقط تو تاریخ میاد (пятого января).','Les mois : в + prépositionnel : в январе, в марте, в мае. Pas le génitif : января n’apparaît que dans les dates (пятого января).','الأشهر: в + الجر: в январе، в марте، в мае. وليس المضاف: января تأتي فقط في التواريخ (пятого января).','Tháng: в + giới cách: в январе, в марте, в мае. Không dùng sở hữu cách: января chỉ xuất hiện trong ngày tháng (пятого января).'],
p_trans:['Transport: ездить на + Prepositional: на автобусе, на метро, на машине. Not the Instrumental.','وسیله‌ی نقلیه: ездить на + پادژ ۶: на автобусе، на метро، на машине. نه پادژ ۵.','Transports : ездить на + prépositionnel : на автобусе, на метро, на машине. Pas l’instrumental.','وسائل النقل: ездить на + الجر: на автобусе، на метро، на машине. وليس الأداة.','Phương tiện: ездить на + giới cách: на автобусе, на метро, на машине. Không dùng công cụ cách.'],
p_pron:['Prepositional of pronouns: обо мне, о тебе, о нём, о ней, о нас, о вас, о них. After a preposition он / она / они add н-: о нём, в ней, на них.','پادژ ۶ ضمایر: обо мне، о тебе، о нём، о ней، о нас، о вас، о них. بعد از حرف اضافه он / она / они یه н- میگیرن: о нём، в ней، на них.','Prépositionnel des pronoms : обо мне, о тебе, о нём, о ней, о нас, о вас, о них. Après une préposition он / она / они ajoutent н- : о нём, в ней, на них.','الجر للضمائر: обо мне، о тебе، о нём، о ней، о нас، о вас، о них. وبعد حرف الجر تأخذ он / она / они حرف н-: о нём، в ней، на них.','Giới cách của đại từ: обо мне, о тебе, о нём, о ней, о нас, о вас, о них. Sau giới từ, он / она / они thêm н-: о нём, в ней, на них.'],
p_vsna:['в vs на has no logic; memorize the groups. на = events, open spaces, stations, work: на концерте, на выставке, на работе, на стадионе. в = enclosed or institutional spaces: в школе, в театре, в университете.','в یا на قانون خاصی نداره؛ گروه‌ها رو حفظ کن. на = رویدادها، فضاهای باز، ایستگاه‌ها، کار: на концерте، на выставке، на работе، на стадионе. в = فضاهای بسته یا نهادها: в школе، в театре، в университете.','в ou на : pas de logique, on mémorise par groupes. на = événements, espaces ouverts, gares, travail : на концерте, на выставке, на работе, на стадионе. в = espaces fermés ou institutions : в школе, в театре, в университете.','в أو на: لا منطق ثابت، احفظ المجموعات. на = الأحداث والأماكن المفتوحة والمحطات والعمل: на концерте، на выставке، на работе، на стадионе. в = الأماكن المغلقة أو المؤسسات: в школе، в театре، в университете.','в hay на không có logic, hãy học theo nhóm. на = sự kiện, không gian mở, nhà ga, nơi làm việc: на концерте, на выставке, на работе, на стадионе. в = không gian kín hoặc cơ quan: в школе, в театре, в университете.']
};

if(m=/^\d+(?:[.,]\d+)?/.exec(t)){o.push(cxNm(m[0].replace(',','.'),L));i+=m[0].length;continue}
if(m=/^[A-Za-z]+/.exec(t)){const w=m[0],k=cxWK.indexOf(w.toLowerCase());if(k>=0&&w.length>1)o.push(cxWD[L][k]);else for(const ch of w)o.push(cxLN[L][ch.toLowerCase().charCodeAt(0)-97]);i+=w.length;continue}
let g=cxGr.indexOf(c);if(g>=0){o.push(cxGN[L][g]);i++;continue}g=cxGr.toUpperCase().indexOf(c);if(g>=0){o.push(L=='fa'?cxGN[L][g]+' بزرگ':(L=='ru'?'заглавная ':'capital ')+cxGN[L][g]);i++;continue}
const y=cxSY[c];o.push(y?y[L]:c);i++}return o.join(' ').replace(/\s+/g,' ')}

'Masculine and neuter nouns take':'Masculin et neutre prennent -а/-я ; le féminin -ы/-и. Rappel : après к г х ш ж ч щ on écrit seulement -и.|المذكر والمحايد يأخذان -а/-я والمؤنث -ы/-и. تذكّر: بعد к г х ш ж ч щ نكتب -и فقط.|Giống đực và trung dùng -а/-я; giống cái dùng -ы/-и. Nhớ: sau к г х ш ж ч щ chỉ viết -и.',
'The Genitive plural has four':'Le génitif pluriel a quatre terminaisons : -ов/-ев, -ей et la terminaison zéro. Les pluriels animés à l’accusatif copient ces formes.|لجمع المضاف أربع نهايات: -ов/-ев و-ей وبدون نهاية. وجمع الحي في المنصوب ينسخ هذه الصيغ.|Số nhiều sở hữu cách có bốn kiểu đuôi: -ов/-ев, -ей và đuôi không. Số nhiều hữu sinh ở đối cách sao chép các dạng này.',

'All of these take the Genitive':'Toutes veulent le génitif. Elles répondent à где ? (lieu) et откуда ? / до чего ? (de / jusqu’à).|كلها تتطلب المضاف. تجيب عن где؟ (المكان) وعن откуда؟ / до чего؟ (من / حتى).|Tất cả đi với sở hữu cách. Trả lời где? (vị trí) và откуда? / до чего? (từ đâu / đến đâu).',
'у + Genitive shows who HAS':'у + génitif indique qui A quelque chose ou chez qui on est. Le même у sert à prendre ou demander à quelqu’un.|у + المضاف يبيّن من يملك شيئًا أو أين يكون شخص. ويُستخدم у نفسه للأخذ أو الطلب من شخص.|у + sở hữu cách cho biết ai CÓ cái gì hoặc ai ở chỗ nào. Cũng dùng у khi lấy hoặc xin từ ai đó.',
'много / мало / немного':'много / мало / немного / несколько + génitif pluriel. Le nombre décide : 1 nominatif, 2–4 génitif singulier, 5+ génitif pluriel.|много / мало / немного / несколько + جمع المضاف. العدد يحدد: ١ مرفوع، ٢–٤ مضاف مفرد، ٥ فأكثر جمع المضاف.|много / мало / немного / несколько + số nhiều sở hữu cách. Số quyết định: 1 danh cách, 2–4 sở hữu cách số ít, từ 5 số nhiều sở hữu cách.',
'Question: какого? какой? каких?':'Question : какого ? какой ? каких ? (чьего ? чьей ? чьих ?). Les terminaisons copient le nom.|السؤال: какого؟ какой؟ каких؟ (чьего؟ чьей؟ чьих؟). تنسخ النهايات الاسم.|Câu hỏi: какого? какой? каких? (чьего? чьей? чьих?). Đuôi theo danh từ.',
'After у the pronoun':'Après у le pronom est au génitif. Après une préposition, он/она/они prennent н-.|بعد у يكون الضمير في المضاف. وبعد حرف جر تأخذ он/она/они حرف н-.|Sau у đại từ ở sở hữu cách. Sau giới từ, он/она/они thêm н-.',
'Dates answer':'Les dates répondent à какого числа ? avec un ordinal au génitif ; l’heure aussi. который reprend le genre et le nombre du nom ; son cas vient de sa fonction.|التواريخ تجيب عن какого числа؟ بعدد ترتيبي في المضاف، وكذلك الساعة. который يأخذ جنس الاسم وعدده وحالته من وظيفته.|Ngày tháng trả lời какого числа? bằng số thứ tự ở sở hữu cách; giờ cũng vậy. который theo giống và số của danh từ; cách theo chức năng.',
'After к г х ш ж ч щ the feminine':'Après к г х ш ж ч щ le génitif féminin est toujours -и : книги, студентки.|بعد к г х ш ж ч щ مضاف المؤنث دائمًا -и: книги، студентки.|Sau к г х ш ж ч щ sở hữu cách giống cái luôn là -и: книги, студентки.',
'Negation нет':'La négation нет, не было, не будет exige toujours le génitif : У меня нет времени.|النفي بـ нет و не было و не будет يتطلب المضاف دائمًا.|Phủ định нет, не было, не будет luôn đi với sở hữu cách.',
'Animate plural Accusative':'Le pluriel animé à l’accusatif = génitif pluriel : Я вижу студентов / У нас нет студентов.|جمع الحي في المنصوب = جمع المضاف.|Số nhiều hữu sinh ở đối cách = số nhiều sở hữu cách.',
'Compare: Я люблю сестёр':'Même forme, cas différents : Я люблю сестёр (accusatif) / У меня нет сестёр (génitif).|نفس الشكل وحالتان مختلفتان: Я люблю сестёр (منصوب) / У меня нет сестёр (مضاف).|Cùng dạng, khác cách: Я люблю сестёр (đối cách) / У меня нет сестёр (sở hữu cách).',
'тётя: Genitive plural':'Le génitif pluriel de тётя est тётей (le tableau du manuel contient une faute).|جمع المضاف لـ тётя هو тётей (جدول الكتاب فيه خطأ مطبعي).|Số nhiều sở hữu cách của тётя là тётей (bảng trong sách có lỗi in).',
'Prepositions у, около, без':'Les prépositions у, около, без, для, от, до, из, с, кроме veulent toutes le génitif : apprenez-les en liste.|الحروف у، около، без، для، от، до، из، с، кроме كلها مع المضاف؛ احفظها كقائمة.|Các giới từ у, около, без, для, от, до, из, с, кроме đều đi với sở hữu cách; hãy học thành danh sách.',
'Questions: кому? чему?':'Questions : кому ? чему ? (à / pour qui, quoi). Il marque le DESTINATAIRE : qui reçoit, entend, est aidé ou gêné. C’est aussi le cas des sensations (мне холодно), de l’âge, de надо/можно et des prépositions к et по.|الأسئلة: кому؟ чему؟ يدل على المتلقي: من يستلم أو يسمع أو يُساعَد أو يُزعَج. وهو حالة المشاعر والعمر وнадо/можно وحرفي к وпо.|Câu hỏi: кому? чему? Chỉ NGƯỜI NHẬN: ai nhận, nghe, được giúp hoặc bị làm phiền. Cũng là cách của cảm giác, tuổi, надо/можно và giới từ к, по.',
'Learn the verb together':'Apprenez le verbe avec кому. Les deux aspects sont indiqués (imperfectif / perfectif).|تعلّم الفعل مع кому. ذُكر الوجهان (غير تام / تام).|Học động từ cùng кому. Có cả hai thể (chưa hoàn thành / hoàn thành).',
'Masculine and neuter take -у/-ю':'Masculin et neutre prennent -у/-ю, le féminin -е ou -и.|المذكر والمحايد يأخذان -у/-ю، والمؤنث -е أو -и.|Giống đực và trung dùng -у/-ю, giống cái -е hoặc -и.',
'All genders: -ам after hard':'Tous genres : -ам après terminaison dure, -ям après terminaison molle.|كل الأجناس: -ам بعد النهاية الصلبة و-ям بعد الرخوة.|Mọi giống: -ам sau đuôi cứng, -ям sau đuôi mềm.',
'After к and по the pronouns':'Après к et по, он/она/они prennent н- : к нему, ко мне.|بعد к وпо تأخذ он/она/они حرف н-: к нему، ко мне.|Sau к và по, он/она/они thêm н-: к нему, ко мне.',
'Question: какому?':'Question : какому ? какой ? каким ? (чьему ? чьей ? чьим ?). Les terminaisons copient le nom.|السؤال: какому؟ какой؟ каким؟ (чьему؟ чьей؟ чьим؟). تنسخ النهايات الاسم.|Câu hỏi: какому? какой? каким? (чьему? чьей? чьим?). Đuôi theo danh từ.',
'Pattern: кому + word':'Schéma : кому + mot + infinitif. Passé : было ; futur : будет. Âge : кому + nombre + год / года / лет.|النمط: кому + كلمة + مصدر. الماضي: было، والمستقبل: будет. العمر: кому + عدد + год / года / лет.|Mẫu: кому + từ + động từ nguyên mẫu. Quá khứ: было; tương lai: будет. Tuổi: кому + số + год / года / лет.',
'у + Genitive = at':'у + génitif = chez quelqu’un ; к + datif = vers quelqu’un. Verbes : ходить/пойти, ездить/поехать, приходить/приехать.|у + المضاف = عند شخص؛ к + الداتيف = نحو شخص. الأفعال: ходить/пойти، ездить/поехать، приходить/приехать.|у + sở hữu cách = ở chỗ ai; к + tặng cách = đến chỗ ai. Động từ: ходить/пойти, ездить/поехать, приходить/приехать.',
'Six meanings of по':'Six sens de по. Apprenez-les comme des groupes figés.|ستة معانٍ لـ по. احفظها كمجموعات ثابتة.|Sáu nghĩa của по. Hãy học như các nhóm cố định.',
'который in the Dative copies':'который au datif reprend le genre et le nombre : которому, которой, которым. свой renvoie au sujet.|который في الداتيف ينسخ الجنس والعدد: которому، которой، которым. свой يعود على الفاعل.|который ở tặng cách theo giống và số: которому, которой, которым. свой quay về chủ ngữ.',
'Only к and по take':'Seuls к et по veulent le datif.|فقط к وпо يتطلبان الداتيف.|Chỉ к và по đi với tặng cách.',
'The recipient is in the Dative':'Le destinataire est au datif, la chose donnée à l’accusatif : Я дарю маме книгу.|المتلقي في الداتيف والشيء المُعطى في المنصوب: Я дарю маме книгу.|Người nhận ở tặng cách, vật được cho ở đối cách: Я дарю маме книгу.',
'Feelings need no verb':'Les sensations n’ont pas de verbe : Мне скучно. Passé : Мне было скучно.|المشاعر بلا فعل: Мне скучно. الماضي: Мне было скучно.|Cảm giác không cần động từ: Мне скучно. Quá khứ: Мне было скучно.',
'нравиться: the person who likes':'нравиться : celui qui aime est au datif, la chose aimée est le sujet : Мне нравится кофе / Мне нравятся фильмы.|нравиться: من يُعجَب في الداتيف والشيء المُعجِب هو الفاعل.|нравиться: người thích ở tặng cách, vật được thích là chủ ngữ: Мне нравится кофе / Мне нравятся фильмы.',
'после к и по':'Après к et по : ему → к нему, им → к ним.|بعد к وпо: ему → к нему، им → к ним.|Sau к và по: ему → к нему, им → к ним.',
'Dative plural is always':'Le datif pluriel est toujours -ам / -ям, même irrégulier : друзьям, детям, людям.|جمع الداتيف دائمًا -ам / -ям حتى في الجموع الشاذة: друзьям، детям، людям.|Số nhiều tặng cách luôn -ам / -ям, kể cả bất quy tắc: друзьям, детям, людям.'});

 х ж ч ш щ always write -и.":"复数词尾取决于最后一个字母。在 г к х ж ч ш щ 之后永远写 -и。","The Nominative is the first column. The next columns show how each pronoun changes in the other cases, so you can compare them at once.":"主格是第一列。后面各列显示每个代词在其他格中的变化，方便一次对比。","6 · Adjectives, possessives, этот, один, весь":"6 · 形容词、物主词、этот、один、весь","These words copy the gender and number of the noun. его · её · их never change.":"这些词要与名词的性和数保持一致。его · её · их 永不变化。","Always learn a noun with its gender and plural.":"学名词时一定要同时记住它的性和复数。","Present tense: Анна — врач. After был/будет the noun goes to the Instrumental (case 5).":"现在时：Анна — врач。在 был/будет 之后，名词用工具格（第5格）。","Adjectives agree with the noun: новая книга, мой дом, эти окна.":"形容词与名词一致：новая книга, мой дом, эти окна。","кто/что (animate/inanimate) does not change the Nominative, but it decides the Accusative later.":"кто/что（有生命/无生命）不改变主格，但之后它决定宾格。","One is Nominative: один рубль, одна копейка. The date question is Nominative too; the answer to “on what date” is Genitive (case 2).":"один 用主格：один рубль, одна копейка。日期的提问也是主格；回答“哪一天”用属格（第2格）。","Questions: кого? чего? (of whom / of what). Use it for absence, “of”, having with у, quantity, dates, comparison and after many prepositions.":"疑问词：кого? чего?（谁的/什么的）。用于“没有”、“的”、用 у 表示拥有、数量、日期、比较，以及许多前置词之后。","Masculine and neuter nouns take -а/-я; feminine nouns take -ы/-и. Remember: after к г х ш ж ч щ write only -и.":"阳性和中性名词用 -а/-я；阴性名词用 -ы/-и。记住：在 к г х ш ж ч щ 之后只写 -и。","The Genitive plural has four endings: -ов/-ев, -ей, and the zero ending. Animate plurals in the Accusative copy these forms.":"属格复数有四种词尾：-ов/-ев、-ей，以及零词尾。宾格中有生命的复数照抄这些形式。","4 · Exceptions & fleeting vowels":"4 · 例外与出没元音","Memorize these. A vowel appears or disappears in the zero ending (окно → окон).":"请背下来。零词尾中会出现或消失一个元音（окно → окон）。","All of these take the Genitive. They answer где? (location) and откуда? / до чего? (from / up to).":"这些前置词都要求属格。它们回答 где?（位置）和 откуда? / до чего?（从哪里 / 到哪里）。","быть, учиться, работать, жить, отдыхать у кого?":"在某人那里：быть, учиться, работать, жить, отдыхать（у кого?）","спрашивать, просить, брать у кого?":"向某人：спрашивать, просить, брать（у кого?）","к кому? (Dat.) vs у кого? (Gen.)":"к кому?（与格）与 у кого?（属格）","у + Genitive shows who HAS something or where someone is (at someone’s place). The same у is used to take or ask from someone.":"у + 属格表示谁“有”某物，或某人在谁那里（在某人家）。同一个 у 也用于向某人拿或要东西。","много / мало / немного / несколько + Genitive plural. Numbers decide the form: 1 Nominative, 2–4 Genitive singular, 5+ Genitive plural.":"много / мало / немного / несколько + 属格复数。数字决定形式：1 用主格，2–4 用属格单数，5 以上用属格复数。","Question: какого? какой? каких? (чьего? чьей? чьих?). The endings copy the noun.":"疑问词：какого? какой? каких?（чьего? чьей? чьих?）。词尾随名词变化。","After у the pronoun is in the Genitive. After prepositions he/she/they add н-.":"在 у 之后代词用属格。在前置词之后，он/она/они 要加 н-。","Dates answer какого числа? with a Genitive ordinal. Telling time uses Genitive too. который copies the noun’s gender and number; its case comes from its job.":"日期用属格序数词回答 какого числа?。报时也用属格。который 的性和数跟随名词；它的格由它在句中的作用决定。","After к г х ш ж ч щ the feminine Genitive is always -и: книги, студентки, секретарши.":"在 к г х ш ж ч щ 之后，阴性属格永远是 -и：книги, студентки, секретарши。","Negation нет, не было, не будет always takes the Genitive: У меня нет времени.":"否定 нет, не было, не будет 永远要求属格：У меня нет времени.","Animate plural Accusative = Genitive plural: Я вижу студентов / У нас нет студентов.":"有生命复数的宾格 = 属格复数：Я вижу студентов / У нас нет студентов.","Compare: Я люблю сестёр (Acc.) vs У меня нет сестёр (Gen.): same form, different case.":"对比：Я люблю сестёр（宾格）与 У меня нет сестёр（属格）：形式相同，格不同。","тётя: Genitive plural is тётей (the textbook table shows a typo).":"тётя 的属格复数是 тётей（课本表格里有印刷错误）。","Prepositions у, около, без, для, от, до, из, с, кроме all need the Genitive; learn them as one list.":"前置词 у, около, без, для, от, до, из, с, кроме 都要求属格；把它们当作一个清单来记。","Questions: кому? чему? (to/for whom, to/for what). It marks the RECIPIENT: who receives, hears, is helped or disturbed. It is also the case of feelings (мне холодно), age, надо/можно, and of the prepositions к and по.":"疑问词：кому? чему?（给谁/给什么）。它表示接受者：谁得到、听到、被帮助或被打扰。它也是感受（мне холодно）、年龄、надо/можно，以及前置词 к 和 по 的格。","Learn the verb together with кому. Both aspects are shown (imperfective / perfective).":"动词要和 кому 一起记。两个体都已列出（未完成体 / 完成体）。","Masculine and neuter take -у/-ю, feminine -е or -и.":"阳性和中性用 -у/-ю，阴性用 -е 或 -и。","All genders: -ам after hard endings, -ям after soft ones. The word to learn is “-ам / -ям”.":"所有性：硬词尾后用 -ам，软词尾后用 -ям。要记住“-ам / -ям”。","After к and по the pronouns he/she/they take н-: к нему, ко мне.":"在 к 和 по 之后，он/она/они 要加 н-：к нему, ко мне。","Question: какому? какой? каким? (чьему? чьей? чьим?). Endings copy the noun.":"疑问词：какому? какой? каким?（чьему? чьей? чьим?）。词尾随名词变化。","кому хорошо, плохо, холодно, жарко, интересно, трудно, скучно, весело, грустно, легко":"谁觉得：хорошо（好）、плохо（不好）、холодно（冷）、жарко（热）、интересно（有趣）、трудно（难）、скучно（无聊）、весело（开心）、грустно（难过）、легко（容易）","нравиться + noun: agrees with the thing liked":"нравиться + 名词：与被喜欢的事物保持一致","нравиться + infinitive: always нравится":"нравиться + 动词原形：总是 нравится","нравилось (repeated) vs понравилось (one time)":"нравилось（反复）与 понравилось（一次）","кому надо / нужно + infinitive":"谁需要：кому надо / нужно + 动词原形","кому можно / нельзя + infinitive":"谁可以/不可以：кому можно / нельзя + 动词原形","7 · Feelings, age, нравиться, надо":"7 · 感受、年龄、нравиться、надо","Pattern: кому + word + infinitive. Past: было / будет. Age: кому + number + год / года / лет.":"句型：кому + 词 + 动词原形。过去：было；将来：будет。年龄：кому + 数字 + год / года / лет。","у + Genitive = at someone’s place; к + Dative = toward someone. Verbs: ходить/пойти, ездить/поехать, приходить/приехать.":"у + 属格 = 在某人那里；к + 与格 = 朝某人去。动词：ходить/пойти, ездить/поехать, приходить/приехать。","Six meanings of по. Learn them as fixed groups.":"по 有六种意思。把它们当作固定组合来记。","который in the Dative copies gender and number: которому, которой, которым. свой refers to the subject.":"与格中的 который 随性和数变化：которому, которой, которым。свой 指向主语。","Only к and по take the Dative.":"只有 к 和 по 要求与格。","The recipient is in the Dative, the thing given is in the Accusative: Я дарю маме книгу.":"接受者用与格，被给予的东西用宾格：Я дарю маме книгу.","Feelings need no verb: Мне скучно. Past: Мне было скучно.":"感受不需要动词：Мне скучно. 过去：Мне было скучно.","нравиться: the person who likes is Dative; the thing liked is the subject: Мне нравится кофе. Мне нравятся фильмы.":"нравиться：喜欢的人用与格；被喜欢的东西是主语：Мне нравится кофе. Мне нравятся фильмы.","после к и по: ему → к нему, им → к ним.":"在 к 和 по 之后：ему → к нему, им → к ним。","Dative plural is always -ам / -ям, even for irregular plurals: друзьям, детям, людям.":"与格复数永远是 -ам / -ям，不规则复数也一样：друзьям, детям, людям.","Questions: кого? что? (whom / what). It marks the DIRECT OBJECT, the receiver of the action. It also shows direction (куда?), some time words, price and measure. Two things decide the form: gender and animacy (alive or not).":"疑问词：кого? что?（谁/什么）。它表示直接宾语，即动作的承受者。它还表示方向（куда?）、某些时间词、价格和度量。两个因素决定形式：性和有生命与否。","Learn the verb pairs (imperfective / perfective). Two groups: things (что?) and people (кого?). Some verbs need на + Accusative.":"学习动词对（未完成体 / 完成体）。两组：物（что?）和人（кого?）。有些动词需要 на + 宾格。","Inanimate (что?): masculine and neuter do not change; only feminine -а/-я change. Animate (кого?): masculine takes the Genitive form; feminine behaves the same as inanimate.":"无生命（что?）：阳性和中性不变；只有阴性 -а/-я 变化。有生命（кого?）：阳性取属格形式；阴性与无生命相同。","Inanimate plural = Nominative. Animate plural (all genders) = Genitive plural. Compare the two cases on the same word.":"无生命复数 = 主格。有生命复数（所有性）= 属格复数。拿同一个词对比这两个格。","в + Accusative answers когда? (when?). Only feminine days change; во before вторник.":"в + 宾格回答 когда?（什么时候）。只有阴性的星期名称变化；вторник 前用 во。","The Accusative looks exactly like the Genitive (the form after у). The reflexive себя refers back to the subject.":"宾格与属格完全相同（у 之后的形式）。反身代词 себя 指回主语。","7 · Modifiers with INANIMATE nouns":"7 · 与无生命名词搭配的修饰词","Masculine and plural stay like the Nominative; only the feminine changes (-ую / -юю).":"阳性和复数与主格相同；只有阴性变化（-ую / -юю）。","8 · Modifiers with ANIMATE nouns":"8 · 与有生命名词搭配的修饰词","Masculine singular and all plurals now take the Genitive endings; the feminine stays -ую / -юю.":"阳性单数和所有复数现在用属格词尾；阴性仍是 -ую / -юю。","свой = belongs to the SUBJECT of the sentence. мой / твой / наш / ваш = someone else’s. его · её · их never change.":"свой = 属于句子的主语。мой / твой / наш / ваш = 别人的。его · её · их 永不变化。","These words agree with the noun and use the endings in tables 7 and 8.":"这些词与名词一致，使用表 7 和表 8 中的词尾。","приглашать кого? куда? / пойти, поехать куда? куда = в / на + Accusative. Как зовут + Acc.":"приглашать кого? куда? / пойти, поехать куда? куда = в / на + 宾格。Как зовут + 宾格。","12 · который in the Accusative":"12 · 宾格中的 который","Gender and number come from the noun it replaces; the case is Accusative because it is the object of the second clause.":"性和数来自它所替代的名词；格是宾格，因为它是第二个从句的宾语。","These prepositions take the Accusative.":"这些前置词要求宾格。","Ask about the modifier with какого? / какую? / каких?; answer with the matching ending.":"用 какого? / какую? / каких? 询问修饰词；用相应的词尾回答。","Decision order: 1) feminine -а/-я? → -у/-ю. 2) animate masculine singular or any animate plural? → Genitive form. 3) otherwise = Nominative.":"判断顺序：1) 阴性 -а/-я？→ -у/-ю。2) 有生命阳性单数或任何有生命复数？→ 属格形式。3) 其他 = 主格。","Only living beings (people, animals) are animate; things and plants are not.":"只有生物（人、动物）算有生命；物品和植物不算。","Fem. -ь never changes: мать → мать, дочь → дочь, тетрадь → тетрадь.":"阴性 -ь 永不变化：мать → мать, дочь → дочь, тетрадь → тетрадь.","Word order is free: Папу любит мама = Mom loves Dad. The ending shows who is who.":"语序自由：Папу любит мама = 妈妈爱爸爸。词尾显示谁是谁。","The textbook table shows тёть; the correct Genitive/Accusative plural is тётей.":"课本表格写的是 тёть；正确的属格/宾格复数是 тётей。","после в / на: куда? (Acc) vs где? (Prep): Я иду в школу — Я в школе.":"在 в / на 之后：куда?（宾格）与 где?（前置格）：Я иду в школу — Я в школе.","Questions: чем? кем? (by what? / by whom?). The Instrumental names the tool or means, the person you do things WITH (с кем?), the job or role after быть/стать/работать, and interests.":"疑问词：чем? кем?（用什么 / 是谁）。工具格表示工具或手段、和谁一起做事（с кем?）、быть/стать/работать 之后的职业或角色，以及兴趣。","2 · Verbs with the Instrumental":"2 · 工具格动词","Learn the verb together with чем? / кем?. Groups: interests and means (чем?), professions (кем?).":"动词要和 чем? / кем? 一起记。分组：兴趣与手段（чем?）、职业（кем?）。","-∅ → -ом (-ем after ж ч ш щ ц unstressed)":"-∅ → -ом（在 ж ч ш щ ц 之后不重读时为 -ем）","Masculine and neuter take -ом/-ем, feminine -ой/-ей; after ц ш ж ч щ (unstressed) use -ем/-ей.":"阳性和中性用 -ом/-ем，阴性用 -ой/-ей；在 ц ш ж ч щ 之后（不重读）用 -ем/-ей。","с + Instrumental means “with”. Before some words it becomes со: со мной, со спортсменкой.":"с + 工具格表示“和…一起”。在某些词前 с 变成 со：со мной, со спортсменкой。","Plural: -ами / -ями for all genders; four irregular plurals must be memorized.":"复数：所有性用 -ами / -ями；四个不规则复数必须背下来。","After a preposition the pronouns take н-: с ним, с ней, с ними, перед ним. “Что с вами?” = What is wrong with you?":"在前置词之后，代词要加 н-：с ним, с ней, с ними, перед ним。“Что с вами?” = 您怎么了？","Что с вами? asks about someone’s condition. Answer: Со мной всё в порядке.":"Что с вами? 询问某人的状况。回答：Со мной всё в порядке.","8 · Prepositions: перед, под, над, за, рядом с":"8 · 前置词：перед, под, над, за, рядом с","Six prepositions take the Instrumental; learn them by meaning.":"六个前置词要求工具格；按意思来记。","с + abstract noun answers как? (in what manner).":"с + 抽象名词回答 как?（以什么方式）。","Endings copy the noun. Question: каким? с каким?":"词尾随名词变化。疑问词：каким? с каким?","свой refers to the subject: Я говорю со своим братом; Он говорит с моим братом.":"свой 指向主语：Я говорю со своим братом；Он говорит с моим братом。","12 · Interests and professions":"12 · 兴趣与职业","быть, стать, работать + Instrumental for jobs; interests use заниматься + Instrumental.":"быть, стать, работать + 工具格表示职业；兴趣用 заниматься + 工具格。","A noun with an adjective takes the Instrumental ending on both words.":"带形容词的名词，两个词都用工具格词尾。","14 · который in the Instrumental":"14 · 工具格中的 который","который keeps gender and number from the noun; the Instrumental ending comes from с / над or the verb.":"который 的性和数来自名词；工具格词尾来自 с / над 或动词。","быть / стать / работать are followed by the Instrumental for jobs: Он стал врачом.":"быть / стать / работать 之后表示职业用工具格：Он стал врачом.","Present tense has no быть: Он врач (Nominative). Past or future: Он был врачом (Instrumental).":"现在时没有 быть：Он врач（主格）。过去或将来：Он был врачом（工具格）。","мать → матерью, дочь → дочерью; irregular plurals: детьми, людьми, дочерьми, лошадьми.":"мать → матерью, дочь → дочерью；不规则复数：детьми, людьми, дочерьми, лошадьми.","с means “with” (Instrumental) but “from” with the Genitive: с другом / с работы.":"с 加工具格是“和…一起”，加属格是“从…”：с другом / с работы.","Instrumental is not used after у, около, без, для, от, до, из: those need the Genitive.":"у, около, без, для, от, до, из 之后不用工具格：它们要求属格。","1 · What is the Prepositional?":"1 · 什么是前置格？","Questions: где? о ком? о чём? (where? / about whom, what?). The Prepositional is used ONLY after a preposition: в, на, о, при. It shows location, the topic you talk about, transport you ride, and months.":"疑问词：где? о ком? о чём?（在哪里 / 关于谁、什么）。前置格只用在前置词之后：в, на, о, при。它表示地点、谈论的话题、乘坐的交通工具和月份。","Verbs of location answer где?; verbs of speaking and thinking answer о ком? о чём?":"地点动词回答 где?；说话和思考的动词回答 о ком? о чём?","Almost every noun takes -е. Watch the soft endings -ие, -ия (-ии) and -ь.":"几乎所有名词都用 -е。注意软词尾 -ие、-ия（-ии）和 -ь。","4 · Exceptions: stressed -у / -ю":"4 · 例外：重读 -у / -ю","Memorize these. Stressed -у / -ю after в and на for a short list of nouns.":"请背下来。少数名词在 в 和 на 之后用重读的 -у / -ю。","в and на both mean location. There is no logic to learn; memorize the groups: на = events, open spaces, directions, islands, stations.":"в 和 на 都表示位置。没有规律可循；按组背：на = 活动、开阔空间、方位、岛屿、车站。","Months use в + Prepositional; seasons use the Instrumental without a preposition.":"月份用 в + 前置格；季节用不带前置词的工具格。","ходить / ездить answer куда? (Accusative); быть answers где? (Prepositional).":"ходить / ездить 回答 куда?（宾格）；быть 回答 где?（前置格）。","ездить на чём? — means of transport use на + Prepositional.":"ездить на чём? —— 交通工具用 на + 前置格。","Plural: -ах after hard endings, -ях after soft ones; irregular plurals keep the same -ах / -ях.":"复数：硬词尾后用 -ах，软词尾后用 -ях；不规则复数也同样用 -ах / -ях。","After a preposition the pronouns он, она, они take н-: о нём, в ней, на них. о becomes обо before мне.":"在前置词之后，代词 он, она, они 加 н-：о нём, в ней, на них。о 在 мне 之前变成 обо。","Endings copy the noun. Question: в каком? в какой? в каких?":"词尾随名词变化。疑问词：в каком? в какой? в каких?","о before a consonant, об before а о у э и, обо before мне. Words that take о чём? о ком?":"о 用在辅音前，об 用在 а о у э и 前，обо 用在 мне 前。要求 о чём? о ком? 的词。","13 · который in the Prepositional":"13 · 前置格中的 который","который takes its gender and number from the noun; here it is the Prepositional because of в / на / о.":"который 的性和数来自名词；这里用前置格是因为有 в / на / о。","These four prepositions take the Prepositional.":"这四个前置词要求前置格。","Prepositional is used only after a preposition (в, на, о, при).":"前置格只用在前置词之后（в, на, о, при）。","Look out for the -у exceptions: в лесу, в саду, на мосту, на берегу.":"注意 -у 的例外：в лесу, в саду, на мосту, на берегу.","был (где?) is the opposite of ходил / ездил (куда?): Я ходил в библиотеку — Я был в библиотеке.":"был (где?) 与 ходил / ездил (куда?) 相反：Я ходил в библиотеку — Я был в библиотеке.","Cities like Осло, Токио, Хельсинки, Тампере never change: в Осло.":"像 Осло, Токио, Хельсинки, Тампере 这样的城市永不变化：в Осло.","Feminine -ь and -ия take -и: в тетради, в России, о любви.":"阴性 -ь 和 -ия 用 -и：в тетради, в России, о любви.","Question":"问题","Used for":"用于","Example":"例句","1 · What is the Nominative?":"1 · 什么是主格？","Use":"用法","2 · When do we use it?":"2 · 什么时候用？","Gender":"性","Endings":"词尾","Words":"词汇","3 · Gender":"3 · 性","consonant → -ы":"辅音 → -ы","after г к х ж ч ш щ → -и":"在 г к х h+=cd('1 · What is the Prepositional?|۱ · پادژ ششم (Предложный) چیه؟','Questions: где? о ком? о чём? (where? / about whom, what?). The Prepositional is used ONLY after a preposition: в, на, о, при. It shows location, the topic you talk about, transport you ride, and months.|سوال: где؟ о ком؟ о чём؟ . این پادژ فقط بعد از حرف اضافه میاد: в، на، о، при. مکان، موضوع صحبت، وسیله‌ی نقلیه و ماه‌ها رو نشون میده.',tb(['Use|کاربرد','Example|مثال'],[[T('Location: в / на + where?|مکان|lieu|المكان|vị trí'),g('Я живу в Москве. Книга на столе.','I live in Moscow. The book is on the table.|من تو مسکو زندگی میکنم. کتاب روی میزه.|J’habite à Moscou. Le livre est sur la table.|أسكن في موسكو. الكتاب على الطاولة.|Tôi sống ở Mátxcơva. Sách ở trên bàn.')],[T('Topic: о / об + about whom, what?|موضوع|sujet|الموضوع|chủ đề'),g('Он читает книгу о Петербурге.','He reads a book about St. Petersburg.|اون کتابی درباره‌ی پترزبورگ میخونه.|Il lit un livre sur Saint-Pétersbourg.|يقرأ كتابًا عن بطرسبرغ.|Anh ấy đọc sách về Saint Petersburg.')],[T('Transport: на + what by?|وسیله‌ی نقلیه|transport|النقل|phương tiện'),g('Мы ездим в парк на автобусе.','We go to the park by bus.|ما با اتوبوس میریم پارک.|Nous allons au parc en bus.|نذهب إلى الحديقة بالحافلة.|Chúng tôi đi công viên bằng xe buýt.')],[T('Months: в + month|ماه‌ها|mois|الأشهر|tháng'),g('Я был в Африке в октябре.','I was in Africa in October.|من مهر تو آفریقا بودم.|J’étais en Afrique en octobre.|كنت في أفريقيا في أكتوبر.|Tôi ở châu Phi vào tháng Mười.')],[T('Events: на + event|رویدادها|événements|الأحداث|sự kiện'),g('В субботу мы были на дискотеке.','On Saturday we were at the disco.|شنبه تو دیسکو بودیم.|Samedi, nous étions à la discothèque.|يوم السبت كنا في الديسكو.|Thứ Bảy chúng tôi ở vũ trường.')]]));

h+=cd('3 · Singular endings|۳ · پایانه‌های مفرد','Almost every noun takes -е. Watch the soft endings -ие, -ия (-ии) and -ь.|بیشتر اسم‌ها -е میگیرن. مراقب پایانه‌های نرم -ие، -ия (-ии) و -ь باش.',tb(['Gender|جنسیت','Nom → Prep','Rule|قاعده'],[['Masc.|مذکر','театр → в <b>театре</b> · словарь → в <b>словаре</b> · Петербург → о <b>Петербурге</b>','-∅ / -ь → -е'],['Masc.|مذکر','музей → в <b>музее</b> · Китай → о <b>Китае</b> · медведь → о <b>медведе</b>','-й → -е'],['Neuter|خنثی','озеро → в <b>озере</b> · море → в <b>море</b> · здание → в <b>здании</b> · путешествие → о <b>путешествии</b>','-о / -е → -е · -ие → -ии'],['Fem.|مؤنث','Москва → в <b>Москве</b> · песня → в <b>песне</b>','-а / -я → -е'],['Fem.|مؤنث','тетрадь → в <b>тетради</b> · любовь → о <b>любви</b> · Россия → в <b>России</b>','-ь / -ия → -и'],['Indeclinable|بدون تغییر','Осло → в <b>Осло</b> · Токио → в <b>Токио</b> · Хельсинки → в <b>Хельсинки</b> · Тампере → в <b>Тампере</b>','unchanged']].map(r=>[T(r[0]),r[1],T(r[2])])));

h+=cd('5 · в or на?|۵ · в یا на؟','в and на both mean location. There is no logic to learn; memorize the groups: на = events, open spaces, directions, islands, stations.|в و на هر دو مکان رو نشون میدن. قانون خاصی نداره؛ گروه‌ها رو حفظ کن: на = رویدادها، فضاهای باز، جهت‌ها، جزیره و ایستگاه.',L(['<b>в</b> — в стране (в России, в Америке) · в городе (в Петербурге, в Москве) · в деревне · в центре · в магазине · в супермаркете · в университете · в школе · в офисе · в фирме · в консерватории · в филармонии · в театре · в музее · в бассейне · в спортзале · в кафе · в ресторане · в клубе · в гостях · в лесу · в парке · в саду · в гостинице · в номере · в аэропорту','<b>на</b> — на острове · на севере / юге / востоке / западе · на улице · на проспекте · на площади · на рынке · на факультете · на занятии · на лекции · на уроке · на работе · на почте · на фабрике · на заводе · на концерте · на балете · на опере · на выставке · на экскурсии · на тренировке · на стадионе · на футболе · на матче · на завтраке / обеде / ужине · на дискотеке · на дне рождения · на празднике · на встрече · на даче · на пикнике · на берегу · на пляже · на озере · на море · на вокзале · на поезде · на самолёте','<b>за городом</b> (outside the city)'])+EX([['Я живу на улице Пятницкая, в центре.','I live on Pyatnitskaya Street, in the center.|من در خیابان پیاتنیتسکایا، توی مرکز زندگی میکنم.|J’habite rue Pyatnitskaya, au centre.|أسكن في شارع بياتنيتسكايا في المركز.|Tôi sống ở phố Pyatnitskaya, ở trung tâm.'],['В каникулы мы отдыхали на юге, на море.','During the holidays we rested in the south, by the sea.|تو تعطیلات جنوب بودیم، کنار دریا.|Pendant les vacances nous nous sommes reposés dans le sud, au bord de la mer.|في العطلة استرحنا في الجنوب على البحر.|Kỳ nghỉ chúng tôi nghỉ ở miền Nam, bên biển.']]));

h+=cd('6 · Months & seasons|۶ · ماه‌ها و فصل‌ها','Months use в + Prepositional; seasons use the Instrumental without a preposition.|ماه‌ها: в + پادژ ۶؛ فصل‌ها: پادژ ۵ بدون حرف اضافه.',tb(['Nom','когда?','Meaning|معنی'],MO.map(m=>[`<span class='ru'>${m[0]}</span>`,`<b>${m[2]}</b>`,T(m[1])]))+tb(['Season|فصل','когда?','Months|ماه‌ها'],[[T('winter|زمستان|hiver|شتاء|mùa đông'),'<b>зимой</b>','декабрь · январь · февраль'],[T('spring|بهار|printemps|ربيع|mùa xuân'),'<b>весной</b>','март · апрель · май'],[T('summer|تابستان|été|صيف|mùa hè'),'<b>летом</b>','июнь · июль · август'],[T('autumn|پاییز|automne|خريف|mùa thu'),'<b>осенью</b>','сентябрь · октябрь · ноябрь']])+EX([['Я хотел бы побывать в Японии весной, в марте.','I would like to visit Japan in spring, in March.|میخوام بهار، مارس، به ژاپن برم.|J’aimerais visiter le Japon au printemps, en mars.|أود زيارة اليابان في الربيع، في مارس.|Tôi muốn đến Nhật vào mùa xuân, tháng Ba.']]));
h+=cd('7 · ходить / ездить vs быть|۷ · ходить / ездить در برابر быть','ходить / ездить answer куда? (Accusative); быть answers где? (Prepositional).|ходить / ездить جواب куда؟ (پادژ ۴)؛ быть جواب где؟ (پادژ ۶).',tb(['куда? (Acc)','где? (Prep)'],[['в библиотеку','в библиотеке'],['на дискотеку','на дискотеке'],['в Сибирь','в Сибири'],['на юг','на юге'],['в Африку','в Африке'],['в театр','в театре']])+EX([['В пятницу я ходил в библиотеку, а в субботу был на дискотеке.','On Friday I went to the library, and on Saturday I was at the disco.|جمعه رفتم کتابخونه و شنبه دیسکو بودم.|Vendredi je suis allé à la bibliothèque, samedi j’étais à la discothèque.|يوم الجمعة ذهبت إلى المكتبة ويوم السبت كنت في الديسكو.|Thứ Sáu tôi đi thư viện, thứ Bảy tôi ở vũ trường.'],['Зимой они ездили на юг, а летом были на севере.','In winter they went south, and in summer they were in the north.|زمستون رفتن جنوب و تابستون شمال بودن.|En hiver ils sont allés dans le sud, en été ils étaient dans le nord.|في الشتاء ذهبوا إلى الجنوب وفي الصيف كانوا في الشمال.|Mùa đông họ đi miền Nam, mùa hè họ ở miền Bắc.']]));
h+=cd('8 · Transport: на чём?|۸ · وسیله‌ی نقلیه','ездить на чём? — means of transport use на + Prepositional.|ездить на чём؟ — وسایل نقلیه با на + پادژ ۶.',tb(['Transport|وسیله','на чём?'],[[T('car|ماشین|voiture|سيارة|ô tô'),'<b>на машине</b>'],[T('bus|اتوبوس|bus|حافلة|xe buýt'),'<b>на автобусе</b>'],[T('minibus (marshrutka)|مینی‌بوس|minibus|ميني باص|xe buýt nhỏ'),'<b>на маршрутке</b>'],[T('train|قطار|train|قطار|tàu hỏa'),'<b>на поезде</b>'],[T('metro|مترو|métro|مترو|tàu điện ngầm'),'<b>на метро</b>'],[T('motorcycle|موتور|moto|دراجة نارية|xe máy'),'<b>на мотоцикле</b>'],[T('bicycle|دوچرخه|vélo|دراجة|xe đạp'),'<b>на велосипеде</b>'],[T('tram · trolleybus|ترام · ترولیبوس|tram · trolleybus|ترام · ترولي|xe điện · xe buýt điện'),'<b>на трамвае · на троллейбусе</b>']])+EX([['— На чём ты ездишь в центр? — На маршрутке.','— How do you go downtown? — By minibus.|— چطور میری مرکز؟ — با مینی‌بوس.|— Comment vas-tu au centre ? — En minibus.|— كيف تذهب إلى المركز؟ — بالميني باص.|— Bạn đi vào trung tâm bằng gì? — Bằng xe buýt nhỏ.']]));
h+=cd('9 · Plural endings|۹ · پایانه‌های جمع','Plural: -ах after hard endings, -ях after soft ones; irregular plurals keep the same -ах / -ях.|جمع: -ах بعد از سخت و -ях بعد از نرم؛ جمع‌های بی‌قاعده هم -ах / -ях.',tb(['Nom pl → Prep pl','Rule|قاعده'],[['театры → в <b>театрах</b> · музеи → в <b>музеях</b> · выставки → на <b>выставках</b> · клубы → в <b>клубах</b> · дискотеки → на <b>дискотеках</b>','-ы → -ах · -и → -ях'],['газеты → в <b>газетах</b> · журналы → в <b>журналах</b> · комнаты → в <b>комнатах</b> · кровати → на <b>кроватях</b> · столы → на <b>столах</b> · шкафы → в <b>шкафах</b>','same rule'],['города → в <b>городах</b> · машины → на <b>машинах</b> · трамваи → на <b>трамваях</b> · автобусы → на <b>автобусах</b> · маршрутки → на <b>маршрутках</b>','same rule'],['друзья → о <b>друзьях</b> · люди → о <b>людях</b> · дети → о <b>детях</b> · братья → о <b>братьях</b> · сыновья → о <b>сыновьях</b> · матери → о <b>матерях</b> · дочери → о <b>дочерях</b>','irregular plurals']].map(r=>[r[0],T(r[1])]))+EX([['В газетах и в журналах можно прочитать рассказы и статьи.','In newspapers and magazines you can read stories and articles.|توی روزنامه و مجله میشه داستان و مقاله خوند.|Dans les journaux et les magazines on peut lire des récits et des articles.|في الجرائد والمجلات يمكن قراءة قصص ومقالات.|Trên báo và tạp chí có thể đọc truyện và bài viết.'],['Люди ездят на машинах, на трамваях и на автобусах.','People travel by car, tram and bus.|آدم‌ها با ماشین و ترام و اتوبوس میرن.|Les gens se déplacent en voiture, en tram et en bus.|يتنقل الناس بالسيارات والترام والحافلات.|Mọi người di chuyển bằng ô tô, xe điện và xe buýt.']]));
h+=cd('10 · Personal pronouns|۱۰ · ضمایر شخصی','After a preposition the pronouns он, она, они take н-: о нём, в ней, на них. о becomes обо before мне.|بعد از حرف اضافه ضمیرهای он/она/они н- میگیرن. о قبل از мне میشه обо.',tb(['Nom','о ком?','в / на + pron.'],[['я','<b>обо мне</b>','в мне · на мне'],['ты','<b>о тебе</b>','на тебе'],['он · оно','<b>о нём</b>','в нём · на нём'],['она','<b>о ней</b>','в ней · на ней'],['мы','<b>о нас</b>','в нас · на нас'],['вы','<b>о вас</b>','в вас · на вас'],['они','<b>о них</b>','в них · на них'],['—','<b>о себе</b>','на себе']])+EX([['Я часто думаю о тебе. Он всегда рассказывает о себе.','I often think about you. He always talks about himself.|من اغلب به تو فکر میکنم. اون همیشه از خودش حرف میزنه.|Je pense souvent à toi. Il parle toujours de lui.|أفكر بك كثيرًا. هو يتحدث دائمًا عن نفسه.|Tôi hay nghĩ về bạn. Anh ấy luôn nói về mình.'],['Это моя тетрадь. В ней я пишу упражнения.','This is my notebook. I write exercises in it.|این دفترمه. توش تمرین مینویسم.|C’est mon cahier. J’y écris les exercices.|هذا دفتري. أكتب فيه التمارين.|Đây là vở của tôi. Tôi viết bài tập vào đó.']]));
h+=cd('11 · Adjectives & pronouns|۱۱ · صفت و ضمایر','Endings copy the noun. Question: в каком? в какой? в каких?|پایانه‌ها از اسم کپی میشن.',tb(['','Masc. & Neut.|مذکر و خنثی','Fem.|مؤنث','Plural|جمع'],[['Question|سوال','в каком? · в чьём?','в какой? · в чьей?','в каких? · в чьих?'],['Adjective|صفت','-ом / -ем','-ой / -ей','-ых / -их'],['my|مال من','моём','моей','моих'],['your (ты)|مال تو','твоём','твоей','твоих'],['our|مال ما','нашем','нашей','наших'],['your (вы)|مال شما','вашем','вашей','ваших'],['own|مال خود','своём','своей','своих'],['his · her · their|مال او','в его / в нём','в её / в ней','в их / в них'],['this · that|این · اون','этом · том','этой · той','этих · тех'],['one · all|یک · همه','одном · всём','одной · всей','одних · всех']].map(r=>[T(r[0]),r[1],r[2],r[3]]))+EX([['— Вы были в нашем городе? — Да, мы уже были в вашем городе.','— Have you been in our city? — Yes, we have been in your city.|— تو شهر ما بودید؟ — آره، تو شهر شما بودیم.|— Avez-vous été dans notre ville ? — Oui, nous avons été dans votre ville.|— هل كنتم في مدينتنا؟ — نعم، كنا في مدينتكم.|— Bạn đã ở thành phố của chúng tôi chưa? — Rồi, chúng tôi đã ở thành phố của bạn.'],['Мы много знаем о вашей стране и были на всех ваших праздниках.','We know a lot about your country and were at all your festivals.|ما درباره‌ی کشور شما زیاد میدونیم و تو همه‌ی جشن‌هاتون بودیم.|Nous savons beaucoup sur votre pays et nous avons été à toutes vos fêtes.|نعرف الكثير عن بلدكم وكنا في كل أعيادكم.|Chúng tôi biết nhiều về đất nước bạn và đã dự mọi lễ hội của bạn.']]));
h+=cd('12 · о / об / обо|۱۲ · о / об / обо','о before a consonant, об before а о у э и, обо before мне. Words that take о чём? о ком?|о قبل صامت، об قبل صدادار، обо قبل мне.',tb(['Rule|قاعده','Examples'],[[T('о + consonant|о + صامت'),'о Петербурге · о Китае · о медведе · о море · о Москве · о песне · о любви · о России'],[T('об + vowel|об + صوتی'),'об озере · об учёбе · об Австралии'],[T('обо + мне|обо + мне'),'обо мне'],[T('about what?|درباره‌ی چی؟'),'книга · фильм · статья · балет · опера · новости · роман · рассказ · информация · программа → <b>о чём? о ком?</b>']])+EX([['Вечером я смотрел документальный фильм о Марсе. Мы разговаривали об учёбе.','In the evening I watched a documentary about Mars. We talked about studies.|عصر یه مستند درباره‌ی مریخ دیدم. درباره‌ی درس حرف زدیم.|Le soir j’ai regardé un documentaire sur Mars. Nous avons parlé des études.|مساءً شاهدت فيلمًا وثائقيًا عن المريخ. تحدثنا عن الدراسة.|Tối tôi xem phim tài liệu về sao Hỏa. Chúng tôi nói về việc học.']]));
h+=cd('13 · который in the Prepositional|۱۳ · который در پادژ ۶','который takes its gender and number from the noun; here it is the Prepositional because of в / на / о.|который جنس و تعداد رو از اسم میگیره؛ اینجا پادژ ۶ ه چون в / на / о میاد.',tb(['Gender|جنسیت','Form'],[['Masc. · Neut.','<b>в котором · на котором · о котором</b>'],['Fem.','<b>в которой · на которой · о которой</b>'],['Plural','<b>в которых · на которых · о которых</b>']])+EX([['Это город, в котором я жил. Это книга, о которой я читал.','This is the city where I lived. This is the book I read about.|این شهریه که توش زندگی میکردم. این کتابیه که درباره‌ش خوندم.|C’est la ville où j’ai vécu. C’est le livre dont j’ai lu.|هذه المدينة التي عشت فيها. هذا الكتاب الذي قرأت عنه.|Đây là thành phố nơi tôi từng sống. Đây là cuốn sách tôi đã đọc về nó.']]));
h+=cd('14 · Prepositions|۱۴ · حروف اضافه','These four prepositions take the Prepositional.|این چهار حرف اضافه پادژ ۶ میخوان.',tb(['Preposition|حرف اضافه','Meaning|معنی'],PT[5].map(s=>s.split('|')).map(p=>[`<span class='ru'>${p[0]}</span>`,(p[1+IX[lang]]||(IX[lang]==6?PX(p[1]):p[1]))])));

'быть, стать, работать + Instrumental':'быть, стать, работать + instrumental pour les métiers ; les intérêts : заниматься + instrumental.|быть وстать وработать + حالة الأداة للمهن؛ والاهتمامات: заниматься + الأداة.|быть, стать, работать + công cụ cách cho nghề; sở thích: заниматься + công cụ cách.',
'A noun with an adjective takes':'Un nom avec un adjectif prend la terminaison de l’instrumental sur les deux mots.|الاسم مع الصفة يأخذان نهاية الأداة معًا.|Danh từ cùng tính từ đều mang đuôi công cụ cách.',
'который keeps gender and number':'который garde le genre et le nombre du nom ; la terminaison de l’instrumental vient de с / над ou du verbe.|который يحتفظ بجنس الاسم وعدده؛ ونهاية الأداة تأتي من с / над أو من الفعل.|который giữ giống và số của danh từ; đuôi công cụ cách do с / над hoặc động từ quyết định.',
'Что с вами? asks about':'Что с вами ? demande comment va quelqu’un. Réponse : Со мной всё в порядке.|Что с вами؟ تسأل عن حال شخص. الجواب: Со мной всё в порядке.|Что с вами? hỏi về tình trạng của ai đó. Trả lời: Со мной всё в порядке.',
'быть / стать / работать are followed':'быть / стать / работать sont suivis de l’instrumental pour les métiers : Он стал врачом.|بعد быть / стать / работать تأتي حالة الأداة للمهن: Он стал врачом.|Sau быть / стать / работать dùng công cụ cách cho nghề: Он стал врачом.',
'Present tense has no быть':'Au présent il n’y a pas быть : Он врач (nominatif). Au passé ou au futur : Он был врачом (instrumental).|في المضارع لا يوجد быть: Он врач (مرفوع). في الماضي أو المستقبل: Он был врачом (أداة).|Ở hiện tại không có быть: Он врач (danh cách). Quá khứ/tương lai: Он был врачом (công cụ cách).',
