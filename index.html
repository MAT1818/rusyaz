'с means “with”':'с + instrumental = « avec », mais с + génitif = « de » : с другом / с работы.|с + الأداة = «مع» لكن с + المضاف = «من»: с другом / с работы.|с + công cụ cách = “cùng”, còn с + sở hữu cách = “từ”: с другом / с работы.',
'Instrumental is not used after':'La plupart des prépositions de lieu exigent le génitif ; перед, под, над, за, рядом с exigent l’instrumental.|معظم حروف المكان تتطلب المضاف؛ أما перед، под، над، за، рядом с فتتطلب الأداة.|Phần lớn giới từ vị trí đi với sở hữu cách; перед, под, над, за, рядом с đi với công cụ cách.'});
function instrPage(){const{T,g,tb,cd,c}=H(4);let h=cmp(4);const L=a=>`<div class='grid'>${a.map(x=>`<div class='box'>${x}</div>`).join('')}</div>`;
const EX=a=>tb(['Example|مثال'],a.map(x=>[g(x[0],x[1])]));
h+=cd('1 · What is the Instrumental?|۱ · پادژ پنجم (Творительный) چیه؟','Questions: чем? кем? (by what? / by whom?). The Instrumental names the tool or means, the person you do things WITH (с кем?), the job or role after быть/стать/работать, and interests.|سوال: чем؟ кем؟ . ابزار یا وسیله، کسی که «باهاش» کاری میکنی (с кем؟)، شغل بعد از быть/стать/работать و علایق رو نشون میده.',tb(['Use|کاربرد','Example|مثال'],[[T('Interest, activity: чем?|علاقه و فعالیت: чем؟|intérêt, activité|الاهتمام والنشاط|sở thích, hoạt động'),g('Раньше я занимался спортом.','Before, I used to do sports.|قبلاً ورزش میکردم.|Avant, je faisais du sport.|كنت أمارس الرياضة سابقًا.|Trước đây tôi chơi thể thao.')],[T('Tool, means: чем?|ابزار و وسیله: чем؟|outil, moyen|الأداة والوسيلة|công cụ, phương tiện'),g('Все люди пишут ручкой.','All people write with a pen.|همه با خودکار مینویسن.|Tout le monde écrit avec un stylo.|يكتب الجميع بالقلم.|Mọi người viết bằng bút.')],[T('Job, role: кем?|شغل و نقش: кем؟|métier, rôle|المهنة والدور|nghề nghiệp, vai trò'),g('Мой отец работает учителем.','My father works as a teacher.|پدرم معلم کار میکنه.|Mon père travaille comme professeur.|يعمل أبي معلمًا.|Bố tôi làm giáo viên.')],[T('Pride, admiration: гордиться, любоваться|افتخار و تحسین|fierté, admiration|الفخر والإعجاب|tự hào, ngắm'),g('Мать гордится дочерью.','The mother is proud of her daughter.|مادر به دخترش افتخار میکنه.|La mère est fière de sa fille.|الأم فخورة بابنتها.|Người mẹ tự hào về con gái.')],[T('With: с кем? с чем?|با: с кем؟ с чем؟|avec|مع|cùng'),g('Я хожу в кино с другом.','I go to the cinema with a friend.|با دوستم سینما میرم.|Je vais au cinéma avec un ami.|أذهب إلى السينما مع صديق.|Tôi đi xem phim với bạn.')],[T('Position: перед, под, над, за, рядом с|مکان: перед، под، над، за، рядом с|position|الموضع|vị trí'),g('Над столом висит картина.','A picture hangs above the table.|یه تابلو بالای میز آویزونه.|Un tableau est accroché au-dessus de la table.|تتدلى لوحة فوق الطاولة.|Có bức tranh treo phía trên bàn.')]]));
h+=cd('2 · Verbs with the Instrumental|۲ · فعل‌های پادژ ۵','Learn the verb together with чем? / кем?. Groups: interests and means (чем?), professions (кем?).|فعل رو با чем؟ / кем؟ یاد بگیر. گروه‌ها: علایق و وسیله (чем؟) و شغل (кем؟).',L(['<b>чем?</b><br>заниматься / заняться · интересоваться / заинтересоваться · увлекаться / увлечься · пользоваться / воспользоваться · писать / написать · рисовать / нарисовать · любоваться · гордиться','<b>кем?</b><br>быть · работать · становиться / стать','<b>с кем?</b><br>заниматься / заняться · учиться · работать · жить · дружить · встречаться / встретиться · знакомиться / познакомиться · проводить / провести время · обедать / пообедать · ужинать / поужинать · завтракать / позавтракать · гулять / погулять · ходить / пойти · ездить / поехать · приходить / прийти · советоваться / посоветоваться · говорить / поговорить · разговаривать · спорить / поспорить'])+EX([['Чем вы раньше занимались? — Я занимался спортом.','What did you do before? — I did sports.|قبلاً چیکار میکردی؟ — ورزش میکردم.|Que faisiez-vous avant ? — Je faisais du sport.|ماذا كنت تفعل سابقًا؟ — كنت أمارس الرياضة.|Trước đây bạn làm gì? — Tôi chơi thể thao.'],['Кем хочет стать твоя сестра? — Моя сестра хочет стать актрисой.','What does your sister want to become? — An actress.|خواهرت میخواد چی بشه؟ — بازیگر.|Que veut devenir ta sœur ? — Actrice.|ماذا تريد أختك أن تصبح؟ — ممثلة.|Chị bạn muốn trở thành gì? — Diễn viên.'],['В парке мы любовались природой.','In the park we admired nature.|تو پارک از طبیعت لذت بردیم.|Au parc nous avons admiré la nature.|في الحديقة تأملنا الطبيعة.|Ở công viên chúng tôi ngắm thiên nhiên.']]));
h+=cd('3 · Singular endings|۳ · پایانه‌های مفرد','Masculine and neuter take -ом/-ем, feminine -ой/-ей; after ц ш ж ч щ (unstressed) use -ем/-ей.|مذکر و خنثی -ом/-ем، مؤنث -ой/-ей؛ بعد از ц ш ж ч щ (بدون تکیه) -ем/-ей.',tb(['Gender|جنسیت','Nom → Instr','Rule|قاعده'],[['Masc.|مذکر','спорт → <b>спортом</b> · врач → <b>врачом</b> · муж → <b>мужем</b>','-∅ → -ом (-ем after ж ч ш щ ц unstressed)'],['Masc.|مذکر','музей → <b>музеем</b> · учитель → <b>учителем</b> · иностранец → <b>иностранцем</b>','-й / -ь → -ем'],['Neuter|خنثی','озеро → <b>озером</b> · море → <b>морем</b> · здание → <b>зданием</b>','-о → -ом · -е → -ем · -ие → -ием'],['Fem.|مؤنث','музыка → <b>музыкой</b> · спортсменка → <b>спортсменкой</b>','-а → -ой'],['Fem.|مؤنث','семья → <b>семьёй</b> · история → <b>историей</b> · учительница → <b>учительницей</b> · секретарша → <b>секретаршей</b>','-я → -ей (-ёй stressed) · after ц ш ж ч щ → -ей'],['Fem.|مؤنث','кисть → <b>кистью</b> · мать → <b>матерью</b> · дочь → <b>дочерью</b>','-ь → -ью (мать, дочь: -ерью)']].map(r=>[T(r[0]),r[1],T(r[2])]))+EX([['Мой дедушка был инженером.','My grandfather was an engineer.|پدربزرگم مهندس بود.|Mon grand-père était ingénieur.|كان جدي مهندسًا.|Ông tôi từng là kỹ sư.'],['Художники рисуют кистью.','Artists paint with a brush.|نقاش‌ها با قلم‌مو نقاشی میکنن.|Les artistes peignent au pinceau.|يرسم الفنانون بالفرشاة.|Họa sĩ vẽ bằng cọ.']]));
h+=cd('4 · с кем? — with|۴ · с кем؟ — با کی','с + Instrumental means “with”. Before some words it becomes со: со мной, со спортсменкой.|с + پادژ ۵ یعنی «با». قبل از بعضی کلمه‌ها со میشه: со мной، со спортсменкой.',tb(['Nom','с + Instr'],[['друг · учитель · иностранец · муж','<b>с другом · с учителем · с иностранцем · с мужем</b>'],['подруга · тётя · Мария · спортсменка','<b>с подругой · с тётей · с Марией · со спортсменкой</b>'],['учительница · секретарша','<b>с учительницей · с секретаршей</b>'],['мать · дочь','<b>с матерью · с дочерью</b>']])+EX([['Я разговаривала по телефону с подругой.','I talked on the phone with a friend.|با دوستم تلفنی صحبت کردم.|J’ai parlé au téléphone avec une amie.|تحدثت هاتفيًا مع صديقتي.|Tôi nói chuyện điện thoại với bạn.'],['В библиотеке я познакомилась с японцем и американкой.','In the library I met a Japanese man and an American woman.|تو کتابخونه با یه ژاپنی و یه آمریکایی آشنا شدم.|À la bibliothèque j’ai fait la connaissance d’un Japonais et d’une Américaine.|في المكتبة تعرفت على ياباني وأمريكية.|Ở thư viện tôi làm quen với một người Nhật và một người Mỹ.']]));
h+=cd('5 · Plural endings|۵ · پایانه‌های جمع','Plural: -ами / -ями for all genders; four irregular plurals must be memorized.|جمع: -ами / -ями برای همه‌ی جنس‌ها؛ چهار جمع بی‌قاعده رو باید حفظ کنی.',tb(['Nom pl → Instr pl','Rule|قاعده'],[['космонавты → <b>космонавтами</b> · журналисты → <b>журналистами</b> · художники → <b>художниками</b> · японцы → <b>японцами</b> · шведы → <b>шведами</b> · лётчики → <b>лётчиками</b>','hard → -ами'],['родители → <b>родителями</b> · тетради → <b>тетрадями</b> · девушки → <b>девушками</b> · парни → <b>парнями</b> · подруги → <b>подругами</b> · ручки → <b>ручками</b> · внуки → <b>внуками</b>','soft / -и → -ями'],['друзья → <b>друзьями</b> · сыновья → <b>сыновьями</b> · братья → <b>братьями</b>','-ья → -ьями'],['дети → <b>детьми</b> · люди → <b>людьми</b> · дочери → <b>дочерьми</b> · лошади → <b>лошадьми</b>','irregular!'],['ложки → <b>ложками</b> · ножи → <b>ножами</b> · вилки → <b>вилками</b>','tools: чем?']].map(r=>[r[0],T(r[1])]))+EX([['Я езжу в Пушкин с друзьями.','I go to Pushkin with friends.|با دوستام به پوشکین میرم.|Je vais à Pouchkine avec des amis.|أذهب إلى بوشكين مع الأصدقاء.|Tôi đi Pushkin cùng bạn bè.'],['Я всегда советуюсь с родителями.','I always consult my parents.|همیشه با پدر و مادرم مشورت میکنم.|Je consulte toujours mes parents.|أستشير والدي دائمًا.|Tôi luôn hỏi ý kiến bố mẹ.'],['Дети гуляют с родителями.','Children walk with their parents.|بچه‌ها با پدر و مادر قدم میزنن.|Les enfants se promènent avec leurs parents.|يتمشى الأطفال مع والديهم.|Trẻ em đi dạo cùng bố mẹ.']]));
h+=cd('6 · Personal pronouns|۶ · ضمایر شخصی','After a preposition the pronouns take н-: с ним, с ней, с ними, перед ним. “Что с вами?” = What is wrong with you?|بعد از حرف اضافه ضمیرها н- میگیرن: с ним، с ней، с ними، перед ним. «Что с вами؟» = چتونه؟',tb(['Nom','Instr','с + Instr'],[['я','мной','<b>со мной</b>'],['ты','тобой','<b>с тобой</b>'],['он · оно','им','<b>с ним</b>'],['она','ей','<b>с ней</b>'],['мы','нами','<b>с нами</b>'],['вы','вами','<b>с вами</b>'],['они','ими','<b>с ними</b>'],['—','собой','<b>с собой</b>']])+EX([['Моя сестра любит спорить со мной.','My sister likes to argue with me.|خواهرم دوست داره باهام بحث کنه.|Ma sœur aime se disputer avec moi.|تحب أختي أن تجادلني.|Chị tôi thích tranh luận với tôi.'],['Мы хотим пойти в театр. Ты пойдёшь с нами?','We want to go to the theater. Will you come with us?|میخوایم تئاتر بریم. با ما میای؟|Nous voulons aller au théâtre. Tu viens avec nous ?|نريد الذهاب إلى المسرح. هل تأتي معنا؟|Chúng tôi muốn đi xem kịch. Bạn đi cùng chứ?'],['Я познакомилась с ним в университете.','I met him at university.|تو دانشگاه باهاش آشنا شدم.|Je l’ai rencontré à l’université.|تعرفت عليه في الجامعة.|Tôi quen anh ấy ở trường.']]));
h+=cd('7 · Что с вами?|۷ · Что с вами؟','Что с вами? asks about someone’s condition. Answer: Со мной всё в порядке.|Что с вами؟ حال کسی رو میپرسه. جواب: Со мной всё в порядке.',tb(['Question','Answer'],[['Что с вами? · Что с тобой?','<b>Со мной всё в порядке.</b> · <b>Ничего.</b>'],['Что с ним случилось? · Что с ней?','<b>С ним ничего. · С ней всё хорошо.</b>'],['Что с нами может случиться?','<b>С нами ничего не случится.</b>'],['Что с ними? · Что с машиной?','<b>С ними всё в порядке. · С ней всё хорошо.</b>']])+EX([['Что с тобой? Почему ты такая грустная? — Ничего, со мной всё в порядке.','What is wrong? Why are you so sad? — Nothing, I am fine.|چیه؟ چرا اینقدر غمگینی؟ — هیچی، حالم خوبه.|Qu’as-tu ? Pourquoi es-tu si triste ? — Rien, tout va bien.|ما بك؟ لماذا أنت حزينة؟ — لا شيء، أنا بخير.|Bạn sao thế? Sao buồn vậy? — Không có gì, tôi ổn.']]));
const PI=PT[4].map(s=>s.split('|'));
h+=cd('8 · Prepositions: перед, под, над, за, рядом с|۸ · حروف اضافه','Six prepositions take the Instrumental; learn them by meaning.|شش حرف اضافه پادژ ۵ میخوان؛ با معنی یادشون بگیر.',tb(['Preposition|حرف اضافه','Meaning|معنی'],PI.map(p=>[`<span class='ru'>${p[0]}</span>`,(p[1+IX[lang]]||(IX[lang]==6?PX(p[1]):p[1]))]))+EX([['Перед занятиями я всегда пью кофе.','Before classes I always drink coffee.|قبل از کلاس همیشه قهوه میخورم.|Avant les cours je bois toujours du café.|قبل الدروس أشرب القهوة دائمًا.|Trước giờ học tôi luôn uống cà phê.'],['Гараж находится под домом.','The garage is under the house.|گاراژ زیر خونه‌ست.|Le garage est sous la maison.|الكراج تحت البيت.|Nhà để xe nằm dưới nhà.'],['Я живу рядом с университетом.','I live next to the university.|کنار دانشگاه زندگی میکنم.|J’habite à côté de l’université.|أسكن بجانب الجامعة.|Tôi sống cạnh trường đại học.'],['В классе мы сидим за столами. В театре я сидела за женщиной.','In class we sit at desks. In the theater I sat behind a woman.|تو کلاس پشت میزها میشینیم. تو تئاتر پشت یه خانم نشستم.|En classe nous sommes assis aux tables. Au théâtre j’étais assise derrière une femme.|في الصف نجلس على الطاولات. في المسرح جلست خلف امرأة.|Trong lớp chúng tôi ngồi ở bàn. Ở rạp tôi ngồi sau một phụ nữ.'],['В субботу я ходила в магазин за продуктами.','On Saturday I went to the shop for groceries.|شنبه برای خرید مواد غذایی رفتم مغازه.|Samedi je suis allée au magasin chercher des provisions.|يوم السبت ذهبت إلى المتجر لشراء المواد الغذائية.|Thứ Bảy tôi đi cửa hàng mua đồ ăn.']]));
const AB=[['радость','joy|شادی|joie|فرح|niềm vui','с радостью'],['удовольствие','pleasure|لذت|plaisir|متعة|niềm vui thích','с удовольствием'],['интерес','interest|علاقه|intérêt|اهتمام|sự quan tâm','с интересом'],['гордость','pride|غرور|fierté|فخر|niềm tự hào','с гордостью'],['удивление','surprise|تعجب|surprise|دهشة|ngạc nhiên','с удивлением'],['труд','difficulty|زحمت|difficulté|صعوبة|khó khăn','с трудом'],['лёгкость','ease|سهولت|facilité|سهولة|dễ dàng','с лёгкостью'],['беспокойство','anxiety|نگرانی|inquiétude|قلق|lo lắng','с беспокойством'],['надежда','hope|امید|espoir|أمل|hy vọng','с надеждой'],['любовь','love|عشق|amour|حب|tình yêu','с любовью']];
h+=cd('9 · с + abstract noun (how?)|۹ · с + اسم معنی (چطور؟)','с + abstract noun answers как? (in what manner).|с + اسم معنی جواب как؟ میده (به چه شکل).',tb(['Noun','с + Instr','Meaning|معنی'],AB.map(x=>[`<span class='ru'>${x[0]}</span>`,`<b>${x[2]}</b>`,T(x[1])]))+EX([['Я с радостью прочитал ваше письмо.','I read your letter with joy.|نامه‌تون رو با خوشحالی خوندم.|J’ai lu votre lettre avec joie.|قرأت رسالتك بفرح.|Tôi đọc thư của bạn với niềm vui.'],['Родители часто говорят о детях с гордостью.','Parents often speak of their children with pride.|پدر و مادرها اغلب با افتخار از بچه‌هاشون حرف میزنن.|Les parents parlent souvent de leurs enfants avec fierté.|يتحدث الآباء عن أبنائهم بفخر.|Cha mẹ thường nói về con với niềm tự hào.'],['Я переводил этот текст с трудом.','I translated this text with difficulty.|این متن رو به سختی ترجمه کردم.|J’ai traduit ce texte avec difficulté.|ترجمت هذا النص بصعوبة.|Tôi dịch văn bản này rất khó khăn.'],['Мы слушали его рассказ с интересом.','We listened to his story with interest.|داستانش رو با علاقه گوش دادیم.|Nous avons écouté son récit avec intérêt.|استمعنا إلى قصته باهتمام.|Chúng tôi nghe câu chuyện của anh ấy với sự quan tâm.']]));
h+=cd('10 · Adjectives & pronouns|۱۰ · صفت و ضمایر','Endings copy the noun. Question: каким? с каким?|پایانه‌ها از اسم کپی میشن. سوال: каким؟ с каким؟',tb(['','Masc. & Neut.|مذکر و خنثی','Fem.|مؤنث','Plural|جمع'],[['Question|سوال','каким? · с каким? · с чьим?','какой? · с какой? · с чьей?','какими? · с какими? · с чьими?'],['Adjective|صفت','-ым / -им','-ой / -ей','-ыми / -ими'],['my|مال من','с моим','с моей','с моими'],['your (ты)|مال تو','с твоим','с твоей','с твоими'],['our|مال ما','с нашим','с нашей','с нашими'],['your (вы)|مال شما','с вашим','с вашей','с вашими'],['own|مال خود','со своим','со своей','со своими'],['his · her · their|مال او','с его / с ним','с её / с ней','с их / с ними'],['this · that|این · اون','с этим · с тем','с этой · с той','с этими · с теми'],['one · all|یک · همه','с одним · со всем','с одной · со всей','с одними · со всеми']].map(r=>[T(r[0]),r[1],r[2],r[3]]))+EX([['Я разговаривал с твоим другом.','I talked with your friend.|با دوستت صحبت کردم.|J’ai parlé avec ton ami.|تحدثت مع صديقك.|Tôi nói chuyện với bạn của bạn.'],['Он встречался с моей сестрой.','He was meeting my sister.|با خواهرم قرار داشت.|Il rencontrait ma sœur.|كان يلتقي بأختي.|Anh ấy đã gặp chị tôi.'],['Я говорю по телефону с вашими друзьями.','I talk on the phone with your friends.|با دوستای شما تلفنی صحبت میکنم.|Je parle au téléphone avec vos amis.|أتحدث هاتفيًا مع أصدقائكم.|Tôi nói chuyện điện thoại với bạn của các bạn.'],['Я ходил в кино с этой девушкой.','I went to the cinema with this girl.|با این دختر سینما رفتم.|Je suis allé au cinéma avec cette fille.|ذهبت إلى السينما مع هذه الفتاة.|Tôi đi xem phim với cô gái này.']]));
h+=cd('11 · свой|۱۱ · свой','свой refers to the subject: Я говорю со своим братом; Он говорит с моим братом.|свой به فاعل برمیگرده: Я говорю со своим братом؛ Он говорит с моим братом.',tb(['Person','свой','Example|مثال'],[['я','со своим братом','Я говорю со своим братом Джоном.'],['ты','со своим братом','Ты говоришь со своим братом Андреем.'],['он · она','со своим братом','Он говорит со своим братом Антоном.'],['мы · вы · они','со своими братьями','Они говорят со своими братьями.']])+EX([['Он живёт вместе со своими родителями.','He lives together with his own parents.|با پدر و مادر خودش زندگی میکنه.|Il vit avec ses propres parents.|يعيش مع والديه.|Anh ấy sống cùng bố mẹ mình.'],['Я люблю проводить время со своими друзьями.','I love spending time with my friends.|دوست دارم با دوستام وقت بگذرونم.|J’aime passer du temps avec mes amis.|أحب قضاء الوقت مع أصدقائي.|Tôi thích dành thời gian bên bạn bè.']]));
const PR=[['физика — физик','physics — physicist|فیزیک — فیزیکدان|physique — physicien|فيزياء — فيزيائي|vật lý — nhà vật lý','заниматься физикой → стать физиком'],['балет — балерина','ballet — ballerina|باله — بالرین|ballet — ballerine|باليه — راقصة باليه|ba lê — vũ công ba lê','заниматься балетом → стать балериной'],['фотография — фотограф','photography — photographer|عکاسی — عکاس|photographie — photographe|تصوير — مصور|nhiếp ảnh — nhiếp ảnh gia','заниматься фотографией → стать фотографом'],['бизнес — бизнесмен','business — businessman|تجارت — تاجر|affaires — homme d’affaires|أعمال — رجل أعمال|kinh doanh — doanh nhân','заниматься бизнесом → стать бизнесменом'],['перевод — переводчица','translation — translator (f.)|ترجمه — مترجم (زن)|traduction — traductrice|ترجمة — مترجمة|dịch — dịch giả nữ','заниматься переводом → стать переводчицей'],['спорт — спортсмен','sport — athlete|ورزش — ورزشکار|sport — sportif|رياضة — رياضي|thể thao — vận động viên','заниматься спортом → стать спортсменом'],['информатика — программист','computer science — programmer|انفورماتیک — برنامه‌نویس|informatique — programmeur|معلوماتية — مبرمج|tin học — lập trình viên','заниматься информатикой → стать программистом']];
h+=cd('12 · Interests and professions|۱۲ · علایق و شغل‌ها','быть, стать, работать + Instrumental for jobs; interests use заниматься + Instrumental.|быть، стать، работать + پادژ ۵ برای شغل؛ علایق: заниматься + پادژ ۵.',tb(['Field — job','Phrase','Meaning|معنی'],PR.map(x=>[`<span class='ru'>${x[0]}</span>`,`<b>${x[2]}</b>`,T(x[1])]))+EX([['Кем работает твой отец? — Мой отец работает учителем.','What does your father do? — He works as a teacher.|پدرت چیکاره‌ست؟ — معلمه.|Que fait ton père ? — Il est professeur.|ماذا يعمل أبوك؟ — يعمل معلمًا.|Bố bạn làm nghề gì? — Bố tôi là giáo viên.'],['Во Франции я дружила с Полем, Жаком и Жозефиной.','In France I was friends with Paul, Jacques and Josephine.|تو فرانسه با پل و ژاک و ژوزفین دوست بودم.|En France j’étais amie avec Paul, Jacques et Joséphine.|في فرنسا صادقت بول وجاك وجوزفين.|Ở Pháp tôi chơi thân với Paul, Jacques và Joséphine.'],['Он хочет заниматься бизнесом и стать бизнесменом.','He wants to do business and become a businessman.|میخواد تجارت کنه و تاجر بشه.|Il veut faire des affaires et devenir homme d’affaires.|يريد العمل في التجارة وأن يصبح رجل أعمال.|Anh ấy muốn kinh doanh và trở thành doanh nhân.']]));
h+=cd('13 · Adjective + noun|۱۳ · صفت + اسم','A noun with an adjective takes the Instrumental ending on both words.|اسم همراه با صفت، هر دو پایانه‌ی پادژ ۵ میگیرن.',EX([['Она была известной балериной.','She was a famous ballerina.|بالرین معروفی بود.|Elle était une ballerine célèbre.|كانت راقصة باليه مشهورة.|Cô ấy từng là vũ công ba lê nổi tiếng.'],['Над большим письменным столом висит картина.','A picture hangs above the big desk.|یه تابلو بالای میز تحریر بزرگ آویزونه.|Un tableau est accroché au-dessus du grand bureau.|تتدلى لوحة فوق المكتب الكبير.|Bức tranh treo trên chiếc bàn viết lớn.'],['Я увлекаюсь современной музыкой.','I am into modern music.|به موسیقی مدرن علاقه دارم.|Je suis passionné de musique moderne.|أنا مهتم بالموسيقى الحديثة.|Tôi mê âm nhạc hiện đại.'],['Китайцы и японцы пишут иероглифы чёрной тушью.','Chinese and Japanese write characters with black ink.|چینی‌ها و ژاپنی‌ها با جوهر سیاه هیروگلیف مینویسن.|Les Chinois et les Japonais écrivent les caractères à l’encre noire.|يكتب الصينيون واليابانيون الحروف بالحبر الأسود.|Người Trung Quốc và Nhật viết chữ bằng mực đen.'],['Я ездила на дачу со своими школьными друзьями.','I went to the dacha with my school friends.|با دوستای مدرسه‌ام رفتم ویلا.|Je suis allée à la datcha avec mes amis d’école.|ذهبت إلى الداتشا مع أصدقاء المدرسة.|Tôi đi nhà nghỉ ngoại ô với bạn học.']]));
h+=cd('14 · который in the Instrumental|۱۴ · который در پادژ ۵','который keeps gender and number from the noun; the Instrumental ending comes from с / над or the verb.|который جنس و تعداد رو از اسم میگیره؛ پایانه‌ی پادژ ۵ از с / над یا فعل میاد.',tb(['Gender|جنسیت','Form'],[['Masc. · Neut.','<b>которым · с которым · над которым</b>'],['Fem.','<b>которой · с которой · над которой</b>'],['Plural','<b>которыми · с которыми · над которыми</b>']].map(r=>[r[0],r[1]]))+EX([['Сегодня я встретил девушку, с которой познакомился на дискотеке.','Today I met the girl I got to know at the disco.|امروز دختری رو دیدم که تو دیسکو باهاش آشنا شدم.|Aujourd’hui j’ai rencontré la fille que j’ai connue à la discothèque.|اليوم قابلت الفتاة التي تعرفت عليها في الديسكو.|Hôm nay tôi gặp cô gái mà tôi quen ở vũ trường.'],['Я занимаюсь бизнесом, которым занимался мой отец.','I do the business my father used to do.|من تجارتی میکنم که پدرم میکرد.|Je fais le commerce que faisait mon père.|أعمل في التجارة التي كان يعمل بها أبي.|Tôi làm nghề kinh doanh mà bố tôi từng làm.'],['Мы поставили столы, над которыми повесили лампы.','We put up tables above which we hung lamps.|میزهایی گذاشتیم که بالاشون لامپ آویزون کردیم.|Nous avons mis des tables au-dessus desquelles nous avons suspendu des lampes.|وضعنا طاولات علقنا فوقها مصابيح.|Chúng tôi đặt những cái bàn, phía trên treo đèn.']]));
h+=`<div class='card' style='--cc:${c}'><h2>${T('15 · Tips|۱۵ · نکته‌ها')}</h2><div class='grid'>`+['быть / стать / работать are followed by the Instrumental for jobs: Он стал врачом.|بعد از быть / стать / работать شغل پادژ ۵ میگیره: Он стал врачом.','Present tense has no быть: Он врач (Nominative). Past or future: Он был врачом (Instrumental).|زمان حال быть نداریم: Он врач (پادژ ۱). گذشته یا آینده: Он был врачом (پادژ ۵).','мать → матерью, дочь → дочерью; irregular plurals: детьми, людьми, дочерьми, лошадьми.|мать → матерью، дочь → дочерью؛ جمع‌های بی‌قاعده: детьми، людьми، дочерьми، лошадьми.','с means “with” (Instrumental) but “from” with the Genitive: с другом / с работы.|с با پادژ ۵ یعنی «با» ولی با پادژ ۲ یعنی «از»: с другом / с работы.','Instrumental is not used after у, около, без, для, от, до, из: those need the Genitive.|بعد از у، около، без، для، от، до، из پادژ ۲ میاد نه ۵.'].map(x=>`<div class='box tip'>${T(x)}</div>`).join('')+'</div></div>';
return `<div style='--cc:${c}'>${h}</div>`}

const EX=(a)=>tb(['Example|مثال'],a.map(x=>[g(x[0],x[1])]));
h+=cd('1 · What is the Accusative?|۱ · پادژ چهارم (Винительный) چیه؟','Questions: кого? что? (whom / what). It marks the DIRECT OBJECT, the receiver of the action. It also shows direction (куда?), some time words, price and measure. Two things decide the form: gender and animacy (alive or not).|سوال: кого؟ что؟ . مفعول مستقیم رو نشون میده (کی/چی کار روش انجام میشه). جهت (куда؟)، بعضی زمان‌ها، قیمت و اندازه هم هست. دو چیز شکل رو تعیین میکنه: جنسیت و جاندار بودن.',tb(['Use|کاربرد','Example|مثال'],[[T('Direct object|مفعول مستقیم|complément direct|المفعول به|tân ngữ trực tiếp'),g('Мама читает книгу.','Mom reads a book.|مامان کتاب میخونه.|Maman lit un livre.|الأم تقرأ كتابًا.|Mẹ đọc sách.')],[T('Direction: в / на + Acc|جهت|direction|الاتجاه|hướng đi'),g('Мы идём в парк. Он идёт на работу.','We go to the park. He goes to work.|ما میریم پارک. اون میره سر کار.|Nous allons au parc. Il va au travail.|نذهب إلى الحديقة. هو يذهب إلى العمل.|Chúng tôi đi công viên. Anh ấy đi làm.')],[T('Time: days, duration, frequency|زمان|temps|الزمن|thời gian'),g('Я приду в пятницу. Он спал всю ночь.','I will come on Friday. He slept all night.|جمعه میام. اون تمام شب خوابید.|Je viendrai vendredi. Il a dormi toute la nuit.|سآتي يوم الجمعة. نام الليل كله.|Tôi sẽ đến thứ Sáu. Anh ấy ngủ cả đêm.')],[T('За, про, через, под|за، про، через، под|за, про, через, под|за، про، через، под|за, про, через, под'),g('Спасибо за помощь. Он рассказывает про Россию.','Thanks for the help. He tells about Russia.|ممنون بابت کمک. اون درباره‌ی روسیه تعریف میکنه.|Merci pour l’aide. Il parle de la Russie.|شكرًا على المساعدة. يحكي عن روسيا.|Cảm ơn vì sự giúp đỡ. Anh ấy kể về nước Nga.')],[T('Price & measure|قیمت و اندازه|prix|السعر|giá'),g('Билет стоит сто рублей.','The ticket costs 100 rubles.|بلیت صد روبل میشه.|Le billet coûte 100 roubles.|التذكرة بمئة روبل.|Vé giá một trăm rúp.')]]));
h+=cd('2 · Verbs with the Accusative|۲ · فعل‌های پادژ ۴','Learn the verb pairs (imperfective / perfective). Two groups: things (что?) and people (кого?). Some verbs need на + Accusative.|جفت‌فعل‌ها رو یاد بگیر (ناقص / کامل). دو گروه: چیزها (что؟) و آدم‌ها (кого؟). بعضی فعل‌ها на + پادژ ۴ میخوان.',L(['<b>что?</b><br>делать / сделать · есть / съесть · пить / выпить · говорить / сказать · убирать / убрать · изучать / изучить · читать / прочитать · понимать / понять · писать / написать · слушать / послушать · учить / выучить · смотреть / посмотреть · запоминать / запомнить · видеть / увидеть · знать / узнать · покупать / купить · готовить / приготовить · открывать / открыть · закрывать / закрыть · помнить / вспомнить · любить · хотеть','<b>кого?</b><br>знать / узнать · звать / позвать · ждать / подождать · видеть / увидеть · любить / полюбить · помнить / запомнить · вспоминать / вспомнить · забывать / забыть · спрашивать / спросить · встречать / встретить · понимать / понять · слушать / послушать · слышать / услышать · приглашать / пригласить · просить / попросить · брать / взять','<b>на + Acc</b><br>смотреть на кого? на что? · надеяться на кого? на что?<br>Я надеюсь на отца. Он смотрит на студентку.'])+EX([['Я смотрю фильм. Я знаю его.','I watch a movie. I know him.|من فیلم میبینم. اونو میشناسم.|Je regarde un film. Je le connais.|أشاهد فيلمًا. أعرفه.|Tôi xem phim. Tôi biết anh ấy.'],['Я надеюсь на отца.','I count on my father.|من به پدرم امید دارم.|Je compte sur mon père.|أعتمد على أبي.|Tôi trông cậy vào bố.']]));
h+=cd('3 · Singular nouns|۳ · اسم‌های مفرد','Inanimate (что?): masculine and neuter do not change; only feminine -а/-я change. Animate (кого?): masculine takes the Genitive form; feminine behaves the same as inanimate.|بی‌جان: مذکر و خنثی تغییر نمیکنن؛ فقط مؤنث -а/-я عوض میشه. جاندار: مذکر شکل پادژ ۲ رو میگیره؛ مؤنث مثل بی‌جان.',tb(['Type|نوع','Nom → Acc','Rule|قاعده'],[['Masc. inanimate|مذکر بی‌جان','бутерброд → <b>бутерброд</b> · музей → <b>музей</b> · словарь → <b>словарь</b>','= Nom.'],['Neuter|خنثی','слово → <b>слово</b> · море → <b>море</b> · здание → <b>здание</b>','= Nom.'],['Fem. inanimate|مؤنث بی‌جان','страна → <b>страну</b> · песня → <b>песню</b> · аудитория → <b>аудиторию</b>','-а → -у · -я → -ю · -ия → -ию'],['Fem. -ь|مؤنث -ь','тетрадь → <b>тетрадь</b> · мать → <b>мать</b> · дочь → <b>дочь</b>','= Nom.'],['Masc. animate|مذکر جاندار','брат → <b>брата</b> · учитель → <b>учителя</b> · Андрей → <b>Андрея</b> · Игорь → <b>Игоря</b> · американец → <b>американца</b>','= Gen.'],['Fem. animate|مؤنث جاندار','учительница → <b>учительницу</b> · тётя → <b>тётю</b> · Мария → <b>Марию</b> · секретарша → <b>секретаршу</b>','-а → -у · -я → -ю'],['Full names|اسم کامل','Дмитрий Медведев → <b>Дмитрия Медведева</b> · Анна Павлова → <b>Анну Павлову</b> · Александр Петрович → <b>Александра Петровича</b>','each part changes|هر بخش']].map(r=>[T(r[0]),r[1],T(r[2])]))+EX([['Я вижу брата. Я вижу сестру.','I see my brother. I see my sister.|برادرم رو میبینم. خواهرم رو میبینم.|Je vois mon frère. Je vois ma sœur.|أرى أخي. أرى أختي.|Tôi thấy anh trai. Tôi thấy chị gái.'],['Я знаю Анну и Ивана.','I know Anna and Ivan.|آنا و ایوان رو میشناسم.|Je connais Anna et Ivan.|أعرف آنا وإيفان.|Tôi biết Anna và Ivan.']]));
h+=cd('4 · Plural nouns|۴ · اسم‌های جمع','Inanimate plural = Nominative. Animate plural (all genders) = Genitive plural. Compare the two cases on the same word.|جمع بی‌جان = پادژ ۱. جمع جاندار (همه‌ی جنس‌ها) = جمع پادژ ۲. یه کلمه رو تو دو پادژ مقایسه کن.',tb(['Type|نوع','Nom pl → Acc pl','Rule|قاعده'],[['Inanimate|بی‌جان','бутерброды · музеи · словари · страны · песни · аудитории · тетради → same|همان','= Nom.'],['Fem. animate|مؤنث جاندار','подруги → <b>подруг</b> · тёти → <b>тётей</b> · мыши → <b>мышей</b> · сёстры → <b>сестёр</b> · девушки → <b>девушек</b> · студентки → <b>студенток</b>','= Gen. pl.'],['Masc. animate|مذکر جاندار','журналисты → <b>журналистов</b> · родители → <b>родителей</b> · врачи → <b>врачей</b> · малыши → <b>малышей</b>','= Gen. pl.'],['Irregular|بی‌قاعده','друг → <b>друзей</b> · сын → <b>сыновей</b> · мать → <b>матерей</b> · дочь → <b>дочерей</b> · дети → <b>детей</b> · люди → <b>людей</b> · BUT брат → <b>братьев</b>','memorize|حفظ'],['After ц|بعد از ц','stressed -ов: отцы → <b>отцов</b> · unstressed -ев: немцы → <b>немцев</b>','-ов / -ев']].map(r=>[T(r[0]),r[1],T(r[2])]))+tb(['Accusative|پادژ ۴','Genitive|پادژ ۲'],[[g('Я видела журналистов, врачей и учителей.','I saw journalists, doctors and teachers.|روزنامه‌نگارها و دکترها و معلم‌ها رو دیدم.|J’ai vu des journalistes, des médecins et des professeurs.|رأيت صحفيين وأطباء ومعلمين.|Tôi thấy các nhà báo, bác sĩ và giáo viên.'),g('Здесь нет журналистов, врачей и учителей.','There are no journalists, doctors or teachers here.|اینجا روزنامه‌نگار و دکتر و معلم نیست.|Il n’y a pas de journalistes, de médecins ni de professeurs ici.|لا يوجد هنا صحفيون ولا أطباء ولا معلمون.|Ở đây không có nhà báo, bác sĩ hay giáo viên.')],[g('Все любят кошек, собак и детей.','Everyone loves cats, dogs and children.|همه گربه و سگ و بچه دوست دارن.|Tout le monde aime les chats, les chiens et les enfants.|الجميع يحبون القطط والكلاب والأطفال.|Ai cũng yêu mèo, chó và trẻ em.'),g('У меня нет денег и нет детей.','I have no money and no children.|من پول و بچه ندارم.|Je n’ai ni argent ni enfants.|ليس لدي مال ولا أطفال.|Tôi không có tiền và không có con.')]]));
const DW=[['понедельник','Monday|دوشنبه|lundi|الاثنين|thứ Hai','в понедельник'],['вторник','Tuesday|سه‌شنبه|mardi|الثلاثاء|thứ Ba','во вторник'],['среда','Wednesday|چهارشنبه|mercredi|الأربعاء|thứ Tư','в среду'],['четверг','Thursday|پنجشنبه|jeudi|الخميس|thứ Năm','в четверг'],['пятница','Friday|جمعه|vendredi|الجمعة|thứ Sáu','в пятницу'],['суббота','Saturday|شنبه|samedi|السبت|thứ Bảy','в субботу'],['воскресенье','Sunday|یکشنبه|dimanche|الأحد|Chủ nhật','в воскресенье'],['выходной день','weekend, day off|روز تعطیل|jour de repos|يوم عطلة|ngày nghỉ','в выходной день']];
h+=cd('5 · Days of the week|۵ · روزهای هفته','в + Accusative answers когда? (when?). Only feminine days change; во before вторник.|в + پادژ ۴ جواب когда؟ . فقط روزهای مؤنث عوض میشن؛ قبل از вторник во میاد.',tb(['Nom','Acc: когда?','Meaning|معنی'],DW.map(d=>[`<span class='ru'>${d[0]}</span>`,`<b>${d[2]}</b>`,T(d[1])])));
h+=cd('6 · Personal pronouns|۶ · ضمایر شخصی','The Accusative looks exactly like the Genitive (the form after у). The reflexive себя refers back to the subject.|پادژ ۴ دقیقاً شبیه پادژ ۲ ه (شکل بعد از у). себя به فاعل برمیگرده.',tb(['Nom','Acc кого?','Gen (у кого?)'],[['я','<b>меня</b>','у меня'],['ты','<b>тебя</b>','у тебя'],['он · оно','<b>его</b>','у него'],['она','<b>её</b>','у неё'],['мы','<b>нас</b>','у нас'],['вы','<b>вас</b>','у вас'],['они','<b>их</b>','у них'],['—','<b>себя</b>','у себя']])+EX([['Ирина прекрасно поёт. Все слушают её.','Irina sings beautifully. Everyone listens to her.|ایرینا عالی میخونه. همه به اون گوش میدن.|Irina chante superbement. Tout le monde l’écoute.|إيرينا تغني بشكل رائع. الجميع يستمعون إليها.|Irina hát rất hay. Ai cũng nghe cô ấy.'],['Это мой ключ. Я никогда не забываю его.','This is my key. I never forget it.|این کلیدمه. هیچ‌وقت فراموشش نمیکنم.|C’est ma clé. Je ne l’oublie jamais.|هذا مفتاحي. لا أنساه أبدًا.|Đây là chìa khóa của tôi. Tôi không bao giờ quên nó.'],['Я буду ждать тебя на остановке.','I will wait for you at the stop.|سر ایستگاه منتظرت میمونم.|Je t’attendrai à l’arrêt.|سأنتظرك في المحطة.|Tôi sẽ đợi bạn ở trạm.']]));
h+=cd('7 · Modifiers with INANIMATE nouns|۷ · صفت و ضمایر با اسم بی‌جان','Masculine and plural stay like the Nominative; only the feminine changes (-ую / -юю).|مذکر و جمع مثل پادژ ۱ ان؛ فقط مؤنث عوض میشه (-ую / -юю).',tb(['','Masc.|مذکر','Neut.|خنثی','Fem.|مؤنث','Plural|جمع'],[['Question|سوال','какой? чей?','какое? чьё?','какую? чью?','какие? чьи?'],['Adjective|صفت','-ый / -ой / -ий','-ое / -ее','<b>-ую / -юю</b>','-ые / -ие'],['my · your|مال من · تو','мой · твой','моё · твоё','<b>мою · твою</b>','мои · твои'],['our · your · own|مال ما · شما · خود','наш · ваш · свой','наше · ваше · своё','<b>нашу · вашу · свою</b>','наши · ваши · свои'],['his · her · their|مال او · آنها','его','её','её','их'],['this · that|این · اون','этот — тот','это — то','<b>эту — ту</b>','эти — те'],['one · all|یک · همه','один — весь','одно — всё','<b>одну — всю</b>','одни — все']].map(r=>[T(r[0]),r[1],r[2],r[3],r[4]]))+EX([['Мы любим наши фильмы.','We love your films.|ما فیلم‌های خودمون رو دوست داریم.|Nous aimons nos films.|نحب أفلامنا.|Chúng tôi yêu phim của mình.'],['Она убрала нашу комнату.','She cleaned our room.|اون اتاق ما رو تمیز کرد.|Elle a rangé notre chambre.|نظّفت غرفتنا.|Cô ấy dọn phòng của chúng tôi.'],['Я купила новое синее пальто.','I bought a new blue coat.|یه پالتوی آبیِ نو خریدم.|J’ai acheté un nouveau manteau bleu.|اشتريت معطفًا أزرق جديدًا.|Tôi mua một chiếc áo khoác xanh mới.']]));
h+=cd('8 · Modifiers with ANIMATE nouns|۸ · صفت و ضمایر با اسم جاندار','Masculine singular and all plurals now take the Genitive endings; the feminine stays -ую / -юю.|مذکر مفرد و همه‌ی جمع‌ها پایانه‌ی پادژ ۲ میگیرن؛ مؤنث -ую / -юю میمونه.',tb(['','Masc. & Neut.|مذکر و خنثی','Fem.|مؤنث','Plural|جمع'],[['Question|سوال','какого? чьего?','какую? чью?','каких? чьих?'],['Adjective|صفت','<b>-ого / -его</b>','-ую / -юю','<b>-ых / -их</b>'],['my|مال من','<b>моего</b>','мою','<b>моих</b>'],['your (ты)|مال تو','<b>твоего</b>','твою','<b>твоих</b>'],['our|مال ما','<b>нашего</b>','нашу','<b>наших</b>'],['your (вы)|مال شما','<b>вашего</b>','вашу','<b>ваших</b>'],['own|مال خود','<b>своего</b>','свою','<b>своих</b>'],['his · her · their|مال او','его','её','их'],['this · that|این · اون','<b>этого — того</b>','эту — ту','<b>этих — тех</b>'],['one · all|یک · همه','<b>одного — всего</b>','одну — всю','<b>одних — всех</b>']].map(r=>[T(r[0]),r[1],r[2],r[3]]))+tb(['Why do the endings differ?|چرا پایانه‌ها فرق دارن؟'],[[g('интересный роман (inanimate) · симпатичного человека (animate)','an interesting novel · a nice person|یه رمان جالب · یه آدم خوب|un roman intéressant · une personne sympathique|رواية مثيرة · شخص لطيف|một cuốn tiểu thuyết hay · một người dễ mến')],[g('интересную книгу · симпатичную девушку · интересные книги · интересных людей','an interesting book · a nice girl · interesting books · interesting people|یه کتاب جالب · یه دختر خوب · کتاب‌های جالب · آدم‌های جالب|un livre intéressant · une fille sympathique · des livres intéressants · des gens intéressants|كتاب مثير · فتاة لطيفة · كتب مثيرة · أناس مثيرون|một cuốn sách hay · một cô gái dễ mến · những cuốn sách hay · những người thú vị')]])+EX([['Я знаю этого молодого профессора.','I know this young professor.|این استاد جوون رو میشناسم.|Je connais ce jeune professeur.|أعرف هذا الأستاذ الشاب.|Tôi biết vị giáo sư trẻ này.'],['Мы знаем русские народные песни и интересных людей.','We know Russian folk songs and interesting people.|ما آهنگ‌های محلی روسی و آدم‌های جالب میشناسیم.|Nous connaissons des chansons populaires russes et des gens intéressants.|نعرف أغاني روسية شعبية وأناسًا مثيرين.|Chúng tôi biết dân ca Nga và những người thú vị.']]));
h+=cd('9 · свой, мой, его|۹ · свой، мой، его','свой = belongs to the SUBJECT of the sentence. мой / твой / наш / ваш = someone else’s. его · её · их never change.|свой = مال فاعل جمله. мой/твой/наш/ваш = مال یکی دیگه. его · её · их هیچ‌وقت عوض نمیشن.',tb(['Person','Own: свой','Example|مثال'],[['я','свой дом · свою машину · свои компьютеры','Я люблю свой дом.'],['ты','свою комнату','Ты убираешь свою комнату.'],['он','свою сестру','Он любит свою сестру.'],['она','своего друга · свою машину','Она любит свою машину.'],['мы · вы · они','свою комнату · своих друзей','Мы убираем свою комнату.']])+EX([['Я взял свою книгу. Он взял мою книгу.','I took my own book. He took my book.|من کتاب خودم رو برداشتم. اون کتاب منو برداشت.|J’ai pris mon livre. Il a pris mon livre.|أخذت كتابي. أخذ هو كتابي.|Tôi lấy sách của tôi. Anh ấy lấy sách của tôi.'],['Он любит свою сестру. Я встретил его сестру.','He loves his own sister. I met his sister.|اون خواهر خودش رو دوست داره. من خواهرش رو دیدم.|Il aime sa sœur. J’ai rencontré sa sœur.|يحب أخته. قابلت أخته.|Anh ấy yêu chị của mình. Tôi gặp chị của anh ấy.']]));
h+=cd('10 · весь · этот · один|۱۰ · весь، этот، один','These words agree with the noun and use the endings in tables 7 and 8.|این کلمات با اسم هماهنگ میشن.',tb(['Word','Examples','Translation|ترجمه'],[['весь (all)','весь день · всю неделю · всё время · все выходные · всю группу · все вещи',T('the whole day · whole week · all the time · all weekend · whole group · all the things|تمام روز · هفته · همیشه · تمام آخر هفته · کل گروه · همه‌ی وسایل|toute la journée · semaine · tout le temps · tout le week-end · tout le groupe · toutes les affaires|اليوم كله · الأسبوع كله · طوال الوقت · العطلة كلها · المجموعة كلها · كل الأشياء|cả ngày · cả tuần · suốt · cả cuối tuần · cả nhóm · mọi thứ')],['этот (this)','этот бутерброд · это письмо · эту фразу · эти тексты',T('this sandwich · this letter · this phrase · these texts|این ساندویچ · نامه · عبارت · متن‌ها|ce sandwich · cette lettre · cette phrase · ces textes|هذا الساندويتش · الرسالة · العبارة · النصوص|bánh mì này · bức thư này · câu này · các văn bản này')],['один (one)','один бутерброд · одно правило · одну чашку кофе · одни люди',T('one sandwich · one rule · one cup of coffee · some people|یک ساندویچ · یک قانون · یک فنجان قهوه · بعضی آدم‌ها|un sandwich · une règle · une tasse de café · certaines personnes|ساندويتش واحد · قاعدة واحدة · فنجان قهوة · بعض الناس|một bánh mì · một quy tắc · một tách cà phê · một số người')]]));
h+=cd('11 · Invitations & Как зовут|۱۱ · دعوت و اسم','приглашать кого? куда? / пойти, поехать куда? куда = в / на + Accusative. Как зовут + Acc.|приглашать кого؟ куда؟ . куда = в / на + پادژ ۴. Как зовут + پادژ ۴.',tb(['Pattern|الگو','Example|مثال'],[[T('кого? куда?|кого؟ куда؟'),g('Антон пригласил подругу Анну на выставку.','Anton invited his friend Anna to an exhibition.|آنتون دوستش آنا رو به نمایشگاه دعوت کرد.|Anton a invité son amie Anna à une exposition.|دعا أنطون صديقته آنا إلى معرض.|Anton mời bạn Anna đến triển lãm.')],[T('кого? + пойти / поехать куда?|кого؟ + пойти / поехать куда؟'),g('Они пригласили Антона поехать в Москву.','They invited Anton to go to Moscow.|اونا آنتون رو دعوت کردن بره مسکو.|Ils ont invité Anton à aller à Moscou.|دعوا أنطون للذهاب إلى موسكو.|Họ mời Anton đi Mátxcơva.')],[T('Как зовут + Acc|اسم + پادژ ۴'),g('Как зовут ваших родителей? Как зовут нашего преподавателя?','What are your parents called? What is our teacher called?|اسم پدر و مادرتون چیه؟ اسم استادمون چیه؟|Comment s’appellent vos parents ? Comment s’appelle notre professeur ?|ما أسماء والديك؟ ما اسم معلمنا؟|Bố mẹ bạn tên gì? Thầy của chúng ta tên gì?')]]));
h+=cd('12 · который in the Accusative|۱۲ · который در پادژ ۴','Gender and number come from the noun it replaces; the case is Accusative because it is the object of the second clause.|جنس و تعداد از اسمی که جایگزین میکنه، پادژ ۴ چون مفعول جمله‌ی دوم ه.',tb(['Type|نوع','Form|شکل'],[['Masc. inanimate','который'],['Masc. animate','<b>которого</b>'],['Neuter','которое'],['Fem.','<b>которую</b>'],['Plural inanimate','которые'],['Plural animate','<b>которых</b>']].map(r=>[r[0],r[1]]))+EX([['Я купил новый галстук, который мне понравился.','I bought a new tie that I liked.|یه کراوات نو خریدم که خوشم اومد.|J’ai acheté une nouvelle cravate qui m’a plu.|اشتريت ربطة عنق جديدة أعجبتني.|Tôi mua cà vạt mới mà tôi thích.'],['Андрей полюбил девушку, которую он недавно встретил.','Andrei fell in love with a girl he recently met.|آندری عاشق دختری شد که تازه دیده بود.|Andreï est tombé amoureux d’une fille qu’il a rencontrée récemment.|وقع أندريه في حب فتاة قابلها مؤخرًا.|Andrei yêu cô gái mà anh vừa gặp.'],['Я знаю человека, которого ты тоже знаешь.','I know the man you also know.|مردی رو میشناسم که تو هم میشناسی.|Je connais l’homme que tu connais aussi.|أعرف الرجل الذي تعرفه أنت أيضًا.|Tôi biết người mà bạn cũng biết.'],['Нам понравились люди, которых мы встретили здесь.','We liked the people we met here.|از آدم‌هایی که اینجا دیدیم خوشمون اومد.|Nous avons aimé les gens que nous avons rencontrés ici.|أعجبنا الناس الذين قابلناهم هنا.|Chúng tôi thích những người mà chúng tôi gặp ở đây.']]));
h+=cd('13 · Prepositions|۱۳ · حروف اضافه','These prepositions take the Accusative.|این حروف اضافه پادژ ۴ میخوان.',tb(['Preposition|حرف اضافه','Meaning|معنی'],PT[3].map(s=>s.split('|')).map(p=>[`<span class='ru'>${p[0]}</span>`,(p[1+IX[lang]]||(IX[lang]==6?PX(p[1]):p[1]))])));
h+=cd('14 · Question practice|۱۴ · الگوی سوال و جواب','Ask about the modifier with какого? / какую? / каких?; answer with the matching ending.|درباره‌ی صفت با какого؟ / какую؟ / каких؟ بپرس و جواب رو با همون پایانه بده.',tb(['Example|مثال'],[[g('— Какую книгу купила твоя подруга? — Интересную книгу.','— Which book did your friend buy? — An interesting one.|— دوستت کدوم کتاب رو خرید؟ — یه کتاب جالب.|— Quel livre ton amie a-t-elle acheté ? — Un livre intéressant.|— أي كتاب اشترت صديقتك؟ — كتابًا مثيرًا.|— Bạn của bạn mua cuốn sách nào? — Một cuốn hay.')],[g('— Кого ты любишь? — Своего брата.','— Whom do you love? — My brother.|— کیو دوست داری؟ — برادر خودم رو.|— Qui aimes-tu ? — Mon frère.|— من تحب؟ — أخي.|— Bạn yêu ai? — Anh trai của mình.')],[g('— Я видела твою сестру. — А какую сестру ты видела? — Старшую.','— I saw your sister. — Which sister did you see? — The older one.|— خواهرت رو دیدم. — کدوم خواهر؟ — بزرگه.|— J’ai vu ta sœur. — Laquelle ? — L’aînée.|— رأيت أختك. — أي أخت؟ — الكبرى.|— Tôi thấy chị bạn. — Chị nào? — Chị lớn.')]]));
h+=`<div class='card' style='--cc:${c}'><h2>${T('15 · Tips|۱۵ · نکته‌ها')}</h2><div class='grid'>`+['Decision order: 1) feminine -а/-я? → -у/-ю. 2) animate masculine singular or any animate plural? → Genitive form. 3) otherwise = Nominative.|ترتیب تصمیم: ۱) مؤنث -а/-я؟ → -у/-ю. ۲) مذکر جاندار مفرد یا هر جمع جاندار؟ → شکل پادژ ۲. ۳) بقیه = پادژ ۱.','Only living beings (people, animals) are animate; things and plants are not.|فقط آدم و حیوون جاندارن؛ چیزها و گیاه نه.','Fem. -ь never changes: мать → мать, дочь → дочь, тетрадь → тетрадь.|مؤنث -ь تغییر نمیکنه.','Word order is free: Папу любит мама = Mom loves Dad. The ending shows who is who.|ترتیب جمله آزاده؛ پایانه نقش رو نشون میده.','The textbook table shows тёть; the correct Genitive/Accusative plural is тётей.|در جدول کتاب тёть نوشته؛ شکل درست тётей ه.','после в / на: куда? (Acc) vs где? (Prep): Я иду в школу — Я в школе.|в/на: куда؟ پادژ ۴ در برابر где؟ پادژ ۶.'].map(x=>`<div class='box tip'>${T(x)}</div>`).join('')+'</div></div>';

function datPage(){const{T,g,tb,cd,c}=H(2);let h=cmp(2);const E=(a,b)=>[a,b];
const X=(r,t)=>[g(r,t)];
h+=cd('1 · What is the Dative?|۱ · پادژ سوم (Дательный) چیه؟','Questions: кому? чему? (to/for whom, to/for what). It marks the RECIPIENT: who receives, hears, is helped or disturbed. It is also the case of feelings (мне холодно), age, надо/можно, and of the prepositions к and по.|سوال: кому؟ чему؟ . گیرنده رو نشون میده: کی میگیره، میشنوه، کمک میگیره یا مزاحمش میشن. پادژ حس‌ها (мне холодно)، سن، надо/можно و حروف اضافه‌ی к و по هم هست.',tb(['Use|کاربرد','Example|مثال'],[[T('Giving, telling, showing, writing|دادن، گفتن، نشون دادن، نوشتن|donner, dire, montrer, écrire|العطاء والقول والكتابة|cho, nói, chỉ, viết'),g('Андрей всегда давал Марии книги.','Andrei always gave Maria books.|آندری همیشه به ماریا کتاب میداد.|Andreï donnait toujours des livres à Maria.|كان أندريه يعطي ماريا الكتب دائمًا.|Andrei luôn đưa sách cho Maria.')],[T('Calling, helping, advising|زنگ زدن، کمک کردن، توصیه|appeler, aider, conseiller|الاتصال والمساعدة والنصح|gọi, giúp, khuyên'),g('Мать каждый день звонила дочери.','The mother called her daughter every day.|مادر هر روز به دخترش زنگ میزد.|La mère appelait sa fille chaque jour.|كانت الأم تتصل بابنتها كل يوم.|Mẹ gọi cho con gái mỗi ngày.')],[T('Liking: нравиться|دوست داشتن: нравиться|plaire|الإعجاب|thích'),g('Анна нравится Джону.','John likes Anna.|جان آنا رو دوست داره.|Anna plaît à John.|آنا تعجب جون.|John thích Anna.')],[T('Feelings & states|حس‌ها و حالت‌ها|sensations|المشاعر|cảm giác'),g('Мне холодно.','I am cold.|من سردمه.|J’ai froid.|أشعر بالبرد.|Tôi lạnh.')],[T('Age|سن|âge|العمر|tuổi'),g('Сколько тебе лет? — Мне двадцать лет.','How old are you? — I am twenty.|چند سالته؟ — بیست سالمه.|Quel âge as-tu ? — J’ai vingt ans.|كم عمرك؟ — عمري عشرون سنة.|Bạn bao nhiêu tuổi? — Tôi hai mươi tuổi.')],[T('надо, нужно, можно, нельзя|надо، нужно، можно، нельзя'),g('Анне нельзя курить.','Anna must not smoke.|آنا نباید سیگار بکشه.|Anna ne doit pas fumer.|لا يجوز لآنا التدخين.|Anna không được hút thuốc.')],[T('к + Dative: going to someone|к + پادژ ۳: رفتن پیش کسی|vers / chez|إلى عند|đến chỗ'),g('Сегодня я иду к дяде.','Today I am going to my uncle’s.|امروز میرم پیش دایی.|Aujourd’hui je vais chez mon oncle.|اليوم أذهب إلى عمي.|Hôm nay tôi đến nhà chú.')],[T('по + Dative|по + پادژ ۳'),g('Дети гуляют по парку.','The children walk around the park.|بچه‌ها تو پارک قدم میزنن.|Les enfants se promènent dans le parc.|يتمشى الأطفال في الحديقة.|Bọn trẻ đi dạo trong công viên.')]]));
h+=cd('2 · Verbs with the Dative|۲ · فعل‌های پادژ ۳','Learn the verb together with кому. Both aspects are shown (imperfective / perfective).|فعل رو با кому یاد بگیر. هر دو وجه نشون داده شده.',`<div class='grid'><div class='box'>нравиться / понравиться · говорить / сказать · рассказывать / рассказать · звонить / позвонить · показывать / показать · давать / дать · дарить / подарить</div><div class='box'>писать / написать · посылать / послать · советовать / посоветовать · обещать / пообещать · объяснять / объяснить · мешать / помешать · помогать / помочь · покупать / купить · продавать / продать</div></div>`);
h+=cd('3 · Singular endings|۳ · پایانه‌های مفرد','Masculine and neuter take -у/-ю, feminine -е or -и.|مذکر و خنثی -у/-ю می‌گیرن، مؤنث -е یا -и.',tb(['Gender|جنسیت','Nom → Dat','Rule|قاعده'],[['Masc.|مذکر','друг → <b>другу</b> · брат → <b>брату</b>','-∅ → -у'],['Masc.|مذکر','Андрей → <b>Андрею</b> · Игорь → <b>Игорю</b> · учитель → <b>учителю</b>','-й / -ь → -ю'],['Neuter|خنثی','окно → <b>окну</b> · море → <b>морю</b> · здание → <b>зданию</b> · время → <b>времени</b>','-о → -у · -е → -ю · -ие → -ию'],['Fem.|مؤنث','мама → <b>маме</b> · сестра → <b>сестре</b> · тётя → <b>тёте</b>','-а / -я → -е'],['Fem.|مؤنث','Мария → <b>Марии</b> · аудитория → <b>аудитории</b>','-ия → -ии'],['Fem.|مؤنث','мать → <b>матери</b> · дочь → <b>дочери</b> · тетрадь → <b>тетради</b>','-ь → -и']].map(r=>[T(r[0]),r[1],T(r[2])])));
h+=cd('4 · Plural endings|۴ · پایانه‌های جمع','All genders: -ам after hard endings, -ям after soft ones. The word to learn is “-ам / -ям”.|همه‌ی جنس‌ها: -ам بعد از سخت و -ям بعد از نرم.',tb(['Nom pl → Dat pl','Rule|قاعده'],[['студенты → <b>студентам</b> · туристы → <b>туристам</b> · парни → <b>парням</b>','-ы / -и → -ам / -ям'],['девушки → <b>девушкам</b> · женщины → <b>женщинам</b> · подруги → <b>подругам</b> · тёти → <b>тётям</b>','feminine'],['зрители → <b>зрителям</b> · покупатели → <b>покупателям</b> · родители → <b>родителям</b>','-и → -ям'],['друзья → <b>друзьям</b> · братья → <b>братьям</b> · сыновья → <b>сыновьям</b> · дети → <b>детям</b> · люди → <b>людям</b>','irregular plurals'],['матери → <b>матерям</b> · дочери → <b>дочерям</b> · москвичи → <b>москвичам</b> · певцы → <b>певцам</b>','-ам / -ям']].map(r=>[r[0],T(r[1])]))+tb(['Example|مثال'],[[g('Преподавательница посоветовала студентам больше читать.','The teacher advised the students to read more.|معلم به دانشجوها توصیه کرد بیشتر بخونن.|La professeure a conseillé aux étudiants de lire plus.|نصحت المعلمة الطلاب بالقراءة أكثر.|Cô giáo khuyên sinh viên đọc nhiều hơn.')],[g('Родители часто покупают подарки сыновьям и дочерям.','Parents often buy gifts for their sons and daughters.|پدر و مادرها اغلب برای پسر و دخترشون هدیه میخرن.|Les parents achètent souvent des cadeaux à leurs fils et filles.|يشتري الآباء هدايا لأبنائهم وبناتهم.|Cha mẹ thường mua quà cho con trai và con gái.')]]));
h+=cd('5 · Personal pronouns|۵ · ضمایر شخصی','After к and по the pronouns he/she/they take н-: к нему, ко мне.|بعد از к و по ضمیرهای او/آنها н- میگیرن: к нему.',tb(['Nom','Dat','к + Dat','по + Dat'],[['я','мне','ко мне','по мне'],['ты','тебе','к тебе','по тебе'],['он · оно','ему','к нему','по нему'],['она','ей','к ней','по ней'],['мы','нам','к нам','по нам'],['вы','вам','к вам','по вам'],['они','им','к ним','по ним'],['—','себе','к себе','по себе']])+tb(['Example|مثال'],[[g('Он всегда даёт мне книги.','He always gives me books.|اون همیشه به من کتاب میده.|Il me donne toujours des livres.|هو يعطيني الكتب دائمًا.|Anh ấy luôn đưa sách cho tôi.')],[g('Я часто покупаю себе мороженое.','I often buy myself ice cream.|من اغلب برای خودم بستنی میخرم.|Je m’achète souvent une glace.|أشتري لنفسي البوظة كثيرًا.|Tôi thường mua kem cho mình.')]]));
h+=cd('6 · Adjectives & pronouns|۶ · صفت و ضمایر','Question: какому? какой? каким? (чьему? чьей? чьим?). Endings copy the noun.|پایانه‌ها از اسم کپی میشن.',tb(['','Masc. & Neut.|مذکر و خنثی','Fem.|مؤنث','Plural|جمع'],[['Question|سوال','какому? · чьему?','какой? · чьей?','каким? · чьим?'],['Adjective|صفت','-ому / -ему','-ой / -ей','-ым / -им'],['my|مال من','моему','моей','моим'],['your (ты)|مال تو','твоему','твоей','твоим'],['our|مال ما','нашему','нашей','нашим'],['your (вы)|مال شما','вашему','вашей','вашим'],['own|مال خود','своему','своей','своим'],['this · that|این · اون','этому · тому','этой · той','этим · тем'],['such|چنین','такому','такой','таким'],['one · all|یک · همه','одному · всему','одной · всей','одним · всем'],['his · her · their|مال او','ему / к нему','ей / к ней','им / к ним']].map(r=>[T(r[0]),r[1],r[2],r[3]]))+tb(['Example|مثال'],[[g('Я звоню своему брату Джону.','I call my brother John.|من به برادرم جان زنگ میزنم.|J’appelle mon frère John.|أتصل بأخي جون.|Tôi gọi cho anh trai John.')],[g('Я показал дорогу этому туристу.','I showed the way to this tourist.|من راه رو به این توریست نشون دادم.|J’ai montré le chemin à ce touriste.|دللت هذا السائح على الطريق.|Tôi chỉ đường cho du khách này.')],[g('Мы звоним вашим родителям.','We call your parents.|ما به پدر و مادرتون زنگ میزنیم.|Nous appelons vos parents.|نتصل بوالديكم.|Chúng tôi gọi cho bố mẹ bạn.')]]));
h+=cd('7 · Feelings, age, нравиться, надо|۷ · حس، سن، нравиться و надо','Pattern: кому + word + infinitive. Past: было / будет. Age: кому + number + год / года / лет.|الگو: кому + کلمه + مصدر. گذشته: было، آینده: будет. سن: кому + عدد + год/года/лет.',tb(['Pattern|الگو','Example|مثال'],[[T('кому хорошо, плохо, холодно, жарко, интересно, трудно, скучно, весело, грустно, легко|احساس‌ها'),g('Мне было хорошо вчера. · Мне будет хорошо завтра.','I felt good yesterday. · I will feel good tomorrow.|دیروز حالم خوب بود. · فردا حالم خوب میشه.|Hier, je me sentais bien. · Demain, je me sentirai bien.|كنت بخير أمس. · سأكون بخير غدًا.|Hôm qua tôi thấy ổn. · Ngày mai tôi sẽ thấy ổn.')],[T('нравиться + noun: agrees with the thing liked|нравиться + اسم: با چیزِ دوست‌داشتنی هماهنگ میشه'),g('Они мне очень понравились. · Он мне очень понравился.','I liked them very much. · I liked him / it very much.|اونا رو خیلی دوست داشتم. · اونو خیلی دوست داشتم.|Ils m’ont beaucoup plu. · Il m’a beaucoup plu.|أعجبوني كثيرًا. · أعجبني كثيرًا.|Tôi rất thích họ. · Tôi rất thích nó.')],[T('нравиться + infinitive: always нравится|нравиться + مصدر: همیشه нравится'),g('Маме нравится готовить.','Mom likes to cook.|مامان دوست داره آشپزی کنه.|Maman aime cuisiner.|تحب أمي الطبخ.|Mẹ thích nấu ăn.')],[T('нравилось (repeated) vs понравилось (one time)|нравилось (تکراری) در برابر понравилось (یک‌بار)'),g('Раньше мне нравилось кататься на лыжах. · Мне понравилось в Москве.','I used to like skiing. · I liked it in Moscow.|قبلاً از اسکی خوشم میومد. · از مسکو خوشم اومد.|J’aimais skier. · J’ai aimé Moscou.|كنت أحب التزلج. · أعجبتني موسكو.|Trước đây tôi thích trượt tuyết. · Tôi thích Mátxcơva.')],[T('Age of things|سن چیزها'),g('Сколько лет Петербургу?','How old is St. Petersburg?|پترزبورگ چند ساله‌ست؟|Quel âge a Saint-Pétersbourg ?|كم عمر سانت بطرسبرغ؟|Saint Petersburg bao nhiêu tuổi?')],[T('кому надо / нужно + infinitive|کسی باید'),g('Нам нужно много заниматься.','We need to study a lot.|ما باید خیلی درس بخونیم.|Nous devons beaucoup étudier.|علينا أن ندرس كثيرًا.|Chúng tôi cần học nhiều.')],[T('кому можно / нельзя + infinitive|اجازه / ممنوع'),g('Вам можно есть всё.','You may eat everything.|شما میتونید همه چیز بخورید.|Vous pouvez tout manger.|يمكنك أن تأكل كل شيء.|Bạn được ăn mọi thứ.')]]));
h+=cd('8 · у кого? vs к кому?|۸ · у кого؟ در برابر к кому؟','у + Genitive = at someone’s place; к + Dative = toward someone. Verbs: ходить/пойти, ездить/поехать, приходить/приехать.|у + پادژ ۲ = پیش کسی (جا)؛ к + پادژ ۳ = به سمت کسی.',tb(['Nom','у + Gen (where?)','к + Dat (where to?)'],[['отец','у отца','к отцу'],['Андрей','у Андрея','к Андрею'],['Анна','у Анны','к Анне'],['бабушка','у бабушки','к бабушке'],['мать','у матери','к матери'],['я','у меня','ко мне']])+tb(['Example|مثال'],[[g('Вчера я был у бабушки, а сегодня ходил к дяде.','Yesterday I was at grandma’s, today I went to my uncle’s.|دیروز پیش مادربزرگ بودم و امروز رفتم پیش دایی.|Hier j’étais chez grand-mère, aujourd’hui je suis allé chez mon oncle.|أمس كنت عند جدتي واليوم ذهبت إلى عمي.|Hôm qua tôi ở nhà bà, hôm nay tôi đến nhà chú.')],[g('Анна вчера была у тебя? — Да, она приезжала ко мне.','Was Anna at your place yesterday? — Yes, she came to me.|آنا دیروز پیش تو بود؟ — آره، اومد پیش من.|Anna était chez toi hier ? — Oui, elle est venue chez moi.|هل كانت آنا عندك أمس؟ — نعم جاءت إليّ.|Hôm qua Anna ở nhà bạn à? — Ừ, cô ấy đến chỗ tôi.')]]));
h+=cd('9 · по + Dative|۹ · по + پادژ ۳','Six meanings of по. Learn them as fixed groups.|шесть معنی для по.',tb(['Meaning|معنی','Examples','Translation'],[[T('communication & media “by, over”|ارتباط و رسانه|par, via|عبر|qua'),'по телефону · по Интернету · по почте · по радио · по телевизору',T('by phone · online · by mail · on the radio · on TV|تلفنی · اینترنتی · پستی · رادیو · تلویزیون|par téléphone · en ligne · par la poste · à la radio · à la télé|عبر الهاتف · الإنترنت · البريد · الراديو · التلفاز|qua điện thoại · mạng · thư · đài · TV')],[T('to miss someone|دلتنگ بودن|manquer|الاشتياق|nhớ'),'скучать по маме · по дому',T('to miss mom · home|دلتنگ مامان · خونه|avoir envie de maman · de la maison|الاشتياق للأم · للبيت|nhớ mẹ · nhà')],[T('subject: “on / in” a field|درباره‌ی رشته|en / sur (matière)|في مادة|về môn'),'занятие по грамматике · экзамен по математике · книга по истории · учебник по экономике · лекция по литературе',T('grammar class · maths exam · history book · economics textbook · literature lecture|کلاس گرامر · امتحان ریاضی · کتاب تاریخ · کتاب اقتصاد · سخنرانی ادبیات|cours de grammaire · examen de maths · livre d’histoire · manuel d’économie · cours de littérature|درس قواعد · امتحان رياضيات · كتاب تاريخ · كتاب اقتصاد · محاضرة أدب|giờ ngữ pháp · thi toán · sách sử · giáo trình kinh tế · bài giảng văn')],[T('movement “along, around”|حرکت: در طول، اطراف|le long de|على طول|dọc theo'),'идти по улице · по тротуару · ехать по дороге · гулять по парку · по лесу · по городу',T('walk along the street · sidewalk · drive along the road · stroll in the park · forest · city|راه رفتن در خیابان · پیاده‌رو · رانندگی در جاده · قدم زدن در پارک · جنگل · شهر|marcher dans la rue · sur le trottoir · rouler sur la route · se promener dans le parc · la forêt · la ville|المشي في الشارع · الرصيف · القيادة على الطريق · التنزه في الحديقة · الغابة · المدينة|đi trên phố · vỉa hè · lái xe trên đường · dạo công viên · rừng · thành phố')],[T('travelling “around”|سفر در سراسر|voyager à travers|السفر عبر|du lịch khắp'),'путешествовать по миру · по Европе · по России',T('to travel around the world · Europe · Russia|سفر به دور دنیا · اروپا · روسیه|voyager à travers le monde · l’Europe · la Russie|السفر حول العالم · أوروبا · روسيا|du lịch thế giới · châu Âu · nước Nga')],[T('repeated places (plural)|مکان‌های متعدد (جمع)|plusieurs lieux|أماكن متعددة|nhiều nơi'),'ходить по улицам · по проспектам · по площадям · по магазинам',T('to go along streets · avenues · squares · shops|گشتن در خیابان‌ها · میدان‌ها · مغازه‌ها|aller par les rues · avenues · places · magasins|التجول في الشوارع · الميادين · المحلات|đi qua các phố · đại lộ · quảng trường · cửa hàng')]]));
h+=cd('10 · который & свой|۱۰ · который و свой','который in the Dative copies gender and number: которому, которой, которым. свой refers to the subject.|который جنس و تعداد رو کپی میکنه. свой به فاعل برمیگرده.',tb(['Example|مثال'],[[g('Я знаю человека, к которому вы ходили в гости.','I know the man you visited.|مردی رو میشناسم که شما پیشش رفتید.|Je connais l’homme chez qui vous êtes allé.|أعرف الرجل الذي زرتموه.|Tôi biết người mà bạn đã đến thăm.')],[g('Я люблю друзей, которым часто звоню.','I love the friends I often call.|دوستانی رو دوست دارم که اغلب بهشون زنگ میزنم.|J’aime les amis que j’appelle souvent.|أحب الأصدقاء الذين أتصل بهم كثيرًا.|Tôi yêu những người bạn mà tôi hay gọi.')],[g('Ты звонишь своему другу.','You call your own friend.|تو به دوست خودت زنگ میزنی.|Tu appelles ton ami.|أنت تتصل بصديقك.|Bạn gọi cho bạn của mình.')]]));
h+=cd('11 · Prepositions|۱۱ · حروف اضافه','Only к and по take the Dative.|فقط к و по پادژ ۳ میخوان.',tb(['Preposition|حرف اضافه','Meaning|معنی'],PT[2].map(s=>s.split('|')).map(p=>[`<span class='ru'>${p[0]}</span>`,(p[1+IX[lang]]||(IX[lang]==6?PX(p[1]):p[1]))])));
h+=`<div class='card' style='--cc:${c}'><h2>${T('12 · Tips|۱۲ · نکته‌ها')}</h2><div class='grid'>`+['The recipient is in the Dative, the thing given is in the Accusative: Я дарю маме книгу.|گیرنده پادژ ۳، چیز داده‌شده پادژ ۴: Я дарю маме книгу.','Feelings need no verb: Мне скучно. Past: Мне было скучно.|حس بدون فعل: Мне скучно.','нравиться: the person who likes is Dative; the thing liked is the subject: Мне нравится кофе. Мне нравятся фильмы.|нравиться: کسی که دوست داره پادژ ۳، چیز دوست‌داشتنی فاعل.','после к и по: ему → к нему, им → к ним.|بعد از к و по: ему → к нему.','Dative plural is always -ам / -ям, even for irregular plurals: друзьям, детям, людям.|جمع پادژ ۳ همیشه -ам / -ям.'].map(x=>`<div class='box tip'>${T(x)}</div>`).join('')+'</div></div>';
return `<div style='--cc:${c}'>${h}</div>`}
function genPage(){const{T,g,tb,cd,c}=H(1);let h=cmp(1);const q=(a,b)=>[a,b];
h+=cd('1 · What is the Genitive?|۱ · پادژ دوم (Родительный) چیه؟','Questions: кого? чего? (of whom / of what). Use it for absence, “of”, having with у, quantity, dates, comparison and after many prepositions.|سوال: кого؟ чего؟ . برای نبودن، «ـِ» مالکیت، داشتن با у، مقدار، تاریخ، مقایسه و بعد خیلی از حروف اضافه.',tb(['Use|کاربرد','Example|مثال'],[[T('Absence: нет, не было, не будет|نبودن|absence|الغياب|sự vắng mặt'),g('У Антона нет машины.','Anton has no car.|آنتون ماشین نداره.|Anton n’a pas de voiture.|ليس لدى أنطون سيارة.|Anton không có xe.')],[T('Possession “of”|مالکیت|possession « de »|الملكية|sở hữu “của”'),g('Это комната соседки.','This is the neighbor’s room.|این اتاقِ همسایه‌ست.|C’est la chambre de la voisine.|هذه غرفة الجارة.|Đây là phòng của cô hàng xóm.')],[T('у + person: having, taking from|у + آدم: داشتن، گرفتن از|у + personne|у + شخص|у + người'),g('Я взял ручку у друга.','I took a pen from my friend.|من خودکار رو از دوستم گرفتم.|J’ai pris un stylo à mon ami.|أخذت قلمًا من صديقي.|Tôi lấy bút từ bạn tôi.')],[T('Quantity: много, мало, несколько|مقدار|quantité|الكمية|số lượng'),g('В группе много студентов.','There are many students in the group.|تو گروه دانشجوی زیادی هست.|Il y a beaucoup d’étudiants.|في المجموعة طلاب كثيرون.|Trong nhóm có nhiều sinh viên.')],[T('Dates: какого числа?|تاریخ|dates|التواريخ|ngày tháng'),g('Двадцатого мая.','On May 20.|بیستم می.|Le 20 mai.|في العشرين من مايو.|Vào ngày 20 tháng 5.')],[T('Comparison “than”|مقایسه «از»|comparaison|المقارنة|so sánh'),g('Невский проспект короче Московского проспекта.','Nevsky Prospect is shorter than Moskovsky Prospect.|خیابان نفسکی از موسکوفسکی کوتاه‌تره.|La perspective Nevski est plus courte.|شارع نيفسكي أقصر من موسكوفسكي.|Đại lộ Nevsky ngắn hơn Moskovsky.')],[T('After prepositions|بعد از حروف اضافه|après prépositions|بعد حروف الجر|sau giới từ'),g('Мы живём далеко от центра.','We live far from the center.|ما دور از مرکز زندگی میکنیم.|Nous habitons loin du centre.|نسكن بعيدًا عن المركز.|Chúng tôi sống xa trung tâm.')]]));
h+=cd('2 · Singular endings|۲ · پایانه‌های مفرد','Masculine and neuter nouns take -а/-я; feminine nouns take -ы/-и. Remember: after к г х ш ж ч щ write only -и.|مذکر و خنثی -а/-я میگیرن؛ مؤنث -ы/-и. یادت باشه بعد از к г х ш ж ч щ فقط -и.',tb(['Gender|جنسیت','Nom → Gen','Rule|قاعده'],[['Masc.|مذکر','стол → <b>стола</b> · брат → <b>брата</b>','-∅ → -а'],['Masc.|مذکر','словарь → <b>словаря</b> · учитель → <b>учителя</b> · трамвай → <b>трамвая</b> · Андрей → <b>Андрея</b>','-ь / -й → -я'],['Neuter|خنثی','озеро → <b>озера</b> · море → <b>моря</b> · здание → <b>здания</b>','-о → -а · -е → -я · -ие → -ия'],['Neuter|خنثی','время → <b>времени</b>','-мя → -мени'],['Fem.|مؤنث','картина → <b>картины</b> · сестра → <b>сестры</b>','-а → -ы'],['Fem.|مؤنث','кухня → <b>кухни</b> · тётя → <b>тёти</b> · аудитория → <b>аудитории</b> · Мария → <b>Марии</b>','-я → -и · -ия → -ии'],['Fem.|مؤنث','тетрадь → <b>тетради</b> · мать → <b>матери</b> · дочь → <b>дочери</b>','-ь → -и (-ерь)'],['К Г Х Ш Ж Ч Щ','студентка → <b>студентки</b> · секретарша → <b>секретарши</b>','only -и']].map(r=>[T(r[0]),r[1],T(r[2])])));
h+=cd('3 · Plural endings|۳ · پایانه‌های جمع','The Genitive plural has four endings: -ов/-ев, -ей, and the zero ending. Animate plurals in the Accusative copy these forms.|جمع پادژ ۲ چهار حالت داره: -ов/-ев، -ей و بدون پایانه. مفعولیِ جمعِ جاندار هم همینا رو کپی میکنه.',tb(['Gender|جنسیت','Nom pl → Gen pl','Rule|قاعده'],[['Masc.|مذکر','столы → <b>столов</b> · журналисты → <b>журналистов</b>','-ов'],['Masc.|مذکر','трамваи → <b>трамваев</b>','-й → -ев'],['Masc.|مذکر','рубли → <b>рублей</b> · карандаши → <b>карандашей</b> · ножи → <b>ножей</b> · плащи → <b>плащей</b> · врачи → <b>врачей</b> · малыши → <b>малышей</b> · родители → <b>родителей</b>','-ь / ш ж ч щ → -ей'],['Neuter|خنثی','дела → <b>дел</b> · окна → <b>окон</b> · письма → <b>писем</b>','zero ending'],['Neuter|خنثی','моря → <b>морей</b> · здания → <b>зданий</b>','-е → -ей · -ие → -ий'],['Fem.|مؤنث','стены → <b>стен</b> · подруги → <b>подруг</b> · миля → <b>миль</b>','zero ending'],['Fem.|مؤنث','тетради → <b>тетрадей</b> · тёти → <b>тётей</b> · мыши → <b>мышей</b>','-ь → -ей'],['Fem.|مؤنث','идея → <b>идей</b> · семья → <b>семей</b> · аудитория → <b>аудиторий</b>','-я → -й · -ия → -ий']].map(r=>[T(r[0]),r[1],T(r[2])])));

tips:[['Fractions: the numerator is a feminine number, the denominator an ordinal: одна вторая, две третьих, три четвёртых, пять шестых (from 2 up the denominator is Genitive plural). Special words: половина, треть, четверть. Decimals use a comma: 3,5 = три целых пять десятых.','کسرها: صورت یه عدد مؤنثه و مخرج یه عدد ترتیبی: одна вторая، две третьих، три четвёртых، пять шестых (از ۲ به بالا مخرج جمعِ پادژ ۲ میشه). کلمه‌های ویژه: половина، треть، четверть. اعشار با ویرگول نوشته میشه: 3,5 = три целых пять десятых.','Fractions : le numérateur est un nombre féminin, le dénominateur un ordinal : одна вторая, две третьих, три четвёртых, пять шестых (à partir de 2, le dénominateur est au génitif pluriel). Mots spéciaux : половина, треть, четверть. Les décimaux s’écrivent avec une virgule : 3,5 = три целых пять десятых.','الكسور: البسط عدد مؤنث والمقام عدد ترتيبي: одна вторая، две третьих، три четвёртых، пять шестых (من ٢ فما فوق يكون المقام بجمع المضاف). كلمات خاصة: половина، треть، четверть. الأعداد العشرية بفاصلة: 3,5 = три целых пять десятых.','Phân số: tử số là số giống cái, mẫu số là số thứ tự: одна вторая, две третьих, три четвёртых, пять шестых (từ 2 trở lên mẫu số ở sở hữu cách số nhiều). Từ đặc biệt: половина, треть, четверть. Số thập phân dùng dấu phẩy: 3,5 = три целых пять десятых.']],

h+=`<p>✔ «${x.t==1?r.s:r.ex}» → ${x.t==1?r.ru+" ("+L5(r.nm)+")":r.rd+" ("+L5(r.rt)+")"}</p>`;
h+=`<p>💡 <span dir="ltr">${r.ex}</span> → ${r.rd}<br><span class="tr">${L5(r.rt)}</span></p>`;return h+'</div>'}
function drawMQ(){const u=U[lang];let h=mquizBar()+`<div class="card"><b>${u.score}: <span id="msc">${msc}</span> / ${mqs.length}</b></div>`,g='';
mqs.forEach((x,i)=>{const o=x.o.map((r,k)=>({t:x.t==1?r.ru:r.rd,k})).sort(()=>Math.random()-.5),col=MC[x.r.ci].col;
const q=L5(x.t==1?MQT.q1:MQT.q2).replace('{s}',x.t==1?x.r.s:x.r.ex);
g+=`<div class="card" style="--cc:${col}"><span class="pill">${x.r.ci+1}. ${MC[x.r.ci].ru}</span><div class="mqq" style="margin:6px 0" dir="auto">${q}</div><div>`+o.map(z=>`<button class="opt ru" data-mq="${i}" data-k="${z.k}" dir="auto">${z.t}</button>`).join("")+`</div><button class="btn" data-ms="${i}">${u.show}</button> <span class="ans" id="ma${i}">✔ ${x.t==1?x.r.ru:x.r.rd}</span><div id="me${i}"></div></div>`});
$("m").innerHTML=h+`<div class="qgrid">${g}</div>`;
$("m").querySelectorAll("[data-mm]").forEach(b=>b.onclick=()=>startMQ(+b.dataset.mm));
$("m").querySelectorAll("[data-mq]").forEach(b=>b.onclick=()=>{const bx=b.parentNode;if(bx.dataset.d)return;bx.dataset.d=1;const k=+b.dataset.k,i=+b.dataset.mq;b.classList.add(k==0?"ok":"no");if(k==0){msc++;$("msc").textContent=msc}else{bx.querySelectorAll(".opt").forEach(z=>{if(z.dataset.k==0)z.classList.add("ok")});$("me"+i).innerHTML=mwhy(mqs[i],k)}});
$("m").querySelectorAll("[data-ms]").forEach(b=>b.onclick=()=>{const i=b.dataset.ms;$("ma"+i).classList.add("s");const e=$("me"+i);if(!e.innerHTML)e.innerHTML=mwhy(mqs[i],null)})}
